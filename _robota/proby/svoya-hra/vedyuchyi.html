<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14182a">
<title>Своя гра — пульт ведучого</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Source+Sans+3:wght@400;600;700&display=swap">
<!-- «Своя гра» — пульт ведучого на його телефоні: правильні відповіді й кнопки ✓/✗. Відкривається лише з QR-коду на табло (у ньому ключ).
     Джерело: _robota/proby/svoya-hra/vedyuchyi.html -->
<style>
:root{--bg:#14182a;--card:#1d2238;--card2:#262c47;--ln:#343b5c;--ink:#f2f4f8;--mut:#a8afc8;--gd:#ffc247;--ok:#3daf6e;--no:#e5534b;--disp:Oswald,'Arial Narrow',sans-serif;--txt:'Source Sans 3',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:17px/1.4 var(--txt);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gd);outline-offset:2px}
[hidden]{display:none!important}
.in{max-width:560px;margin:0 auto;padding:12px 12px 120px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.top b{font:600 18px var(--disp);letter-spacing:.06em;text-transform:uppercase;color:var(--gd)}
.top .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;border:1px solid var(--ln);background:var(--card);font-weight:700;font-size:13px}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--gd)}.chip .dot.on{background:var(--ok)}
.sc{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.sc span{flex:1;min-width:30%;padding:6px 10px;border-radius:10px;background:var(--card);border-top:4px solid var(--c);font-weight:700;font-size:14px;display:flex;justify-content:space-between;gap:6px}
.sc span.ch{outline:2px solid var(--c)}
.sc span b{font:600 18px var(--disp)}.sc span small{white-space:nowrap;color:var(--mut);font-size:12px}
.hint{color:var(--mut);font-size:15px;margin:4px 2px 10px}
.hint i{font-style:normal;padding:1px 8px;border-radius:6px;background:var(--c);color:#fff;font-weight:700}
.bd{display:grid;gap:4px}
.bd .ct{font:600 11px/1.1 var(--disp);text-transform:uppercase;text-align:center;color:var(--mut);padding:4px 0;overflow-wrap:anywhere}
.bd button{min-height:46px;border-radius:9px;border:1px solid #3d4a8f;background:#2a3266;color:var(--gd);font:600 18px var(--disp)}
.bd button:disabled{background:var(--card);border-color:var(--card);color:transparent}
.qm{color:var(--mut);font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.04em}
.qm b{color:var(--gd);font:600 20px var(--disp);margin-left:6px}
.qq{margin:6px 0 12px;font:700 21px/1.3 var(--txt)}
.qa{padding:14px 16px;border-radius:16px;background:rgba(255,194,71,.12);border:2px solid var(--gd)}
.qa small{display:block;color:var(--mut);font-weight:700;font-size:13px;letter-spacing:.04em}
.qa b{font:600 26px/1.15 var(--disp);color:var(--gd)}
.qa .nt{margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,194,71,.3);color:var(--mut);font-size:15px}.qa .nt em{font-style:normal;font-weight:700;color:#cfd5dc}
.who.done{display:block;width:100%;font:inherit;font-weight:700;font-size:22px;color:#0e1f15;background:var(--ok);border-color:var(--ok);padding:16px 14px;cursor:pointer}
.who.done.none{background:var(--card2);border-color:var(--ln);color:var(--ink)}
.who.done small{display:block;font-size:15px;font-weight:700;opacity:.8;margin-top:4px}
.act .go{grid-column:1/-1;background:var(--gd);border-color:var(--gd);color:#1d1606;font-size:20px}
.who{margin:12px 0;padding:12px 14px;border-radius:14px;background:var(--card);font-weight:700;font-size:18px;text-align:center;border:2px solid var(--c,var(--ln))}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.picks button{min-height:48px;border-radius:12px;border:1px solid var(--ln);border-left:6px solid var(--c);background:var(--card);font-weight:700}
.picks button:disabled{opacity:.35}
.act{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(20,24,42,0),var(--bg) 30%)}
.act .row{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.act button{min-height:58px;border-radius:16px;border:1px solid var(--ln);background:var(--card2);font-weight:700;font-size:17px}
.act .yes{background:var(--ok);border-color:var(--ok);color:#0e1f15;font-size:20px}
.act .no{background:var(--no);border-color:var(--no);color:#fff;font-size:20px}
.act button:disabled{opacity:.35}
.wait{padding:30px 10px;text-align:center;color:var(--mut)}
.wait b{display:block;font:600 24px var(--disp);color:var(--ink);margin-bottom:6px}
.vr{display:grid;gap:6px;margin-top:10px}.vr div{padding:8px 12px;border-radius:10px;background:var(--card);font-weight:700}.vr div.ok{background:rgba(61,175,110,.25)}.vr b{color:var(--gd);margin-right:8px}
.act .hn{grid-column:1/-1;background:rgba(255,194,71,.14);border-color:var(--gd);color:var(--gd)}
.end{display:block;width:100%;margin-top:16px;min-height:46px;border-radius:12px;border:1px solid var(--ln);background:none;color:var(--mut);font-weight:700}
.pf{padding:18px 14px;border-radius:16px;background:var(--card);text-align:center}.pf b{display:block;font:600 22px var(--disp);margin-bottom:6px}.pf p{color:var(--mut);margin:0 0 12px}
.pf input{width:100%;min-height:58px;border-radius:14px;border:1px solid var(--ln);background:var(--card2);color:var(--ink);font:700 28px var(--txt);letter-spacing:.3em;text-align:center}
.pf button{width:100%;min-height:54px;margin-top:10px;border-radius:14px;border:0;background:var(--gd);color:#1d1606;font-weight:700;font-size:18px}.pf .er{color:#ff9a8a;font-weight:700;min-height:1.3em;margin-top:8px}
.rk{list-style:none;padding:0}.rk li{display:flex;justify-content:space-between;padding:10px 14px;margin:6px 0;border-radius:12px;background:var(--card);border-left:6px solid var(--c);font-weight:700;font-size:19px}
</style>
</head>
<body>
<div class="in">
  <div class="top"><b>Пульт ведучого</b><span class="sp"></span><span class="chip"><span class="dot" id="dot"></span><span id="stx">…</span></span></div>
  <div id="body"><div class="wait"><b>Підключаємось…</b></div></div>
</div>
<div class="act" id="act" hidden><div class="row" id="actr"></div></div>

<script>/*ZVYAZOK*/</script>
<script>
(function () {
'use strict';
const $ = s => document.querySelector(s);
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const splitA = a => { const m = String(a || '').match(/^(.*?)\s*\(([^()]*)\)\s*$/); return m && m[1] ? [m[1], m[2]] : [String(a || ''), '']; };   // «Говерла (2061 м)» → головне + довідка
const SK = 'svoya.ved';
let ses = {}; try { ses = JSON.parse(localStorage.getItem(SK) || '{}'); } catch (e) { ses = {}; }
const saveS = () => { try { localStorage.setItem(SK, JSON.stringify(ses)); } catch (e) { /* ok */ } };
if (!ses.dev) { ses.dev = Math.random().toString(36).slice(2) + Date.now().toString(36); saveS(); }
const qk = (new URLSearchParams(location.search).get('k') || '').replace(/\D/g, '').slice(0, 6);
const qv = new URLSearchParams(location.search).get('v') || '';
if (qk.length === 6 && ses.code !== qk) { ses.code = qk; ses.tok = ''; saveS(); }
let okey = qv;   // одноразовий ключ із QR
let authed = false;

const LIBS = ['https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.5/peerjs.min.js', 'https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js', 'https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js'];
const loadScript = src => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.async = true; s.onload = res; s.onerror = () => { s.remove(); rej(); }; document.head.appendChild(s); });
async function getPeer() { if (!window.Peer) for (const u of LIBS) { try { await loadScript(u); if (window.Peer) break; } catch (e) { /* далі */ } } return window.GutirkaNet ? window.GutirkaNet(window.Peer || null) : window.Peer; }
let peer = null, conn = null, att = 0, lastRx = 0, hb = 0, st = null;
function chip(on, t) { $('#dot').className = 'dot' + (on ? ' on' : ''); $('#stx').textContent = t; }
function stop() { att++; clearInterval(hb); try { conn && conn.close(); } catch (e) { /* ok */ } try { peer && peer.destroy(); } catch (e) { /* ok */ } conn = peer = null; }
const cmd = o => { try { conn && conn.send(Object.assign({ t: 'cmd' }, o)); } catch (e) { /* ok */ } if (navigator.vibrate) navigator.vibrate(30); };
async function connect() {
  stop(); const my = att; chip(false, 'Підключаємось…');
  let P; try { P = await getPeer(); } catch (e) { P = null; }
  if (my !== att) return;
  if (!P) { chip(false, 'Немає звʼязку'); return; }
  const p = peer = new P(undefined, window.GUTIRKA_PEER_OPTS || {});
  const tmo = setTimeout(() => { if (my === att && !(conn && conn.open)) { retry(my, 'Не знайшли гру'); askCode('Гру з кодом ' + ses.code + ' не знайдено. Перевірте код на екрані.'); } }, 15000);
  p.on('error', e => { if (my !== att) return; if (e && e.type === 'peer-unavailable') { clearTimeout(tmo); retry(my, 'Гру не знайдено'); askCode('Гру з кодом ' + ses.code + ' не знайдено. Перевірте код на екрані.'); } });
  p.on('open', () => {
    if (my !== att) return;
    const c = conn = p.connect('gutirky-svoya-' + ses.code, { reliable: true });
    c.on('open', () => { if (my !== att) return; clearTimeout(tmo); lastRx = Date.now(); c.send({ t: 'ved', dev: ses.dev, tok: ses.tok || '', key: okey }); chip(true, 'На звʼязку');
      hb = setInterval(() => { try { c.send({ t: 'ping' }); } catch (e) { /* ok */ } if (authed && Date.now() - lastRx > 16000) retry(my, 'Звʼязок перервався'); }, 4000); });
    c.on('data', d => { if (my !== att || !d) return; lastRx = Date.now();
      switch (d.t) {
        case 'vst': authed = true; st = d; render(); break;
        case 'ok': authed = true; ses.tok = d.tok; okey = ''; saveS(); try { history.replaceState(null, '', location.pathname); } catch (x) { /* ok */ } break;
        case 'needqr': msg('Підключіть телефон', 'На ноутбуці натисніть «📱 Підключити мій телефон» (у грі — «📱 Ведучий» угорі) і відскануйте код, що зʼявиться.'); break;
      } });
    c.on('close', () => { if (my === att) retry(my, 'Звʼязок перервався'); });
  });
}
function retry(my, why) { if (my !== att) return; stop(); chip(false, why + ' · пробуємо знову'); setTimeout(connect, 3000); }

function msg(t, s, again) { $('#act').hidden = true; $('#body').innerHTML = `<div class="pf"><b>${t}</b><p>${s}</p>${again ? '<button type="button" id="again">Спробувати знову</button>' : ''}</div>`; }
function askCode(err) {
  $('#act').hidden = true;
  $('#body').innerHTML = `<form class="pf" id="codef"><b>Код гри</b><p>6 цифр — великі жовті цифри на екрані гри.</p><input id="codev" inputmode="numeric" maxlength="7" autocomplete="off" placeholder="123 456" value="${esc(ses.code || '')}"><button type="submit">Далі</button><div class="er">${err || ''}</div></form>`;
}
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'codef') { const v = $('#codev').value.replace(/\D/g, ''); if (v.length === 6) { if (ses.code !== v) { ses.code = v; ses.tok = ''; saveS(); } $('#body').innerHTML = '<div class="wait"><b>Підключаємось…</b></div>'; connect(); } }
});
function render() {
  const B = $('#body'), A = $('#act'), R = $('#actr');
  const sc = `<div class="sc">${st.teams.map((t, i) => `<span style="--c:${t.c}"${st.ph === 'board' && i === st.chooser ? ' class="ch"' : ''}>${esc(t.n)} <small>💡${t.h}</small><b>${t.s}</b></span>`).join('')}</div>`;
  if (st.ph === 'lobby') { B.innerHTML = '<div class="wait"><b>Пульт підключено ✓</b>Натисніть «Почати гру» на табло. Тут ви бачитимете правильні відповіді.</div>'; A.hidden = true; return; }
  if (st.ph === 'fin') { B.innerHTML = sc + `<div class="wait"><b>Гру завершено</b></div><ol class="rk">${st.rank.map(([n, s, c]) => `<li style="--c:${c}"><span>${esc(n)}</span><span>${s}</span></li>`).join('')}</ol><button type="button" class="end" data-a="again">← Повернутися до табла</button>`; A.hidden = true; return; }
  if (st.ph === 'board') {
    const ch = st.teams[st.chooser] || st.teams[0];
    let g = `<div class="bd" style="grid-template-columns:repeat(${st.cats.length},1fr)">${st.cats.map(n => `<div class="ct">${esc(n)}</div>`).join('')}`;
    for (let r = 0; r < st.vals.length; r++) g += st.cats.map((_, c) => `<button type="button" data-c="${c}" data-r="${r}"${st.cells[c][r] !== 1 ? ' disabled' : ''}>${st.cells[c][r] ? st.vals[r] : ''}</button>`).join('');
    B.innerHTML = sc + `<p class="hint" id="bh">Вибирає питання: <i style="--c:${ch.c}">${esc(ch.n)}</i>. Натисніть клітинку, яку вони назвали, — питання зʼявиться на табло.</p>` + g + '</div><button type="button" class="end" data-end="1">Завершити гру й показати переможця</button>';
    A.hidden = true; return;
  }
  const Q = st.q; if (!Q) return;
  const T = Q.turn;
  let h = sc + `<div class="qm">${esc(Q.cat)}<b>${Q.worth !== Q.v ? Q.v + ' → ' + Q.worth : Q.v}</b></div><p class="qq">${esc(Q.q)}</p><div class="qa"><small>ПРАВИЛЬНА ВІДПОВІДЬ</small><b>${esc(splitA(Q.a)[0])}</b>${splitA(Q.a)[1] ? `<div class="nt">Для довідки, не обовʼязково: <em>${esc(splitA(Q.a)[1])}</em></div>` : ''}</div>` + (Q.vars ? '<div class="vr">' + Q.vars.map((o, i) => `<div class="${o === splitA(Q.a)[0] ? 'ok' : ''}"><b>${'АБВГ'[i]}</b>${esc(o)}</div>`).join('') + '</div>' : '');
  if (Q.done) h += `<button type="button" class="who done${T ? '' : ' none'}" data-a="back">${T ? '✓ ' + esc(T.tn) + ' +' + (Q.gain || Q.v) : 'Ніхто не відповів правильно'}<small>Натисніть — далі, до табла →</small></button>`;
  else if (T) h += `<div class="who" style="--c:${T.c}">Відповідає: ${esc(T.tn)}${T.name ? ' · ' + esc(T.name) : ''}</div>`;
  else h += `<div class="who">Чекаємо, хто натисне «Відповідаю!»</div><p class="hint">Або виберіть команду самі:</p><div class="picks">${st.teams.map((t, i) => `<button type="button" data-pick="${i}" style="--c:${t.c}"${Q.wrong.includes(i) ? ' disabled' : ''}>${esc(t.n)}</button>`).join('')}</div>`;
  B.innerHTML = h;
  A.hidden = !!Q.done;   /* після відповіді — лише зелена плашка «далі, до табла» */
  R.innerHTML = (Q.canHint ? '<button type="button" class="hn" data-a="hint">💡 Дати варіанти (половина балів)</button>' : '') + (T && !Q.done ? '<button type="button" class="yes" data-a="yes">✓ Правильно</button><button type="button" class="no" data-a="no">✗ Неправильно</button>' : '')
    + (Q.done ? '' : (Q.shown ? '' : '<button type="button" data-a="ans">Показати відповідь усім</button>') + '<button type="button" data-a="back">До табла</button>');
}
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'again') { try { conn.send({ t: 'ved', dev: ses.dev, tok: ses.tok || '' }); } catch (x) { connect(); } return; }
  if (!st) return;
  if (b.dataset.end) { if (confirm('Завершити гру й показати переможця?')) cmd({ a: 'end' }); return; }
  if (b.dataset.c != null) cmd({ a: 'open', c: +b.dataset.c, r: +b.dataset.r });
  else if (b.dataset.pick != null) cmd({ a: 'pick', team: +b.dataset.pick });
  else if (b.dataset.a) cmd({ a: b.dataset.a });
});
if ((ses.code || '').length === 6) connect(); else { chip(false, 'Немає коду'); askCode(''); }
})();
</script>
</body>
</html>
