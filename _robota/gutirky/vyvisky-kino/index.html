<style>

.sh{position:absolute;inset:0;pointer-events:none}

#plan .eyebrow{display:block;margin-top:26px;font:600 13px Golos;letter-spacing:.06em;color:var(--gd)}

#plan .hand{opacity:.7;margin-bottom:18px}
#plan .pr{padding:12px 18px;border-radius:12px;border:0;background:var(--gd);color:#1a1205;font:700 15px Golos;cursor:pointer}

  .ph{background-position:68% 50%}

  .tx.lt{top:auto;bottom:clamp(48px,11vh,110px)}
  .mark{display:none}
  .s-d3{background:radial-gradient(80% 50% at 50% 34%,#3a2410,#0a0705 62%,#050505)}
  .d3load{left:50%;top:34%}.d3hint{display:none}
}
@media (prefers-reduced-motion:reduce){.pts li,.s-plan li,.parts li{opacity:1;transform:none}}

/* 3D-літера: Spark (сплати) + Three.js підвантажуються лише на слайді «Будова літери» */
window.KINO3D = (() => {
  let st = null, loading = null;
  async function load(el) {
    const THREE = await import('three');
    const { SparkRenderer, SplatMesh } = await import('../../lib/spark-2.4.0/spark.module.js');
    const cv = document.createElement('canvas'); el.prepend(cv);
    const R = new THREE.WebGLRenderer({ canvas: cv, antialias: false, alpha: true }); R.setPixelRatio(Math.min(devicePixelRatio, 1.5));
    const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(32, 1, .01, 100);
    scene.add(new SparkRenderer({ renderer: R }));
    const g = new THREE.Group(); scene.add(g);
    const m = new SplatMesh({ url: 'litera.spz' });
    /* модель Idol: вісь y вниз, лице дивиться в −x → перевертаємо й повертаємо лицем до камери */
    m.quaternion.copy(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.PI / 2).multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), Math.PI)));
    g.add(m);
    await m.initialized;
    const b = m.getBoundingBox(), c = b.getCenter(new THREE.Vector3()); m.position.copy(c).applyQuaternion(m.quaternion).multiplyScalar(-1);
    const fit = () => { const w = el.clientWidth, h = el.clientHeight, wide = w > h; R.setSize(w, h, false); cam.aspect = w / h; cam.fov = wide ? 32 : 44; cam.updateProjectionMatrix();
      g.position.set(wide ? .42 : 0, wide ? 0 : .3, 0); cam.position.set(0, 0, wide ? 2.5 : 3.1); };
    addEventListener('resize', fit); fit();
    let drag = null, rot = -.5, vel = 0, on = false;
    cv.addEventListener('pointerdown', e => { drag = e.clientX; cv.setPointerCapture(e.pointerId); e.stopPropagation(); });
    cv.addEventListener('pointermove', e => { if (drag === null) return; vel = (e.clientX - drag) * .008; rot += vel; drag = e.clientX; });
    cv.addEventListener('pointerup', e => { drag = null; e.stopPropagation(); });
    const loop = t => { if (drag === null) { vel *= .94; rot += vel + .0016; } g.rotation.y = rot; g.rotation.x = Math.sin(t / 3000) * .04; R.render(scene, cam); };
    const ld = el.querySelector('.d3load'); if (ld) ld.remove();
    return { start() { if (!on) { on = true; R.setAnimationLoop(loop); } }, stop() { on = false; R.setAnimationLoop(null); } };
  }
  return {
    preload(el) { if (!loading) loading = load(el).then(s => (st = s)).catch(e => { const ld = el.querySelector('.d3load'); if (ld) ld.textContent = 'Не вдалося показати 3D на цьому пристрої'; console.warn(e); }); return loading; },
    start(el) { this.preload(el).then(() => st && st.start()); },
    stop() { if (st) st.stop(); }
  };
})();

      case 'd3': h = `<div class="d3load">Завантаження 3D-літери…</div><div class="tx l"><small>${s.k}</small><h2>${s.h}</h2><ul class="parts">${s.parts.map(([a, b]) => `<li><b>${a}</b><span>${b}</span></li>`).join('')}</ul></div><div class="d3hint">Потягніть літеру, щоб покрутити</div>`; break;
      case 'gra': h = `${bgb(s.bg)}<div class="gin"><div class="glogo"><small>Потужний</small><div><svg viewBox="0 0 40 40" aria-hidden="true"><rect width="18.5" height="18.5" rx="4" fill="#d64541"/><rect x="21.5" width="18.5" height="18.5" rx="4" fill="#2f6fd0"/><rect y="21.5" width="18.5" height="18.5" rx="4" fill="#e8a321"/><rect x="21.5" y="21.5" width="18.5" height="18.5" rx="4" fill="#2e8f55"/></svg><b>СКОБ!</b></div></div><p>Гра-вікторина: ${D.kviz.length} запитань по всій гутірці. Юнаки відповідають зі своїх телефонів — або всі разом уголос.</p>
        <div class="kbtn"><button class="go" type="button" data-g="game">Почати гру</button><button type="button" data-g="lobby">Підключити телефони</button><button type="button" data-g="skip">Пропустити</button></div></div>`; break;
      case 'end': h = `${bg(s.bg)}<div class="sh lt"></div><div class="tx lt"><small>Що далі</small><h2>${s.h}</h2><p>${s.p}</p></div>`; break;
    }
    return `<section class="sl s-${s.t}" data-i="${i}"${s.o ? ` data-o="${s.o}"` : ''}>${h}</section>`;
  }).join('');
  const S = $$('.sl', P);
  $('.nav').innerHTML = SL.map(() => '<i></i>').join('');
  const N = $$('.nav i');
  /* розмиті кадри для запитань і гри */
  let split = [];

  /* ── стан ── */
  let cur = -1, rev = 0, tl = null, qctl = null, T0 = 0;
  const steps = s => (s.pts && (s.t === 'sec' || s.t === 'card')) ? s.pts.length : 0;
  const words = i => split[i].flatMap(x => x.words);
  function textIn(i) {
    const t = gsap.timeline(), sec = S[i];
    if (split[i].length) t.fromTo(words(i), { yPercent: 115, opacity: 0 }, { yPercent: 0, opacity: 1, duration: RM ? .01 : .9, ease: 'expo.out', stagger: .04 });
    t.fromTo(sec.querySelectorAll('.tx > small, .tx > p, .s-title p'), { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: RM ? .01 : .8, ease: 'power3.out', stagger: .1 }, '-=.7');
    const list = sec.querySelectorAll('.s-plan li, .parts li');
    if (list.length) t.to(list, { opacity: 1, y: 0, duration: RM ? .01 : .6, ease: 'power3.out', stagger: .12 }, '-=.4');
    return t;
  }
  const drift = i => { const ph = S[i].querySelectorAll('.ph'); if (ph.length && !RM) gsap.fromTo(ph, { scale: 1.1 }, { scale: 1.02, duration: 16, ease: 'power1.out' }); };
  const showOnly = i => { S.forEach((s, k) => { s.style.visibility = k === i ? 'visible' : 'hidden'; s.style.zIndex = ''; }); };
  const marks = (i, anim) => { const m = S[i].querySelectorAll('.mark *'); if (!m.length) return; if (anim) gsap.fromTo(m, { strokeDashoffset: 400 }, { strokeDashoffset: 0, duration: 1.4, ease: 'power1.inOut', stagger: .3, delay: 1.2 }); else gsap.set(m, { strokeDashoffset: 0 }); };

  /* ── переходи: один основний і три особливі ── */
  function cross(a, b) {
    const t = gsap.timeline(), A = S[a], B = S[b];
    t.to(A.querySelectorAll('.tx, .qwrap, .gin, .d3hint'), { opacity: 0, y: -12, duration: .3, ease: 'power2.in' })
     .add(() => { B.style.visibility = 'visible'; B.style.zIndex = 3; drift(b); }, .1)
     .to(A.querySelectorAll('.ph'), { scale: '+=.05', duration: .9, ease: 'power2.in' }, 0)
     .fromTo(B, { opacity: 0 }, { opacity: 1, duration: .8, ease: 'power1.inOut' }, .1)
     .add(() => done(a, b))
     .add(textIn(b), .5);
    return t;
  }
  function intro() {
    const lit = S[0].querySelector('.lit'), t = gsap.timeline();
    showOnly(0); drift(0); gsap.set(lit, { opacity: 0 });
    t.fromTo(S[0], { opacity: 0 }, { opacity: 1, duration: 1.2, ease: 'power1.out' })
     .to(lit, { opacity: .7, duration: .05 }, 1.0).to(lit, { opacity: .1, duration: .07 }, 1.1)
     .to(lit, { opacity: .9, duration: .05 }, 1.35).to(lit, { opacity: .25, duration: .08 }, 1.45)
     .to(lit, { opacity: 1, duration: .5, ease: 'power2.out' }, 1.7)
     .to('.bar.t', { yPercent: -100, duration: 1.4, ease: 'expo.inOut' }, 2.0).to('.bar.b', { yPercent: 100, duration: 1.4, ease: 'expo.inOut' }, 2.0)
     .add(textIn(0), 2.5).to('.top', { opacity: 1, duration: 1 }, 3.0);
    if (RM) t.progress(1);
    return t;
  }
  function zoomMatch(a, b) {
    const t = gsap.timeline(), A = S[a], B = S[b], pa = A.querySelectorAll('.ph'), pb = B.querySelectorAll('.ph');
    gsap.set(pa, { transformOrigin: A.dataset.o }); gsap.set(pb, { transformOrigin: B.dataset.o });
    t.to(A.querySelectorAll('.tx'), { opacity: 0, duration: .4 })
     .to(pa, { scale: 6, duration: 1.4, ease: 'expo.in' }, .1)
     .add(() => { B.style.visibility = 'visible'; B.style.zIndex = 3; }, 1.05)
     .fromTo(B, { opacity: 0 }, { opacity: 1, duration: .45, ease: 'none' }, 1.05)
     .fromTo(pb, { scale: 6 }, { scale: 1.02, duration: 2.6, ease: 'expo.out' }, 1.05)
     .add(() => { done(a, b); gsap.set(pa, { scale: 1, transformOrigin: '50% 50%' }); })
     .add(textIn(b), 2.2);
    return t;
  }
  function laser(a, b) {
    const t = gsap.timeline(), A = S[a], B = S[b];
    t.to(A.querySelectorAll('.tx, .qwrap'), { opacity: 0, duration: .35 })
     .add(() => { B.style.visibility = 'visible'; B.style.zIndex = 3; drift(b); })
     .set('.beam', { opacity: 1, x: 0 })
     .fromTo(B, { clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0% 0 0)', duration: 1.3, ease: 'power2.inOut' })
     .fromTo('.beam', { x: 0 }, { x: () => innerWidth, duration: 1.3, ease: 'power2.inOut' }, '<')
     .to('.beam', { opacity: 0, duration: .2 })
     .add(() => { done(a, b); gsap.set(B, { clipPath: 'none' }); })
     .add(textIn(b), '-=.6');
    return t;
  }
  function done(a, b) { if (a >= 0) { S[a].style.visibility = 'hidden'; gsap.set(S[a].querySelectorAll('.tx, .qwrap, .gin, .d3hint'), { opacity: 1, y: 0 }); } S[b].style.zIndex = ''; }

  /* ── показ слайда ── */
  function enter(i) {
    const s = SL[i], sec = S[i];
    rev = 0; gsap.set(sec.querySelectorAll('.pts li'), { opacity: 0, y: 10 });
    if (qctl) { qctl.stop(); qctl = null; }
    if (s.t === 'q') qctl = SKOB.ask(sec.querySelector('.qwrap'), s, { label: `Запитання · частина ${ord(s.n)}`, T: 20,
      auto: () => { if (cur === i) go(i + 1); }, onPhase: ph => { $('.hint').textContent = ph === 'rev' ? 'Далі — наступний слайд' : SKOB.count() ? '' : 'Натисніть на відповідь'; } });
    if (s.t !== 'd3') KINO3D.stop();   /* 3D вмикаємо після переходу (див. go), щоб перехід не гальмував */
    const nx = SL[i + 1]; if (nx && nx.t === 'd3') KINO3D.preload(S[i + 1]);
    if (nx && nx.bg) { const im = new Image(); im.src = nx.bg + (nx.t === 'q' || nx.t === 'gra' ? '-b' : '') + '.webp'; }
    $('.hint').textContent = s.t === 'q' ? (SKOB.count() ? '' : 'Натисніть на відповідь') : i === 0 ? 'Натисніть пробіл або торкніться праворуч' : '← → або дотик';
    N.forEach((n, k) => n.classList.toggle('on', k === i));
    gsap.to('.top', { opacity: i === 0 ? 1 : 0, duration: .4 }); gsap.to('#corner', { opacity: i === 0 ? .35 : .55, duration: .4 });
    if (i > 0 && !T0) T0 = Date.now();
    document.dispatchEvent(new CustomEvent('gutirka:slide'));
  }
  function go(i, instant) {
    if (i < 0 || i >= SL.length || i === cur) return;
    if (tl) tl.progress(1);
    const a = cur; cur = i; enter(i);
    if (instant) { showOnly(i); gsap.set('.bar.t', { yPercent: -100 }); gsap.set('.bar.b', { yPercent: 100 }); gsap.set('.top', { opacity: i === 0 ? 1 : 0 }); tl = textIn(i); drift(i); marks(i, false); if (SL[i].t === 'd3') KINO3D.start(S[i]); return; }
    const s = SL[i], back = a > i;
    tl = a === -1 ? intro() : back ? cross(a, i) : s.fx === 'zoom' ? zoomMatch(a, i) : s.fx === 'laser' ? laser(a, i) : cross(a, i);
    marks(i, true);
    if (s.t === 'd3') tl.eventCallback('onComplete', () => { if (cur === i) KINO3D.start(S[i]); });
  }
  function reveal() { const li = S[cur].querySelectorAll('.pts li'); if (rev < li.length) { gsap.to(li[rev], { opacity: 1, y: 0, duration: RM ? .01 : .5, ease: 'power3.out' }); rev++; document.dispatchEvent(new CustomEvent('gutirka:slide')); return true; } return false; }
  const next = () => { if (tl && tl.isActive()) { tl.progress(1); return; } if (!reveal()) go(cur + 1); };
  const prev = () => go(cur - 1);

  /* ── керування ── */
  addEventListener('keydown', e => {
    if (!$('#plan').hidden) return;
    if (window.SKOB && SKOB.active() && SKOB.key(e)) return;
    if (e.target.closest && e.target.closest('#menu, .kbtn, .qwrap button')) { if (e.key === 'Escape') closeMenu(); return; }
    if ([' ', 'ArrowRight', 'PageDown', 'Enter'].includes(e.key)) { e.preventDefault(); next(); }
    else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); prev(); }
    else if (e.key === 'Escape') closeMenu();
  });
  let x0 = null;
  P.addEventListener('pointerdown', e => { x0 = e.target.closest('button, canvas, .sk-round') ? null : e.clientX; });
  P.addEventListener('pointerup', e => { if (x0 === null) return; const dx = e.clientX - x0; x0 = null; if (!$('#menu').hidden) return closeMenu();
    if (Math.abs(dx) > 50) dx < 0 ? next() : prev(); else e.clientX > innerWidth / 3 ? next() : prev(); });
  P.addEventListener('click', e => { const b = e.target.closest('[data-g]'); if (!b) return; const k = b.dataset.g; if (k === 'game') startGame(); else if (k === 'lobby') SKOB.lobby(); else go(cur + 1); });
  function startGame() { SKOB.game(D.kviz, { T: 20, onClose: () => { if (SL[cur].t === 'gra') go(cur + 1); } }); }

  /* меню */
  const closeMenu = () => { $('#menu').hidden = true; $('#corner').setAttribute('aria-expanded', 'false'); };
  $('#corner').addEventListener('click', () => { const m = $('#menu'); m.hidden = !m.hidden; $('#corner').setAttribute('aria-expanded', String(!m.hidden)); if (!m.hidden) m.querySelector('button').focus(); });
  $('#menu').addEventListener('click', e => { const b = e.target.closest('[data-m]'); if (!b) return; const k = b.dataset.m; closeMenu();
    if (k === 'skob') SKOB.lobby();
    else if (k === 'fs') { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); } catch (er) {} }
    else if (k === 'plan') location.hash = 'plan'; });

  /* ── пульт: підказки по кроках ── */
  const titleOf = s => !s ? '' : s.t === 'title' ? 'Титульний слайд' : s.t === 'q' ? 'Запитання: ' + s.q : s.t === 'gra' ? 'Гра «Потужний СКОБ!»' : s.t === 'think' ? strip(s.q) : s.t === 'd3' ? '3D: ' + strip(s.h) : strip(s.h);
  const noteOf = s => s.t === 'q' ? '❓ ' + s.q + '\n✔ ' + s.a[s.ok] + '\n• ' + s.why + '\n(Без телефонів — група радиться, хтось один натискає; правильно — далі само.)' : (s.h || s.q ? '📺 ' + titleOf(s) + '\n' : '') + (s.say ? '🗣 ' + s.say : '');
  const nsOf = s => s.pts && (s.t === 'sec' || s.t === 'card') ? [[null, noteOf(s)], ...s.pts.map((p, k) => ['пункт ' + (k + 1), '📺 ' + strip(p)])] : null;
  const SECTIONS = SL.map((s, i) => [s, i]).filter(([s]) => s.t === 'title' || s.t === 'sec' || s.t === 'gra' || s.t === 'end').map(([s, i]) => [s.t === 'title' ? 'Початок' : s.t === 'sec' ? 'Частина ' + s.n : s.t === 'gra' ? 'Гра' : 'Кінець', i]);
  window.GUTIRKA = { id: D.id + '-kino', title: D.nazva,
    state: () => { const s = SL[cur] || SL[0]; return { mode: 'full', index: Math.max(cur, 0), total: SL.length, title: titleOf(s), next: cur < SL.length - 1 ? titleOf(SL[cur + 1]) : '', note: noteOf(s), ns: nsOf(s),
      ix: SKOB.active() ? undefined : s.t === 'gra' ? { v: 'btns', h: 'Гра «Потужний СКОБ!»', b: [['game', 'Почати гру'], ['lobby', 'Підключити телефони'], ['skip', 'Пропустити гру']] } : null,
      step: rev, steps: steps(s), elapsed: T0 ? Math.floor((Date.now() - T0) / 1000) : 0, running: !!T0, target: 35 * 60, sections: SECTIONS }; },
    next: () => SKOB.active() ? SKOB.key(new KeyboardEvent('keydown', { key: 'ArrowRight' })) : next(), prev: () => SKOB.active() ? null : prev(),
    jump: i => { if (!SKOB.active() && i >= 0 && i < SL.length) go(i); },
    act: id => { if (SL[cur].t !== 'gra') return; if (id === 'game') startGame(); else if (id === 'lobby') SKOB.lobby(); else if (id === 'skip') go(cur + 1); },
    resetTimer: () => { T0 = cur > 0 ? Date.now() : 0; } };
  SKOB.on(() => document.dispatchEvent(new CustomEvent('gutirka:slide')));

  /* ── план для друку ── */
  function renderPlan() {
    let h = `<div class="mat"><b>Що підготувати</b><ul>${D.materialy.map(m => `<li>${esc(m)}</li>`).join('')}</ul></div>
      <div class="mat"><b>Як керувати</b><ul><li>Далі — пробіл, стрілка → або дотик праворуч; назад — стрілка ← або дотик ліворуч.</li><li>Меню — лілея в правому верхньому куті: «Потужний СКОБ!», пульт з телефона, повний екран, цей план.</li><li>Пункти на слайді зʼявляються по одному — розповідайте до кожного.</li><li>Нотатки й правильні відповіді видно лише вам — на телефоні-пульті. На екрані їх немає.</li></ul></div>`;
    SL.forEach(s => {
      if (s.t === 'title') h += '<h2>Початок<small>≈ 3 хв</small></h2>';
      if (s.t === 'sec') h += `<h2>Частина ${s.n}. ${esc(strip(s.h))}</h2>`;
      if (s.t === 'gra') h += '<h2>Підсумок<small>≈ 8 хв</small></h2>';
      const kind = s.t === 'q' ? '20 секунд' : s.t === 'd3' ? '3D — можна крутити' : s.pts ? 'пункти по одному' : '';
      const say = s.t === 'q' ? `<em>${esc(s.q)}</em> — правильна відповідь: «${esc(s.a[s.ok])}». ${esc(s.why)}` : esc(s.say || '');
      h += `<div class="row"><div class="t">${esc(titleOf(s))}${kind ? `<small>${kind}</small>` : ''}</div><div class="s">${say}</div></div>`;
    });
    $('#plan-box').innerHTML = h;
  }
  $('#b-print').addEventListener('click', () => { renderPlan(); print(); });
  function route() {
    const plan = location.hash === '#plan';
    $('#plan').hidden = !plan; P.hidden = plan; document.body.classList.toggle('pres', !plan);
    $$('.top, .nav, .hint, #corner, .grain').forEach(e => e.style.display = plan ? 'none' : '');
    if (plan) { renderPlan(); scrollTo(0, 0); KINO3D.stop(); if (window.SKOB) SKOB.close(); }
    else if (cur < 0) { if (START) START(); }
    else if (SL[cur].t === 'd3') KINO3D.start(S[cur]);
  }
  addEventListener('hashchange', route);

  const q = +new URLSearchParams(location.search).get('s'); let START = null;
  document.fonts.ready.then(() => {
    split = S.map(s => $$('h1, h2, q', s).filter(el => !el.closest('.qwrap, .gin')).map(el => new SplitText(el, { type: 'lines,words', mask: 'lines' })));
    START = () => go(q ? q - 1 : 0, !!q); route();
  });
})();
</script>
<script>window.GUTIRKA_PULT_URL = 'https://gutirky-fi.github.io/pult/';</script>
<script>/*PULT*/</script>
</body></html>
