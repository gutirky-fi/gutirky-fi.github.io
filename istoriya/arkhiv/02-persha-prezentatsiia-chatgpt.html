function mapHTML(slide){
 const focus=slide.mode==='focus';const place=slide.region||'';
 const meta=focus?`<span class="map-detail-pill">◈ Область: ${escapeText(({vin:'Вінницька',kyiv:'Київська',pol:'Полтавська',kos:'Івано-Франківська'})[place])}</span>`:sequence.map((code,i)=>`<span class="spot">${i+1}. ${({vin:'Вінниччина',kyiv:'Київщина',pol:'Полтавщина',kos:'Прикарпаття'})[code]}</span>`).join('');
 return `<div class="wrap map-wrap"><div class="map-head stagger"><div><p class="eyebrow">${slide.eyebrow}</p><h1 class="title">${slide.title}</h1></div><p class="map-lede">${slide.description}</p></div><div class="map-panel"><svg class="map-svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Карта України з позначеними зупинками керамічної мандрівки"><defs><linearGradient id="mapFill" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#72553e"/><stop offset=".5" stop-color="#44372e"/><stop offset="1" stop-color="#312d26"/></linearGradient></defs><g class="map-move" id="mapMove"><path class="land" d="${mapPath}"/><polyline class="routeline" points="${pathPoints}"/>${markerHTML}</g></svg></div><div class="map-meta">${meta}</div></div>`;

let current=0,busy=false,autoTimer=null,autoPlaying=false,lastMapFocus=null;
const stage=document.getElementById('stage');
const prev=document.getElementById('prev');const next=document.getElementById('next');const auto=document.getElementById('auto');
const focusTransform=code=>{const [x,y]=positions[code],scale=1.48;return `translate(${(400-scale*x).toFixed(1)}px,${(250-scale*y).toFixed(1)}px) scale(${scale})`};
function animateMap(s,scene){
 const mov=scene.querySelector('#mapMove');if(!mov)return;
 const currentFocus=s.mode==='focus'?s.region:null;
 // Every map slide visually travels between the overview and the selected stop.
 if(s.mode==='focus'){
   mov.style.transition='none';mov.style.transform='translate(0px,0px) scale(1)';
   requestAnimationFrame(()=>requestAnimationFrame(()=>{mov.style.transition='transform 1.65s cubic-bezier(.2,.7,.2,1)';mov.style.transform=focusTransform(currentFocus)}));
   const selected=mov.querySelector(`[data-region="${currentFocus}"]`); if(selected)selected.classList.add('selected');
   lastMapFocus=currentFocus;
 }else{
   if(lastMapFocus){mov.style.transition='none';mov.style.transform=focusTransform(lastMapFocus);requestAnimationFrame(()=>requestAnimationFrame(()=>{mov.style.transition='transform 1.55s cubic-bezier(.2,.7,.2,1)';mov.style.transform='translate(0px,0px) scale(1)'}))}else mov.style.transform='translate(0px,0px) scale(1)';
   lastMapFocus=null;
 }
}
function updateControls(){
 document.getElementById('pageNum').innerHTML=`${String(current+1).padStart(2,'0')} <span>/ ${String(slides.length).padStart(2,'0')}</span>`;
 document.getElementById('progress').style.width=(100*(current+1)/slides.length)+'%';

 next.innerHTML=current===slides.length-1?'Спочатку <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6M3 4v5h5"/></svg>':'Далі <svg viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>';

function show(index,direction='next'){
 if(busy||index<0||index>=slides.length)return;
 busy=true;const old=stage.querySelector('.scene');current=index;
 const s=slides[current];let el=document.createElement('section');el.className='scene';el.setAttribute('aria-label',s.label);el.innerHTML=contentHTML(s);stage.append(el);updateControls();
 if(old){old.classList.remove('show');old.classList.add(direction==='back'?'leave-back':'leave-next');old.setAttribute('aria-hidden','true')}
 requestAnimationFrame(()=>requestAnimationFrame(()=>{el.classList.add('show');animateMap(s,el)}));
 setTimeout(()=>{if(old)old.remove();busy=false},740);
 if(autoPlaying){clearTimeout(autoTimer);if(current<slides.length-1){autoTimer=setTimeout(()=>show(current+1),6500)}else stopAuto()}
}
function go(n){if(busy)return;const dest=n>=slides.length?0:n;show(dest,dest<current?'back':'next')}
function stopAuto(){autoPlaying=false;clearTimeout(autoTimer);auto.classList.remove('autoplay-on');auto.setAttribute('aria-pressed','false');auto.innerHTML='<svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg><span class="autotext">Авто</span>'}

next.addEventListener('click',()=>{if(current===slides.length-1){stopAuto();show(0,'back')}else go(current+1)});

document.getElementById('full').addEventListener('click',()=>{if(document.fullscreenElement){document.exitFullscreen().catch(()=>{})}else if(document.documentElement.requestFullscreen){document.documentElement.requestFullscreen().catch(()=>{})}});
document.addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(current+1)}if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}if(e.key==='Home')go(0)});
let down=null;stage.addEventListener('touchstart',e=>{if(e.touches.length===1)down={x:e.touches[0].clientX,y:e.touches[0].clientY}}, {passive:true});stage.addEventListener('touchend',e=>{if(!down||e.changedTouches.length!==1)return;const dx=e.changedTouches[0].clientX-down.x,dy=e.changedTouches[0].clientY-down.y;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.3)go(current+(dx<0?1:-1));down=null},{passive:true});
