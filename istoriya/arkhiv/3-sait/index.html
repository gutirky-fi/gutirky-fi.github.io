<!DOCTYPE html>
<html lang="uk"><head>
<meta name="robots" content="noindex, nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Кераміка України</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Caveat:wght@500&family=Source+Sans+3:wght@400;600&display=swap">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(65% 60% at 40% 45%,#2a2e35,#181a1d 80%);color:#f2f4f6;font:17px/1.5 'Source Sans 3',system-ui,sans-serif;padding:24px}
main{max-width:640px;width:100%;border-left:1px solid #3b4048;padding-left:28px}
i{font:500 1.6rem Caveat,cursive;color:#2fd2c0}
h1{font:600 clamp(2rem,8vw,3.6rem)/1.05 Oswald,'Arial Narrow',sans-serif;text-transform:uppercase;letter-spacing:.1em;margin:.1em 0 .6em}
a{display:block;text-decoration:none;color:#f2f4f6;background:#25282d;border:1px solid #383d44;border-left:4px solid #2fd2c0;border-radius:0 12px 12px 0;padding:16px 20px;margin:12px 0;transition:.2s}
a:hover{background:#2f343a}a b{font:600 1.3rem Oswald,sans-serif;letter-spacing:.06em;text-transform:uppercase;display:block}a span{color:#a0a8b2}
</style></head><body><main><i>подорож Україною</i><h1>Кераміка України</h1>
<div id="list"></div>
</main>
<script>
/* Щоб додати нову гутірку: створіть папку з index.html і додайте сюди рядок [папка, назва, опис] */
const G=[["povna/","Повна гутірка · 45–50 хв","Для сходин в осередку: усі 9 регіонів, історія, технологія, вікторина"],
["vyshkil/","Вишкіл · до 20 хв","Коротка версія: головне, три піали, 2 запитання вікторини"]];
document.getElementById("list").innerHTML=G.map(g=>`<a href="${g[0]}"><b>${g[1]}</b><span>${g[2]}</span></a>`).join("");
</script></body></html>
