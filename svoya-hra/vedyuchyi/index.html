<style>

.qm{color:var(--mut);font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.04em}

.act .go{grid-column:1/-1;background:var(--gd);border-color:var(--gd);color:#1d1606;font-size:20px}

.picks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}

<script>
/* «Репетиція» (4.11.2026): тестові гравці, щоб ведучий міг прогнати гру сам, без юнаків.
   1) На сторінці гравця (СКОБ, Бінго, Опитування, Змаг): якщо в адресі є ?bot=N — сторінка сама входить у гру
      під тестовим іменем і сама грає (відповідає, позначає кульки, голосує, тисне «Відповідаю!»).
      Свій «запис» у сховищі браузера (bot.N.…), щоб тестові гравці не плутались між собою й зі справжнім.
   2) На екрані ведучого: window.REPETYTSIIA(urlFn, n) — додає n невидимих тестових гравців (iframe), повторний виклик — прибирає. */
(function () {
  'use strict';
  const q = new URLSearchParams(location.search), BOT = q.get('bot');
  if (BOT !== null && /^\d{1,2}$/.test(BOT)) {
    /* --- тестовий гравець --- */
    const N = +BOT, pre = 'bot.' + N + '.';
    [Storage.prototype].forEach(P => {
      const g = P.getItem, s = P.setItem, r = P.removeItem;

<script>
/* Звʼязок пульта з гутіркою — з запасними каналами (з 22.10.2026).

     1) PeerJS (безкоштовний сервер 0.peerjs.com) — як і раніше;
     2) запасний: кілька публічних MQTT-брокерів через WebSocket (повідомлення йдуть через усі, повтори відкидаються).

   Брокери можна замінити: window.GUTIRKA_MQTT = ['wss://…', …] (перед завантаженням). */

  'use strict';

  const NS = 'gutirky-fi/v1/';
  const rnd = n => { const a = new Uint8Array(n); crypto.getRandomValues(a); return [...a].map(b => (b % 36).toString(36)).join(''); };
  class Em {
    constructor() { this._h = {}; }
    on(e, f) { (this._h[e] = this._h[e] || []).push(f); return this; }
    off(e, f) { this._h[e] = (this._h[e] || []).filter(x => x !== f); return this; }

  }

  const te = new TextEncoder(), td = new TextDecoder();

  const len = n => { const o = []; do { let d = n % 128; n = Math.floor(n / 128); if (n > 0) d |= 128; o.push(d); } while (n > 0); return o; };

    open() {

    }

    send(d) {

    }
    async inMsg(text) {

    }

      constructor(id, opts) {
        super(); this.id = id; this.inner = []; this.destroyed = false; this.opened = false; this.errs = 0;

            p.isUp = false;
            if (!this.inner.some(x => x.isUp)) this.emit('error', e);   // помилка лише тоді, коли не працює жоден шлях
          });
          p.on('disconnected', () => {
            p.isUp = false;
            if (!this.inner.some(x => x.isUp)) { this.emit('disconnected'); return; }
            // інший шлях працює — цей відновлюємо самі, тихо
            const again = () => { if (this.destroyed || p.destroyed || !p.disconnected) return; try { p.reconnect(); } catch (e) { /* ok */ } setTimeout(again, 10000); };
            setTimeout(again, 3000);

          p.on('close', () => { p.isUp = false; if (!this.destroyed && !this.inner.some(x => x.isUp)) this.emit('close'); });
        };

        try { add(new RelayPeer(id), 'relay'); } catch (e) { /* без запасного */ }
      }
      get disconnected() { return !this.inner.some(x => x.isUp); }
      connect(id, opts) { return new NetConn(this, id, opts); }
      reconnect() { this.inner.forEach(p => { if (p.disconnected && !p.destroyed) try { p.reconnect(); } catch (e) { /* ok */ } }); }
      destroy() { this.destroyed = true; this.inner.forEach(p => { try { p.destroy(); } catch (e) { /* ok */ } }); }
    }
    return NetPeer;
  };
  window.GutirkaNet.RelayPeer = RelayPeer;
})();

  const tb = document.querySelector('.top b'); if (tb) tb.insertAdjacentHTML('afterend', '<span class="fm-logo board sm" aria-label="Інтелектуальний змаг">' + T + '</span>');
  const h = document.querySelector('#join h1'); if (h) h.outerHTML = '<span class="fm-logo board" aria-label="Інтелектуальний змаг"><small>Інтелектуальний</small>' + T + '</span>';
}
if (S3T) {   /* стиль 3: затверджений логотип «значок + назва» (як у пульті інших ігор) */
  const tb = document.querySelector('.top b'); if (tb) tb.outerHTML = '<span class="g3" aria-label="Інтелектуальний змаг"><svg viewBox="0 0 40 40" aria-hidden="true"><g fill="none" stroke="#ffc247" stroke-width="2.4"><rect x="1.2" y="1.2" width="10.6" height="10.6" rx="2.6"/><rect x="14.7" y="1.2" width="10.6" height="10.6" rx="2.6"/><rect x="28.2" y="1.2" width="10.6" height="10.6" rx="2.6"/><rect x="1.2" y="14.7" width="10.6" height="10.6" rx="2.6"/><rect x="28.2" y="14.7" width="10.6" height="10.6" rx="2.6"/><rect x="1.2" y="28.2" width="10.6" height="10.6" rx="2.6"/><rect x="14.7" y="28.2" width="10.6" height="10.6" rx="2.6"/><rect x="28.2" y="28.2" width="10.6" height="10.6" rx="2.6"/></g><rect x="13.5" y="13.5" width="13" height="13" rx="3" fill="#ffc247"/></svg><span><small>Інтелектуальний</small><b>Змаг</b></span></span>';
  document.body.classList.add('s3');
  document.head.insertAdjacentHTML('beforeend', '<style>.s3 .top{gap:6px}.s3 .hend{padding:0 10px!important}.s3 .g3 small{letter-spacing:.14em!important}.s3 .top>*{flex:none}.s3 .top .sp{flex:1}.s3 .top .g3{flex:0 1 auto;min-width:0;overflow:hidden}.s3 .hend{min-height:38px;padding:0 12px;border-radius:12px;border:1px solid var(--ln);background:none;color:var(--mut);font-weight:700;font-size:14px;white-space:nowrap}.s3 .end[data-end]{display:none}</style>');
  /* шапка як у пульті інших ігор: логотип · ✕ Завершити (лише під час гри) · крапка звʼязку */
  document.querySelector('.top .chip').insertAdjacentHTML('beforebegin', '<button type="button" class="hend" data-end="1" hidden>✕ Завершити</button>');
  document.head.insertAdjacentHTML('beforeend', '<style>.s3 .chip{padding:0 0 0 6px;border:0;background:none;height:38px}.s3 .chip .dot{width:11px;height:11px}.s3 .chip #stx{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}.s3 .chip #stx{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}.s3 .top{margin-bottom:12px}.s3 .qa{background:color-mix(in srgb,#3daf6e 15%,var(--bg));border-color:#3daf6e}.s3 .qa small{color:#cfd5dc;font-weight:600;font-size:14px;letter-spacing:0}.s3 .qa b{color:#fff;font-size:27px}.s3 .qa .nt{border-top-color:rgba(61,175,110,.4)}.s3 .who:not(.done){display:flex;align-items:center;justify-content:flex-start;gap:9px;background:none;border:0;padding:2px;text-align:left;font-size:18px}.s3 .who:not(.done)::before{content:"";flex:none;width:11px;height:11px;border-radius:50%;background:var(--c,#6b7480)}.s3 .qm b{color:var(--ink)}.s3 .act .hn{background:var(--card2);border-color:var(--ln);color:var(--ink)}.s3 .act .hn svg{color:var(--gd)}.s3 .sc span{flex-wrap:wrap;justify-content:flex-start;column-gap:6px;row-gap:2px;padding:8px 10px;border-radius:12px;font-size:15px}.s3 .sc span b{width:100%;font-size:24px;line-height:1}</style>');
  document.head.insertAdjacentHTML('beforeend', '<style>.g3{display:inline-flex;align-items:center;gap:9px}.g3 svg{width:34px;height:34px;flex:none}.g3>span{display:flex;flex-direction:column}.g3 small{font:600 10px/1 var(--disp);letter-spacing:.28em;text-transform:uppercase;color:var(--gd);margin-bottom:3px}.g3 b{font:600 24px/.9 var(--disp);text-transform:uppercase;color:var(--ink)}</style>');
}
(function () {
'use strict';
const $ = s => document.querySelector(s);
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const splitA = a => { const m = String(a || '').match(/^(.*?)\s*\(([^()]*)\)\s*$/); return m && m[1] ? [m[1], m[2]] : [String(a || ''), '']; };   // «Говерла (2061 м)» → головне + довідка
const SK = 'svoya.ved';
let ses = {}; try { ses = JSON.parse(localStorage.getItem(SK) || '{}'); } catch (e) { ses = {}; }
const saveS = () => { try { localStorage.setItem(SK, JSON.stringify(ses)); } catch (e) { /* ok */ } };
if (!ses.dev) { ses.dev = Math.random().toString(36).slice(2) + Date.now().toString(36); saveS(); }
const qk = (new URLSearchParams(location.search).get('k') || '').replace(/\D/g, '').slice(0, 6);
const qv = new URLSearchParams(location.search).get('v') || '';
if (qk.length === 6 && ses.code !== qk) { ses.code = qk; ses.tok = ''; saveS(); }
let okey = qv;   // одноразовий ключ із QR
let authed = false;

const LIBS = ['https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.5/peerjs.min.js', 'https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js', 'https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js'];
const loadScript = src => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.async = true; s.onload = res; s.onerror = () => { s.remove(); rej(); }; document.head.appendChild(s); });
async function getPeer() { if (!window.Peer) for (const u of LIBS) { try { await loadScript(u); if (window.Peer) break; } catch (e) { /* далі */ } } return window.GutirkaNet ? window.GutirkaNet(window.Peer || null) : window.Peer; }
let peer = null, conn = null, att = 0, lastRx = 0, hb = 0, st = null;
function chip(on, t) { $('#dot').className = 'dot' + (on ? ' on' : ''); $('#stx').textContent = t; }
function stop() { att++; clearInterval(hb); try { conn && conn.close(); } catch (e) { /* ok */ } try { peer && peer.destroy(); } catch (e) { /* ok */ } conn = peer = null; }
const cmd = o => { try { conn && conn.send(Object.assign({ t: 'cmd' }, o)); } catch (e) { /* ok */ } if (navigator.vibrate) navigator.vibrate(30); };
async function connect() {
  stop(); const my = att; chip(false, 'Підключаємось…');
  let P; try { P = await getPeer(); } catch (e) { P = null; }
  if (my !== att) return;
  if (!P) { chip(false, 'Немає звʼязку'); return; }
  const p = peer = new P(undefined, window.GUTIRKA_PEER_OPTS || {});
  const tmo = setTimeout(() => { if (my === att && !(conn && conn.open)) { retry(my, 'Не знайшли гру'); askCode('Гру з кодом ' + ses.code + ' не знайдено. Перевірте код на екрані.'); } }, 15000);
  p.on('error', e => { if (my !== att) return; if (e && e.type === 'peer-unavailable') { clearTimeout(tmo); retry(my, 'Гру не знайдено'); askCode('Гру з кодом ' + ses.code + ' не знайдено. Перевірте код на екрані.'); } });
  p.on('open', () => {
    if (my !== att) return;
    const c = conn = p.connect('gutirky-svoya-' + ses.code, { reliable: true });
    c.on('open', () => { if (my !== att) return; clearTimeout(tmo); lastRx = Date.now(); c.send({ t: 'ved', dev: ses.dev, tok: ses.tok || '', key: okey }); chip(true, 'На звʼязку');
      hb = setInterval(() => { try { c.send({ t: 'ping' }); } catch (e) { /* ok */ } if (authed && Date.now() - lastRx > 16000) retry(my, 'Звʼязок перервався'); }, 4000); });
    c.on('data', d => { if (my !== att || !d) return; lastRx = Date.now();
      switch (d.t) {
        case 'vst': authed = true; st = d; render(); break;
        case 'ok': authed = true; ses.tok = d.tok; okey = ''; saveS(); try { history.replaceState(null, '', location.pathname); } catch (x) { /* ok */ } break;
        case 'needqr': msg('Відскануйте код ще раз', 'Відскануйте QR-код «Ведучому» на ноутбуці (у грі — кнопка «Ведучому» угорі).'); break;
      } });
    c.on('close', () => { if (my === att) retry(my, 'Звʼязок перервався'); });
  });
}
function retry(my, why) { if (my !== att) return; stop(); chip(false, why + ' · пробуємо знову'); setTimeout(connect, 3000); }

function msg(t, s, again) { $('#act').hidden = true; $('#body').innerHTML = `<div class="pf"><b>${t}</b><p>${s}</p>${again ? '<button type="button" id="again">Спробувати знову</button>' : ''}</div>`; }
function askCode(err) {
  $('#act').hidden = true;
  $('#body').innerHTML = `<form class="pf" id="codef"><b>Код гри</b><p>6 цифр — великі жовті цифри на екрані гри.</p><input id="codev" inputmode="numeric" maxlength="7" autocomplete="off" placeholder="123 456" value="${esc(ses.code || '')}"><button type="submit">Далі</button><div class="er">${err || ''}</div></form>`;
}
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'codef') { const v = $('#codev').value.replace(/\D/g, ''); if (v.length === 6) { if (ses.code !== v) { ses.code = v; ses.tok = ''; saveS(); } $('#body').innerHTML = '<div class="wait"><b>Підключаємось…</b></div>'; connect(); } }
});
function render() {
  const B = $('#body'), A = $('#act'), R = $('#actr');
  { const he = document.querySelector('.hend'); if (he) he.hidden = !(st.ph === 'board' || st.ph === 'q'); }
  const sc = `<div class="sc">${st.teams.map((t, i) => `<span style="--c:${t.c}"${st.ph === 'board' && i === st.chooser ? ' class="ch"' : ''}>${esc(t.n)} <small>${IC_BULB}${t.h}</small><b>${t.s}</b></span>`).join('')}</div>`;
  if (st.ph === 'lobby') { B.innerHTML = '<div class="wait"><b>Пульт підключено ✓</b>Натисніть «Почати гру» на табло. Тут ви бачитимете правильні відповіді.</div>'; A.hidden = true; return; }
  if (st.ph === 'fin') { B.innerHTML = sc + `<div class="wait"><b>Гру завершено</b></div><ol class="rk">${st.rank.map(([n, s, c]) => `<li style="--c:${c}"><span>${esc(n)}</span><span>${s}</span></li>`).join('')}</ol><button type="button" class="end" data-a="again">← Повернутися до табла</button>`; A.hidden = true; return; }
  if (st.ph === 'board') {
    const ch = st.teams[st.chooser] || (st.mode === 'sam' ? null : st.teams[0]);
    let g = `<div class="bd" style="grid-template-columns:repeat(${st.cats.length},1fr)">${st.cats.map(n => `<div class="ct">${esc(n)}</div>`).join('')}`;
    for (let r = 0; r < st.vals.length; r++) g += st.cats.map((_, c) => `<button type="button" data-c="${c}" data-r="${r}"${st.cells[c][r] !== 1 ? ' disabled' : ''}>${st.cells[c][r] ? st.vals[r] : ''}</button>`).join('');
    B.innerHTML = sc + (ch ? `<p class="hint" id="bh">Вибирає питання: <i style="--c:${ch.c}">${esc(ch.n)}</i>. Натисніть клітинку, яку ${st.mode === 'sam' ? 'назвали' : 'вони назвали'}, — питання зʼявиться на табло.</p>` : '<p class="hint" id="bh">Перше питання вибираєте ви — натисніть будь-яку клітинку.</p>') + g + '</div><button type="button" class="end" data-end="1">Завершити гру й показати переможця</button>';
    A.hidden = true; return;
  }
  const Q = st.q; if (!Q) return;
  const T = Q.turn;
  let h = sc + `<div class="qm">${esc(Q.cat)}<b>${Q.worth !== Q.v ? Q.v + ' → ' + Q.worth : Q.v}</b></div><p class="qq">${esc(Q.q)}</p><div class="qa"><small>ПРАВИЛЬНА ВІДПОВІДЬ</small><b>${esc(splitA(Q.a)[0])}</b>${splitA(Q.a)[1] ? `<div class="nt">Для довідки, не обовʼязково: <em>${esc(splitA(Q.a)[1])}</em></div>` : ''}</div>` + (Q.vars ? '<div class="vr">' + Q.vars.map((o, i) => `<div class="${o === splitA(Q.a)[0] ? 'ok' : ''}"><b>${'АБВГ'[i]}</b>${esc(o)}</div>`).join('') + '</div>' : '');
  if (Q.done) h += `<button type="button" class="who done${T ? '' : ' none'}" data-a="back">${T ? '✓ ' + esc(T.tn) + ' +' + (Q.gain || Q.v) : 'Ніхто не відповів правильно'}<small>Натисніть — далі, до табла →</small></button>`;
  else if (T) h += `<div class="who" style="--c:${T.c}">Відповідає: ${esc(T.tn)}${T.name ? ' · ' + esc(T.name) : ''}</div>`;
  else h += `<div class="who">Чекаємо, хто натисне «Відповідаю!»</div><p class="hint">Або виберіть команду самі:</p><div class="picks">${st.teams.map((t, i) => `<button type="button" data-pick="${i}" style="--c:${t.c}"${Q.wrong.includes(i) ? ' disabled' : ''}>${esc(t.n)}</button>`).join('')}</div>`;
  B.innerHTML = h;
  A.hidden = !!Q.done;   /* після відповіді — лише зелена плашка «далі, до табла» */
  R.innerHTML = (Q.canHint ? '<button type="button" class="hn" data-a="hint">' + IC_BULB + ' Дати варіанти (половина балів)</button>' : '') + (T && !Q.done ? '<button type="button" class="yes" data-a="yes">✓ Правильно</button><button type="button" class="no" data-a="no">✗ Неправильно</button>' : '')
    + (Q.done ? '' : (Q.shown ? '' : '<button type="button" data-a="ans">Показати відповідь усім</button>') + '<button type="button" data-a="back">До табла</button>');
}
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'again') { try { conn.send({ t: 'ved', dev: ses.dev, tok: ses.tok || '' }); } catch (x) { connect(); } return; }
  if (!st) return;
  if (b.dataset.end) { if (confirm('Завершити гру й показати переможця?')) cmd({ a: 'end' }); return; }
  if (b.dataset.c != null) cmd({ a: 'open', c: +b.dataset.c, r: +b.dataset.r });
  else if (b.dataset.pick != null) cmd({ a: 'pick', team: +b.dataset.pick });
  else if (b.dataset.a) cmd({ a: b.dataset.a });
});
if ((ses.code || '').length === 6) connect(); else { chip(false, 'Немає коду'); askCode(''); }
})();
</script>
