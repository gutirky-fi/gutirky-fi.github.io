:root{
  /* основа — темний екран */
  --s-bg:#1b1d21; --s-card:#22262b; --s-card2:#2a2f35; --s-pole:#14171a; --s-ln:#383d44;
  --s-ink:#f2f4f6; --s-body:#cfd5dc; --s-mut:#a0a8b2;
  /* улади: колір показує, для кого сторінка; «-t» — світліший, для тексту на темному; «-on» — текст на кнопці цього кольору */
  --s-upn:#ffd23f; --s-upn-on:#1d1606;
  --s-upyu:#c8284a; --s-upyu-t:#ff7d99; --s-upyu-on:#ffffff;
  --s-vyh:#3daf6e; --s-vyh-t:#62cf93; --s-vyh-on:#0e1f15;
  --s-ups:#b0773a;
  --s-all:#c9cfd6;
  --s-all4:linear-gradient(90deg,var(--s-upn) 0 25%,var(--s-upyu) 0 50%,var(--s-vyh) 0 75%,var(--s-ups) 0);
  /* службові */
  --s-ihry:#ffc247; --s-ihry-on:#1d1606;
  --s-hand:#2fd2c0; --s-ol:#9fb57a;
  --s-ok:#62cf93; --s-uvaga:#f0c060; --s-pomylka:#ff6a6a;
  /* папір (бланки, звіти, PDF) */
  --s-p-bg:#ffffff; --s-p-ink:#1d2125; --s-p-mut:#5f6873; --s-p-ln:#cfd5dc; --s-p-ac:#c8284a; --s-p-th:#f9e6ea;
  /* шрифти */
  --s-disp:Oswald,'Arial Narrow',sans-serif; --s-txt:'Source Sans 3',system-ui,sans-serif; --s-ruka:Caveat,'Segoe Print',cursive;
  /* заокруглення: кнопка й поле 12, плитка 18, велика картка й вікно 20, пігулка кругла; дрібні деталі: мітка 6, смужка 3 */
  --s-r:12px; --s-r-plytka:18px; --s-r-karta:20px; --s-r-pil:99px; --s-r-mitka:6px; --s-r-smuzhka:3px;
  /* висота: звичайна кнопка й поле 50, головна кнопка гри 54 */
  --s-h:50px; --s-h-hra:54px;
}
/* ═══ КНОПКИ — одна реакція на всіх сторінках ═══
   навели: рамка кольором розділу (головна кнопка — біла рамка) · натиснули: темнішає й опускається ·
   клавіатура або пульт: біла обвідка · недоступна: бліда · «видалити»: не залита, червоний напис */
:root :is(button,a,summary,[role=button],[tabindex]):focus-visible{outline:3px solid var(--s-ink);outline-offset:2px}
:root .btn:where(:not(.main,.ok,[disabled])):hover{border-color:var(--ak,var(--d-t,var(--gd,var(--ab,var(--a,var(--s-ink))))));box-shadow:0 0 0 1px var(--ak,var(--d-t,var(--gd,var(--ab,var(--a,var(--s-ink))))))}
:root .btn:is(.main,.ok):where(:not([disabled])):hover{border-color:var(--s-ink);box-shadow:0 0 0 1px var(--s-ink)}
:root .btn:where(:not([disabled])):active{transform:translateY(2px);filter:brightness(.88)}
:root .btn[disabled]{opacity:.45;cursor:not-allowed}
:root .btn.neb,:root .btn.warn{background:var(--s-card2);border-color:var(--s-ln);color:var(--s-pomylka)}
:root .btn:is(.neb,.warn):where(:not([disabled])):hover,:root .btn.warn.sure{border-color:var(--s-pomylka);box-shadow:0 0 0 1px var(--s-pomylka)}
:root .btn.warn.sure{background:rgba(255,106,106,.14)}
/* ═══ кінець стандарту ═══ */
/*/standart*/

:root{--bg:var(--s-bg);--card:var(--s-card);--card2:var(--s-card2);--ln:var(--s-ln);--ink:var(--s-ink);--mut:var(--s-mut);--ok:var(--s-vyh);--gd:var(--s-ihry);--ac:var(--s-hand);--disp:Oswald,'Arial Narrow',sans-serif;--txt:'Source Sans 3',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:17px/1.4 var(--txt);-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gd);outline-offset:2px}
[hidden]{display:none!important}
.in{max-width:520px;margin:0 auto;padding:14px 14px 40px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.top b{font:600 20px var(--disp);letter-spacing:.06em;text-transform:uppercase}
.top .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:var(--s-r-pil,99px);border:1px solid var(--ln);background:var(--card);font-weight:700;font-size:14px}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--gd)}.chip .dot.on{background:var(--ok)}
h1{margin:12px 0 6px;font:600 28px/1.1 var(--disp);text-transform:uppercase}
.m{color:var(--mut);margin:0 0 14px}
label{display:block;font-weight:700;font-size:14px;color:var(--mut);margin:12px 0 4px}
input{width:100%;min-height:54px;padding:8px 14px;border-radius:var(--s-r,12px);border:1px solid var(--ln);background:var(--card);font-size:20px}
.btn{width:100%;min-height:56px;margin-top:14px;border-radius:var(--s-r-plytka,18px);border:0;background:var(--ac);color:#06201d;font:700 19px var(--txt)}
.btn:disabled{background:var(--card2);color:var(--mut)}
.err{color:#ff9a8a;min-height:1.3em;margin-top:6px}
.qn{color:var(--ac);font:600 14px var(--disp);letter-spacing:.06em;text-transform:uppercase}
.qt{margin:4px 0 16px;font:600 26px/1.15 var(--disp)}
.opts{display:flex;flex-direction:column;gap:10px}
.opts button{min-height:62px;padding:10px 16px;border-radius:var(--s-r-plytka,18px);border:2px solid var(--ln);background:var(--card);font-weight:700;font-size:19px;text-align:left;display:flex;align-items:center;gap:12px}
.opts button[aria-pressed=true]{border-color:var(--ac);background:rgba(47,210,192,.16)}
.opts button[aria-pressed=true]::after{content:"✓";margin-left:auto;color:var(--ac);font-size:22px}
.opts button:disabled{opacity:.6}
.stars{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.stars button{aspect-ratio:1;border-radius:var(--s-r-plytka,18px);border:2px solid var(--ln);background:var(--card);font-size:34px;line-height:1;display:grid;place-items:center;gap:2px}
.stars button small{font:700 14px var(--txt);color:var(--mut)}
.stars button[aria-pressed=true]{border-color:var(--ac);background:rgba(47,210,192,.16)}
.ok{margin-top:14px;padding:12px 14px;border-radius:var(--s-r,12px);background:rgba(47,210,192,.12);color:var(--ac);font-weight:700;text-align:center}
.wait{padding:30px 10px;text-align:center;color:var(--mut)}
.wait b{display:block;font:600 24px var(--disp);color:var(--ink);margin-bottom:6px}
.tl{display:flex;flex-direction:column;gap:8px;margin-top:6px}.tl b{display:block;font:600 24px/1.15 var(--disp);color:var(--gd)}
.res{margin-top:18px;padding:14px;border-radius:var(--s-r,12px);background:var(--card);border:1px solid var(--ln)}
.res h2{margin:0 0 8px;font:700 14px var(--txt);color:var(--mut)}
.rb{display:grid;grid-template-columns:1fr 46px;gap:4px 10px;align-items:center;margin:6px 0;font-weight:700;font-size:15px}
.rb .tr{grid-column:1/-1;height:10px;border-radius:var(--s-r-mitka,6px);background:var(--card2);overflow:hidden}
.rb .fl{display:block;height:100%;background:var(--ac);border-radius:var(--s-r-mitka,6px)}
.rb span:nth-child(2){text-align:right;color:var(--mut)}
.words{display:flex;flex-wrap:wrap;gap:6px}
.words span{padding:4px 10px;border-radius:var(--s-r-pil,99px);background:var(--card2);font-weight:700}
textarea{width:100%;min-height:120px;padding:12px 14px;border-radius:var(--s-r,12px);border:1px solid var(--ln);background:var(--card);font:inherit;font-size:19px;color:inherit;resize:vertical}
textarea:focus-visible{outline:3px solid var(--gd);outline-offset:2px}
.big{margin:8px 0 4px;font:600 44px/1.05 var(--disp);color:var(--gd)}
.hint{margin-top:14px;padding:12px 14px;border-radius:var(--s-r,12px);background:var(--card);border:1px solid var(--ln);color:#cfd5dc}
.fb{margin:14px 0;padding:14px;border-radius:var(--s-r-plytka,18px);background:var(--card);border:1px solid var(--ln)}.fb h2{margin:0 0 4px;font:600 22px var(--disp)}
.fb label{margin:12px 0 4px}.fb input{min-height:var(--s-h,50px);font-size:17px}
.ex{margin:4px 0 0;font-size:14px;color:var(--mut);line-height:1.45}.ex b{color:#cfd5dc}.ex .no{color:#ff9a8a}
.st{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.st button{min-height:36px;padding:4px 12px;border-radius:var(--s-r-pil,99px);border:1px solid var(--ln);background:var(--card2);font-size:14px;font-weight:700}
.hn{margin:6px 0;color:var(--ac);font-weight:700;font-size:18px}.hn small{display:block;color:var(--mut);font-size:14px;text-transform:uppercase;letter-spacing:.06em}
.wr{color:#ff9a8a;font-weight:700;margin:6px 0}
.vb{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.vb button{min-height:58px;border-radius:var(--s-r-plytka,18px);border:1px solid var(--ln);background:var(--card);font-weight:700;font-size:19px}.vb button:disabled{opacity:.35;text-decoration:line-through}
.vbig{width:100%;min-height:58px;margin-top:14px;border-radius:var(--s-r-pil,99px);border:0;background:var(--gd);color:#1d1606;font:700 19px var(--txt)}.vsec{width:100%;min-height:var(--s-h,50px);margin-top:10px;border-radius:var(--s-r-pil,99px);border:1px solid var(--ln);background:var(--card2);color:var(--ink);font:700 16px var(--txt)}
.dots{display:flex;gap:8px;margin:2px 0 10px}.dots i{width:16px;height:16px;border-radius:50%;background:var(--gd)}.dots i.off{background:transparent;border:2px solid var(--ln)}
.scr{display:flex;justify-content:space-between;color:var(--mut);font-weight:700;font-size:14px;margin-bottom:6px}
.pl{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.pl span{padding:4px 11px;border-radius:var(--s-r-pil,99px);background:var(--card2);font-weight:700;font-size:14px}.pl span.ok{color:var(--ac)}
.rd{display:flex;flex-direction:column;gap:8px;margin-top:10px}.rd button{min-height:50px;border-radius:var(--s-r,12px);border:1px solid var(--ln);background:var(--card);font-weight:700;font-size:17px;text-align:left;padding:8px 14px}.rd button[aria-pressed=true]{border-color:var(--gd);background:rgba(255,194,71,.14)}
.mine{margin-top:14px;padding:12px 14px;border-radius:var(--s-r,12px);background:rgba(255,194,71,.14);color:var(--gd);font-weight:700;text-align:center}
body.s3t #send{border-radius:var(--s-r-pil,99px);background:var(--gd);color:#1d1606}body.s3t #send.sec{background:var(--card2);color:var(--ink);border:1px solid var(--ln)}
body.s3t #go{border-radius:var(--s-r-pil,99px);background:var(--gd);color:#1d1606}
body.s3t .opts button{border-radius:var(--s-r-pil,99px);border-width:1px;padding:10px 22px}
body.s3t .opts button[aria-pressed=true]{border-color:#ffc247;background:rgba(255,194,71,.16)}
body.s3t .opts button[aria-pressed=true]::after{color:#ffc247}
</style>
<style>

/* ═══ СТАНДАРТ СТИЛЮ — кольори, шрифти, заокруглення, висота кнопок. Спільний для всіх сторінок. ═══ */

  /* основа — темний екран */
  --s-bg:#1b1d21; --s-card:#22262b; --s-card2:#2a2f35; --s-pole:#14171a; --s-ln:#383d44;

  --s-upn:#ffd23f; --s-upn-on:#1d1606;
  --s-upyu:#c8284a; --s-upyu-t:#ff7d99; --s-upyu-on:#ffffff;

  --s-p-bg:#ffffff; --s-p-ink:#1d2125; --s-p-mut:#5f6873; --s-p-ln:#cfd5dc; --s-p-ac:#c8284a; --s-p-th:#f9e6ea;
  /* шрифти */
  --s-disp:Oswald,'Arial Narrow',sans-serif; --s-txt:'Source Sans 3',system-ui,sans-serif; --s-ruka:Caveat,'Segoe Print',cursive;

  --s-r:12px; --s-r-plytka:18px; --s-r-karta:20px; --s-r-pil:99px; --s-r-mitka:6px; --s-r-smuzhka:3px;
  /* висота: звичайна кнопка й поле 50, головна кнопка гри 54 */
  --s-h:50px; --s-h-hra:54px;
}
/* ═══ кінець стандарту ═══ */
/*/standart*/
/* «Родина ігор» — спільний вигляд ігор сайту (за зразком «Потужного СКОБ!»).
   Вмикається класом body.fam (поки проба: ?dyz=fam). Кожна гра має своє «обличчя» — логотип .fm-logo:
     .sq — квадратні плитки (СКОБ), .balls — кульки (бінго), .board — клітинки табла (змаг), .stovp — стовпчики (опитування).
   Вбудовується в сторінки ігор їхніми zibraty.py. */
body.fam{--bg:#15171b;--card:#22262b;--card2:#272b31;--ln:#3b4048;--ink:#f2f4f6;--body:#cfd5dc;--mut:#a0a8b2;--gd:#ffc247;--hand:#2fd2c0;--ok:#62cf93;
  --disp:Oswald,'Arial Narrow',sans-serif;--txt:'Source Sans 3',system-ui,sans-serif;
  background:radial-gradient(80% 70% at 50% 40%,#232a33,#15171b 75%) fixed #15171b;color:var(--ink);font-family:var(--txt)}
body.fam::before{display:none}

/* ---- логотип гри ---- */
.fm-logo{display:inline-flex;flex-direction:column;align-items:flex-start;line-height:1;font-family:var(--disp);vertical-align:middle}
.fm-logo small{font:600 .34em/1 var(--disp);letter-spacing:.32em;text-transform:uppercase;color:#ffc247;margin:0 0 .2em .06em;white-space:nowrap}
.fm-lt{display:flex;gap:.08em;align-items:center}
.fm-lt i{display:grid;place-items:center;width:1.04em;height:1.04em;border-radius:.16em;font:600 .78em/1 var(--disp);font-style:normal;color:#fff}
.fm-lt i.c0{background:#d64541}.fm-lt i.c1{background:#2f6fd0}.fm-lt i.c2{background:#e8b02a;color:#1d1606}.fm-lt i.c3{background:#2e8f55}.fm-lt i.c4{background:#8a5bd1}
.fm-lt b{font:600 .9em/1 var(--disp);color:#ffc247;margin-left:.06em}
.fm-logo.balls .fm-lt i{border-radius:50%;box-shadow:inset -.07em -.09em 0 rgba(0,0,0,.2),inset .05em .06em 0 rgba(255,255,255,.18)}
.fm-logo.board .fm-lt i{background:#22262b;box-shadow:inset 0 0 0 .045em #ffc247;color:#ffc247;border-radius:.14em}
.fm-logo.board .fm-lt i.on{background:#ffc247;color:#1d1606;box-shadow:none}
.fm-logo.stovp .fm-lt{align-items:flex-end;gap:.06em}
.fm-logo.stovp .fm-lt i{width:.3em;border-radius:.07em}
.fm-logo.stovp .fm-lt span{font:600 .78em/1 var(--disp);letter-spacing:.02em;margin-left:.16em;text-transform:uppercase;color:#fff}
.fm-logo.sm{font-size:30px}.fm-logo.sm small{display:none}

/* ---- шапка й кнопки-«пігулки» ---- */
body.fam .top{background:none;border:0;padding:max(10px,env(safe-area-inset-top)) 14px 0 18px}
body.fam .chip{min-height:44px;padding:0 16px;border-radius:var(--s-r-pil,99px);border:1px solid var(--ln);background:rgba(34,38,43,.9);color:var(--ink);font:600 15px var(--txt);gap:8px}
body.fam .chip:hover{border-color:var(--gd)}
body.fam .chip .dot{width:9px;height:9px;background:#6b7480}body.fam .chip .dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
body.fam .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:var(--s-r-pil,99px);border:1px solid var(--ln);background:rgba(34,38,43,.9);color:var(--ink);font:600 16px var(--txt)}
body.fam .btn:hover:not(:disabled){border-color:var(--gd)}
body.fam .btn.main{min-height:54px;padding:0 28px;background:var(--gd);border-color:var(--gd);color:#1d1606;font-size:18px;font-weight:700}
body.fam .btn.ok{background:#2e8f55;border-color:#2e8f55;color:#fff}
body.fam .btn.no{background:#d64541;border-color:#d64541;color:#fff}

/* ---- підписи як у СКОБ ---- */
.fm-hand{font:500 clamp(1.4rem,3vw,2rem)/1.15 Caveat,'Segoe Print',cursive;color:#2fd2c0}/* 4.11: рукопис — точно як на сайті */
.fm-lbl{margin:10px 0 4px;color:#a0a8b2;font:600 14px var(--txt);letter-spacing:.12em;text-transform:uppercase}
.fm-or{display:flex;align-items:center;gap:12px;margin:12px 0 8px;color:#6b7480;font-size:14px}
.fm-or::before,.fm-or::after{content:"";flex:1;height:1px;background:#383d44}
.fm-h3{display:flex;align-items:baseline;gap:10px;margin:16px 0 8px;font:600 20px var(--disp);letter-spacing:.08em;text-transform:uppercase}
.fm-h3 span{color:#ffc247}

/* ---- вікно «Запросити гравців» (як лобі СКОБ) ---- */
.fm-ov{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(10,12,15,.9)}
.fm-box{position:relative;width:min(1060px,100%);max-height:100%;overflow:auto;padding:24px 26px 22px;border-radius:var(--s-r-karta,20px);background:#1f2328;border:1px solid #3b4048;box-shadow:0 24px 90px #000a;text-align:left}
.fm-box .x{position:absolute;right:14px;top:12px;width:44px;height:44px;border-radius:50%;border:1px solid #3b4048;background:#272b31;color:#fff;font-size:22px;cursor:pointer}
.fm-box .fm-logo{font-size:clamp(44px,6vw,66px)}

.fm-join .qr svg{width:100%;height:100%}
.fm-s1{margin:0;font:600 clamp(1.1rem,1.7vw,1.5rem)/1.25 var(--txt);color:#fff}
.fm-url{font:600 clamp(1.4rem,2.6vw,2.2rem)/1.1 var(--disp);color:#fff;letter-spacing:.02em;overflow-wrap:anywhere}

<script>
/* Звʼязок пульта з гутіркою — з запасними каналами (з 22.10.2026).
   window.GutirkaNet(PeerJS) → клас, схожий на Peer з PeerJS (той самий API для pult-host-file.js і сторінки пульта),

     1) PeerJS (безкоштовний сервер 0.peerjs.com) — як і раніше;
     2) запасний: кілька публічних MQTT-брокерів через WebSocket (повідомлення йдуть через усі, повтори відкидаються).

    constructor() { this._h = {}; }
    on(e, f) { (this._h[e] = this._h[e] || []).push(f); return this; }
    off(e, f) { this._h[e] = (this._h[e] || []).filter(x => x !== f); return this; }

  }

  const te = new TextEncoder(), td = new TextDecoder();

        const id = 'gf' + rnd(12);

      };

    }
    sendSub(topic) { try { this.ws.send(pkt(0x82, [0, 1, ...str(topic), 0])); } catch (e) { /* ok */ } }

    pub(topic, text) { if (!this.ok) return false; const t = str(topic), p = te.encode(text); const b = new Uint8Array(t.length + p.length); b.set(t); b.set(p, t.length); try { this.ws.send(pkt(0x30, b)); return true; } catch (e) { return false; } }

      seal(key, msg).then(text => { this.brokers.forEach(b => b.pub(to, text)); });
    }
    async inMsg(text) {
      // гутірка: пробуємо ключ з QR, тоді — лише код (пульт, де код ввели вручну); пульт: ключ свого зʼєднання
      let m = null, key = null;

    }

      constructor(id, opts) {
        super(); this.id = id; this.inner = []; this.destroyed = false; this.opened = false; this.errs = 0;

            if (!this.inner.some(x => x.isUp)) this.emit('error', e);   // помилка лише тоді, коли не працює жоден шлях

          p.on('disconnected', () => {
            p.isUp = false;

      }

      connect(id, opts) { return new NetConn(this, id, opts); }
      reconnect() { this.inner.forEach(p => { if (p.disconnected && !p.destroyed) try { p.reconnect(); } catch (e) { /* ok */ } }); }
      destroy() { this.destroyed = true; this.inner.forEach(p => { try { p.destroy(); } catch (e) { /* ok */ } }); }

  };

})();

const $ = s => document.querySelector(s);
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const VV = /[?&]v=1(&|$)/.test(location.search);   /* телефон того, хто вгадує */
const KEY = VV ? 'znay.v' : 'znay.ses';
const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return {}; } };
const save = o => { try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) { /* ok */ } };
let ses = load();
if (!ses.tok) { ses.tok = Math.random().toString(36).slice(2) + Date.now().toString(36); save(ses); }
const qk = (new URLSearchParams(location.search).get('k') || '').replace(/\D/g, '').slice(0, 6);
if (qk.length === 6) { $('#f-code').value = qk; $('#cw').hidden = true; }
if (ses.name) $('#f-name').value = ses.name;
if (VV) { $('#jm').textContent = 'Ти вгадуєш: на твоєму телефоні — імена для відповіді й кнопка «Далі». Фактів не пишеш.'; $('#go').textContent = 'Я вгадую'; }

/* ---------- звʼязок ---------- */
const LIBS = ['https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.5/peerjs.min.js', 'https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js', 'https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js'];
const loadScript = src => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.async = true; s.onload = res; s.onerror = () => { s.remove(); rej(); }; document.head.appendChild(s); });
async function getPeer() { if (!window.Peer) for (const u of LIBS) { try { await loadScript(u); if (window.Peer) break; } catch (e) { /* далі */ } } return window.GutirkaNet ? window.GutirkaNet(window.Peer || null) : window.Peer; }
let peer = null, conn = null, att = 0, lastRx = 0, hb = 0, st = null, draft = null, edit = false;
const BOT = /[?&]bot=\d/.test(location.search);
function chip(on, t) { $('#dot').className = 'dot' + (on ? ' on' : ''); $('#st').textContent = t; }
function stop() { att++; clearInterval(hb); try { conn && conn.close(); } catch (e) { /* ok */ } try { peer && peer.destroy(); } catch (e) { /* ok */ } conn = peer = null; }
async function connect() {
  stop(); const my = att; chip(false, 'Підключаємось…');
  let P; try { P = await getPeer(); } catch (e) { P = null; }
  if (my !== att) return;
  if (!P) { chip(false, 'Немає звʼязку'); return; }
  const p = peer = new P(undefined, window.GUTIRKA_PEER_OPTS || {});
  const tmo = setTimeout(() => { if (my === att && !(conn && conn.open)) retry(my, 'Не знайшли гру — перевір код'); }, 15000);
  p.on('error', e => { if (my !== att) return; if (e && e.type === 'peer-unavailable') { clearTimeout(tmo); retry(my, 'Гру з таким кодом не знайдено'); } });
  p.on('open', () => {
    if (my !== att) return;
    const c = conn = p.connect('gutirky-znay-' + ses.code, { reliable: true });
    c.on('open', () => { if (my !== att) return; clearTimeout(tmo); lastRx = Date.now(); c.send({ t: 'join', tok: ses.tok, name: ses.name, v: VV ? 1 : 0 }); chip(true, 'На звʼязку');
      hb = setInterval(() => { try { c.send({ t: 'ping' }); } catch (e) { /* ok */ } if (Date.now() - lastRx > 16000) retry(my, 'Звʼязок перервався'); }, 5000); });
    c.on('data', d => { if (my === att) { lastRx = Date.now(); if (d && d.t === 'st') { st = d; render(); } else if (d && d.t === 'kick') { kicked(); } } });
    c.on('close', () => { if (my === att) retry(my, 'Звʼязок перервався'); });
  });
}
function retry(my, why) { if (my !== att) return; stop(); chip(false, why + ' · пробуємо знову'); setTimeout(connect, 3000); }

/* ---------- екран ---------- */
let lastK = '';
function kicked() { stop(); att++; $('#body').innerHTML = '<div class="wait"><b>Тепер вгадує інший телефон</b>Хочеш знову — відскануй код «Хто вгадує» на екрані.</div>'; chip(false, 'Відключено'); }
function cmd(a, v) { try { conn && conn.send({ t: 'cmd', a, v }); } catch (e) { /* ok */ } if (navigator.vibrate) navigator.vibrate(30); }
function vRender() {
  const B = $('#body'); let h = '';
  const sc = st.sc ? `<div class="scr"><span>Ти: ${st.sc[0]}</span><span>Гурток: ${st.sc[1]}</span></div>` : '';
  if (st.ph === 'lobby') {
    h = `<div class="qn">Ти вгадуєш</div><h1 class="qt">Що граємо?</h1><div class="rd">${st.rounds.map(([k, t]) => `<button type="button" data-r="${k}" aria-pressed="${k === st.gra}">${esc(t)}</button>`).join('')}</div>`
      + `<p class="m" style="margin-top:14px">Фактів не пиши. Решта сканують код на екрані й вписують імена.</p><div class="qn">У грі: ${st.pl.length}</div><div class="pl">${st.pl.map(([n, on]) => `<span${on ? '' : ' style="opacity:.5"'}>${esc(n)}</span>`).join('') || '<span>поки нікого</span>'}</div>`
      + `<button type="button" class="vbig" data-c="start"${st.pl.length ? '' : ' disabled'}>Почати</button>`;
  } else if (st.ph === 'zbir') {
    const f = st.pl.filter(x => x[2]).length;
    h = `<div class="qn">Вгадай, хто?</div><h1 class="qt">Пишуть факти: ${f} з ${st.pl.length}</h1><div class="pl">${st.pl.map(([n, , k]) => `<span class="${k ? 'ok' : ''}">${k ? '✓ ' : ''}${esc(n)}</span>`).join('')}</div>`
      + `<button type="button" class="vbig" data-c="next"${f ? '' : ' disabled'}>Почати вгадувати</button><button type="button" class="vsec" data-c="prev">Назад</button>`;
  } else if (st.ph === 'fakt') {
    h = sc + `<div class="qn">Факт ${st.i + 1} з ${st.n}</div><h1 class="qt">«${esc(st.fakt)}»</h1>`;
    if (!st.done) h += `<div class="dots">${[0, 1, 2].map(k => `<i class="${k < 3 - st.tries ? '' : 'off'}"></i>`).join('')}</div>`;
    h += st.h.map((x, k) => `<div class="hn"><small>Підказка ${k + 1}</small>${esc(x)}</div>`).join('');
    if (st.wrong.length) h += `<div class="wr">Ні, це не ${st.wrong.map(esc).join(' і не ')}</div>`;
    if (st.done) h += `<div class="big">${st.ok ? 'Так! Це — ' : 'Це — '}${esc(st.who)}!</div><div class="${st.ok ? 'ok' : 'hint'}">${st.ok ? 'Ти вгадав! +' + st.pts : 'Цього разу бал гуртку'}</div><button type="button" class="vbig" data-c="next">${st.last ? 'Рахунок' : 'Наступний факт'}</button>`;
    else h += `<p class="m" style="margin:10px 0 0">Хто це? Скажи вголос і натисни:</p><div class="vb">${st.o.map(([j, n, w]) => `<button type="button" data-g="${j}"${w ? ' disabled' : ''}>${esc(n)}</button>`).join('')}</div><button type="button" class="vsec" data-c="give">Здаюся — показати</button>`;
  } else if (st.ph === 'my') {
    h = `<div class="qn">Хто з нас… · ${st.i + 1} з ${st.n}</div><h1 class="qt">${esc(st.q)}</h1><p class="m">Проголосували: ${st.cnt}${st.tot ? ' з ' + st.tot : ''}</p>`
      + (st.rev ? '<p class="m">Рахуємо голоси…</p>' : '')
      + (st.shown && st.win ? `<div class="big">${st.win.map(esc).join(', ') || '—'}</div>` + (st.win.length > 1 ? '<p class="m">Нічия!</p>' : '') + (st.wt ? `<p class="m">Титул: <b style="display:inline;font-size:inherit">${esc(st.wt)}</b></p>` : '') : '')
      + `<button type="button" class="vbig" data-c="${st.shown ? 'next' : 'show'}"${st.rev ? ' disabled' : ''}>${st.rev ? 'Рахуємо…' : st.shown ? (st.last ? 'Кінець' : 'Наступне питання') : 'Показати, кого вибрали'}</button>`;
  } else if (st.ph === 'end') {
    h = `<div class="wait"><b>Дякуємо!</b>${esc(st.sum || 'Раунд завершено.')}</div>` + (st.top && st.top.length ? `<p class="m">Хто з гуртка найкраще знає своїх:</p><div class="pl">${st.top.map(([n, p]) => `<span>${esc(n)} — ${p}</span>`).join('')}</div>` : '') + `<button type="button" class="vbig" data-c="start">Ще раунд</button>`;
  }
  B.innerHTML = h;
}
function render() {
  $('#join').hidden = true; $('#play').hidden = false;
  if (st.v) return vRender();
  const B = $('#body'), nm = esc(st.name || ses.name || '');
  const k = st.ph + ':' + (st.i == null ? '' : st.i); if (k !== lastK) { lastK = k; draft = null; edit = false; }
  if (st.ph === 'zbir' && document.activeElement && document.activeElement.closest('#body') && document.activeElement.matches('input,textarea')) return;   /* не перемальовувати, поки юнак пише */
  let h = '';
  if (st.ph === 'lobby') h = `<div class="wait"><b>Ти в грі, ${nm}!</b>Дивись на екран — ведучий скоро почне.</div>`;
  else if (st.ph === 'end') h = `<div class="wait"><b>Дякуємо!</b>${esc(st.sum || 'Раунд завершено.')}${st.last === 'hto' ? '<br>Твої бали: <b style="display:inline;font-size:inherit">' + st.pts + '</b>' : ''}</div>` + (st.titles && st.titles.length ? `<div class="res"><h2>Твої титули</h2><div class="tl">${st.titles.map(t => '<b>' + esc(t) + '</b>').join('')}</div></div>` : '');
  else if (st.ph === 'zbir') {
    if (st.my && !edit) {
      h = `<div class="qn">Вгадай, хто?</div><h1 class="qt">Готово!</h1><div class="ok">✓ Прийнято: ${st.my.length === 1 ? '1 факт' : st.my.length + ' факти'}. Дивись на екран — скоро почнемо.</div>`
        + st.my.map((o, k) => `<div class="fb"><h2>Факт ${k + 1}</h2>«${esc(o.f)}»<div class="hn"><small>Підказка складніша</small>${esc(o.h1)}</div><div class="hn"><small>Підказка легша</small>${esc(o.h2)}</div></div>`).join('')
        + '<button type="button" class="btn sec" id="redo">Змінити</button>';
    } else {
      const D = draft || {}, v = k => esc(D[k] != null ? D[k] : (st.my ? (st.my[+k[1] - 1] || {})[k[0] === 'f' ? 'f' : 'h' + k[2]] || '' : ''));
      h = `<div class="qn">Вгадай, хто?</div><h1 class="qt">Два факти про тебе</h1>
<p class="m">Усі вгадуватимуть, чий факт. Після кожної помилки на екрані відкривається твоя підказка. <b>Імені не пиши!</b></p>
<details class="fb"><summary><b>Як писати? Приклади</b></summary>
<p class="ex"><b>Факт</b> — те, чого ніхто в гуртку не знає: щось цікаве, смішне чи несподіване.<br>✓ «Я ловив рибу в Норвегії» · ✓ «Я боюся гусей» · ✓ «Я вмію грати на скрипці»<br><span class="no">✗ «Я люблю піцу» — так скаже кожен · ✗ «Я Тарас» — це не факт, а імʼя</span></p>
<p class="ex"><b>Підказка складніша</b> — щось загальне, що підходить ще кільком людям:<br>«Я юнак» · «Я юначка» · «У мене світле волосся» · «Я вищий за половину гуртка» · «Я в гуртку другий рік»</p>
<p class="ex"><b>Підказка легша</b> — що видно саме зараз у кімнаті:<br>«Сьогодні на мені чорна кофта» · «Я сиджу біля вікна» · «У мене окуляри» · «Сиджу поруч з Оленкою»</p>
<p class="ex">Для другого факту — <b>інші</b> підказки. Поки триває гра, сиди на місці й не знімай кофту чи кепку.</p></details>`
        + [1, 2].map(n => `<div class="fb"><h2>Факт ${n}${n === 2 ? ' <small style="font:600 14px var(--txt);color:var(--mut)">(можна й без нього)</small>' : ''}</h2>
<textarea ${n === 1 ? 'id="w" ' : ''}data-k="f${n}" maxlength="140" placeholder="${n === 1 ? 'Я боюся гусей' : 'Я вмію грати на скрипці'}">${v('f' + n)}</textarea>
<label>Підказка складніша — щось загальне</label><input data-k="h${n}1" maxlength="80" placeholder="Я юнак, у мене темне волосся" value="${v('h' + n + '1')}">
<div class="st">${['Я юнак', 'Я юначка', 'У мене…', 'Я в гуртку…'].map(t => `<button type="button" data-st="h${n}1">${t}</button>`).join('')}</div>
<label>Підказка легша — що видно зараз</label><input data-k="h${n}2" maxlength="80" placeholder="Сьогодні на мені зелена кофта" value="${v('h' + n + '2')}">
<div class="st">${['Сьогодні на мені…', 'Я сиджу…', 'У мене…'].map(t => `<button type="button" data-st="h${n}2">${t}</button>`).join('')}</div></div>`).join('')
        + `<div class="err" id="ferr"></div><button type="button" class="btn" id="send">Надіслати</button>`;
    }
  }
  else if (st.ph === 'fakt') {
    h = `<div class="qn">Факт ${st.i + 1} з ${st.n} · твої бали: ${st.pts}</div><h1 class="qt">«${esc(st.fakt)}»</h1>`
      + st.h.map((x, k) => `<div class="hn"><small>Підказка ${k + 1}</small>${esc(x)}</div>`).join('')
      + (st.wrong.length ? `<div class="wr">Ні, це не ${st.wrong.map(esc).join(' і не ')}</div>` : '');
    if (st.done) {
      h += `<div class="big">Це — ${esc(st.who)}!</div>`;
      if (st.mine) h += '<div class="mine">Твій факт! Розкажи коротко, як це було.</div>';
      else h += st.won != null ? `<div class="ok">✓ Ти вгадав! +${st.won}</div>` : '<div class="hint">Цього разу не вгадав.</div>';
    }
    else if (st.mine) h += '<div class="mine">Це твій факт — мовчи й не видавай себе!</div>';
    else {
      h += `<p class="m">Хто це, на твою думку? Тисни потай. Що раніше вгадаєш, то більше балів: ${['3', '2', '1'][Math.min(st.tries, 2)]} зараз.</p>`;
      const btns = st.o.map((o, j) => j === st.me ? '' : `<button type="button" data-v="${j}" aria-pressed="${st.my === j}">${esc(o)}</button>`).join('');
      h += `<div class="opts">${btns}</div>`;
      if (st.my !== null) h += '<div class="ok">✓ Здогадку прийнято. Можна змінити, поки відповідь не відкрилась.</div>';
    }
  }
  else if (st.ph === 'my') {
    const dis = st.open ? '' : ' disabled';
    h = `<div class="qn">Хто з нас… · питання ${st.i + 1} з ${st.n}</div><h1 class="qt">${esc(st.q)}</h1>`;
    const btns = st.o.map((o, j) => j === st.me ? '' : `<button type="button" data-v="${j}" aria-pressed="${st.my === j}"${dis}>${esc(o)}</button>`).join('');
    h += btns ? `<div class="opts">${btns}</div>` : '<div class="hint">Поки в грі нікого, крім тебе.</div>';
    if (st.my !== null) h += '<div class="ok">✓ Голос прийнято. Ніхто не бачить, за кого ти голосуєш.</div>';
    if (st.rev) h += '<div class="res"><div class="hint">Рахуємо голоси…</div></div>';
    if (st.win) h += st.win.length ? `<div class="res"><h2>${st.win.length > 1 ? 'Нічия — однаково голосів' : 'Найбільше голосів'}</h2><div class="big">${st.win.map(esc).join(', ')}</div>${st.wt ? `<p class="m">Титул: <b style="display:inline;font-size:inherit">${esc(st.wt)}</b></p>` : ''}</div>` : '';
  }
  B.innerHTML = h;
}
function send(o) { try { conn && conn.send(o); } catch (e) { /* ok */ } if (navigator.vibrate) navigator.vibrate(30); }
$('#body').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || !st) return;
  if (st.v) { if (b.dataset.c) cmd(b.dataset.c); else if (b.dataset.g != null) cmd('g', +b.dataset.g); else if (b.dataset.r) cmd('r', b.dataset.r); return; }
  if (b.dataset.v != null && st.ph === 'my' && st.open) { st.my = +b.dataset.v; render(); send({ t: 'vote', i: st.i, v: +b.dataset.v }); }
  else if (b.dataset.v != null && st.ph === 'fakt' && !st.done) { st.my = +b.dataset.v; render(); send({ t: 'zdog', i: st.i, v: +b.dataset.v }); }
  else if (b.dataset.st) { const i = $('[data-k="' + b.dataset.st + '"]'); i.value = /…$/.test(b.textContent) ? b.textContent.replace('…', ' ') : b.textContent + ', '; keep(); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
  else if (b.id === 'redo') { edit = true; draft = null; render(); }
  else if (b.id === 'send') {
    const g = k => ($('[data-k="' + k + '"]').value || '').replace(/\s+/g, ' ').trim();
    if (BOT) { if (!g('h11')) $('[data-k="h11"]').value = 'Я юнак'; if (!g('h12')) $('[data-k="h12"]').value = 'Сиджу біля дверей'; }
    const v = [], er = t => { $('#ferr').textContent = t; };
    for (const n of [1, 2]) {
      const f = g('f' + n), a = g('h' + n + '1'), c = g('h' + n + '2');
      if (!f && !a && !c) { if (n === 1) return er('Напиши хоча б перший факт.'); continue; }
      if (!f) return er('Факт ' + n + ': напиши сам факт.');
      if (!a || !c) return er('Факт ' + n + ': потрібні обидві підказки.');
      if (/^(у мене|я в гуртку|сьогодні на мені|я сиджу)$/i.test(a) || /^(сьогодні на мені|я сиджу|у мене)$/i.test(c)) return er('Факт ' + n + ': допиши підказку до кінця.');
      v.push({ f, h1: a, h2: c });
    }
    if (v.length === 2 && v[0].h2.toLowerCase() === v[1].h2.toLowerCase()) return er('Для другого факту — інша легша підказка.');
    st.my = v; edit = false; draft = null; render(); send({ t: 'fakt', v });
  }
});
function keep() { draft = {}; document.querySelectorAll('#body [data-k]').forEach(i => { draft[i.dataset.k] = i.value; }); }
$('#body').addEventListener('input', e => { if (e.target.dataset.k) { keep(); const er = $('#ferr'); if (er) er.textContent = ''; } });
$('#body').addEventListener('focusout', () => setTimeout(() => { if (st && !(document.activeElement && document.activeElement.closest('#body') && document.activeElement.matches('input,textarea'))) render(); }, 50));

function join(cd, nm) { ses.code = cd; ses.name = nm; save(ses); $('#err').textContent = ''; $('#join').hidden = true; $('#play').hidden = false; $('#body').innerHTML = '<div class="wait"><b>Підключаємось…</b></div>'; connect(); }
$('#go').addEventListener('click', () => {
  const cd = $('#f-code').value.replace(/\D/g, ''), nm = $('#f-name').value.replace(/\s+/g, ' ').trim();
  if (cd.length !== 6) { $('#cw').hidden = false; $('#err').textContent = 'Код — 6 цифр з екрана.'; return; }
  if (!nm) { $('#err').textContent = 'Впиши своє імʼя.'; $('#f-name').focus(); return; }
  join(cd, nm.slice(0, 20));
});
['#f-code', '#f-name'].forEach(s => $(s).addEventListener('keydown', e => { if (e.key === 'Enter') $('#go').click(); }));
['#f-code', '#f-name'].forEach(s => $(s).addEventListener('input', () => { $('#err').textContent = ''; }));
/* вибило чи перезавантажили сторінку: та сама гра й уже є імʼя — заходимо одразу, з тими самими фактами й балами */
if (qk.length === 6 && ses.code === qk && ses.name && !BOT) join(qk, ses.name);
})();
