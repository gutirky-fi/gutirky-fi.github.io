<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14182a">
<title>Своя гра — гравець</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Source+Sans+3:wght@400;600;700&display=swap">
<!-- «Своя гра» — кнопка «Відповідаю!» на телефоні. Джерело: _robota/proby/svoya-hra/hravets.html -->
<style>
:root{--bg:#14182a;--card:#1d2238;--card2:#262c47;--ln:#343b5c;--ink:#f2f4f8;--mut:#a8afc8;--gd:#ffc247;--ok:#3daf6e;--disp:Oswald,'Arial Narrow',sans-serif;--txt:'Source Sans 3',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:17px/1.4 var(--txt);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gd);outline-offset:2px}
[hidden]{display:none!important}
.in{max-width:520px;margin:0 auto;padding:14px 14px 30px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.top b{font:600 20px var(--disp);letter-spacing:.08em;text-transform:uppercase;color:var(--gd)}
.top .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;border:1px solid var(--ln);background:var(--card);font-weight:700;font-size:13px}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--gd)}.chip .dot.on{background:var(--ok)}
h1{margin:12px 0 6px;font:600 30px/1.05 var(--disp);text-transform:uppercase}
.m{color:var(--mut);margin:0 0 12px}
label{display:block;font-weight:700;font-size:14px;color:var(--mut);margin:12px 0 4px}
input{width:100%;min-height:54px;padding:8px 14px;border-radius:14px;border:1px solid var(--ln);background:var(--card);font-size:20px;-webkit-user-select:text;user-select:text}
.btn{width:100%;min-height:56px;margin-top:14px;border-radius:16px;border:0;background:var(--gd);color:#1d1606;font:700 19px var(--txt)}
.err{color:#ff9a8a;min-height:1.3em;margin-top:6px}
.tp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tp button{min-height:56px;border-radius:14px;border:2px solid var(--ln);border-left:8px solid var(--c);background:var(--card);font-weight:700;font-size:18px;text-align:left;padding:6px 12px}
.tp button[aria-pressed=true]{border-color:var(--c);background:color-mix(in srgb,var(--c) 22%,var(--card))}
.me{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-radius:14px;background:var(--card);border-left:8px solid var(--c)}
.me b{font-size:18px}.me span{font:600 28px var(--disp)}
.me small{display:block;color:var(--mut);font-weight:600}
.q{margin:14px 0 4px;text-align:center;color:var(--mut);font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:14px}
.q b{color:var(--gd);font:600 22px var(--disp);margin-left:6px}
.bz{flex:1;display:flex;align-items:center;justify-content:center;padding:14px 0}
.bz button{width:min(78vw,340px);aspect-ratio:1;border-radius:50%;border:0;background:radial-gradient(circle at 40% 35%,#ff6b62,#d0342c 60%,#8f1f19);color:#fff;font:600 34px/1.1 var(--disp);text-transform:uppercase;letter-spacing:.04em;box-shadow:0 14px 0 #6d1813,0 22px 40px #000a;touch-action:manipulation}
.bz button:active:not(:disabled){transform:translateY(8px);box-shadow:0 6px 0 #6d1813,0 12px 24px #000a}
.bz button:disabled{background:radial-gradient(circle at 40% 35%,#4a5070,#30354f 60%,#20243a);color:#8b92ad;box-shadow:0 14px 0 #161a2c}
.bz button.mine{background:radial-gradient(circle at 40% 35%,#ffd77a,#ffc247 60%,#c8901b);color:#1d1606;box-shadow:0 14px 0 #8a6210}
.st{min-height:3em;text-align:center;font-weight:700;font-size:20px}
.st.ok{color:var(--ok)}
.ans{margin-top:6px;text-align:center;color:var(--mut)}
.ans b{color:var(--gd)}
.vr{display:grid;gap:6px;margin-top:10px}.vr div{padding:8px 12px;border-radius:10px;background:var(--card);font-weight:700}.vr b{color:var(--gd);margin-right:8px}
.hn{display:block;width:100%;min-height:48px;margin-top:10px;border-radius:14px;border:1px solid var(--gd);background:rgba(255,194,71,.12);color:var(--gd);font-weight:700;font-size:17px}
.tbl{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.tbl span{padding:4px 10px;border-radius:99px;background:var(--card);border-left:5px solid var(--c);font-weight:700;font-size:14px}
</style>
</head>
<body>
<div class="in">
  <div class="top"><b>Своя гра</b><span class="sp"></span><span class="chip"><span class="dot" id="dot"></span><span id="stx">…</span></span></div>

  <section id="join">
    <h1>Своя гра</h1>
    <p class="m">Від кожної команди — <b>один телефон: капітан</b>. Команда радиться, капітан натискає.</p>
    <div id="cbox"><label for="f-code">Код з екрана</label><input id="f-code" inputmode="numeric" maxlength="7" placeholder="123 456" autocomplete="off"></div>
    <label for="f-name">Твоє імʼя</label><input id="f-name" maxlength="18" autocomplete="given-name" placeholder="Імʼя">
    <button type="button" class="btn" id="go">Далі</button>
    <div class="err" id="err"></div>
  </section>

  <section id="pick" hidden>
    <h1>Твоя команда</h1>
    <p class="m">Натисни на свою команду.</p>
    <div class="tp" id="tp"></div>
  </section>

  <section id="play" hidden style="flex:1;display:flex;flex-direction:column">
    <div class="me" id="me"></div>
    <div class="q" id="q"></div>
    <div class="bz"><button type="button" id="bz" disabled>Відповідаю!</button></div>
    <div class="st" id="st"></div>
    <div id="vr"></div>
    <div class="ans" id="ans"></div>
    <div class="tbl" id="tbl"></div>
  </section>
</div>

<script>
/* Звʼязок пульта з гутіркою — з запасними каналами (з 22.10.2026).
   window.GutirkaNet(PeerJS) → клас, схожий на Peer з PeerJS (той самий API для pult-host-file.js і сторінки пульта),
   але працює одразу двома шляхами:
     1) PeerJS (безкоштовний сервер 0.peerjs.com) — як і раніше;
     2) запасний: кілька публічних MQTT-брокерів через WebSocket (повідомлення йдуть через усі, повтори відкидаються).
   Пульт підключається тим шляхом, що відповів першим. Якщо PeerJS-сервер «лежить» — працює запасний, і навпаки.
   Запасні повідомлення зашифровані (AES-GCM, ключ — з коду й ключа з QR), адреса гутірки — хеш коду.
   Брокери можна замінити: window.GUTIRKA_MQTT = ['wss://…', …] (перед завантаженням). */
(function () {
  'use strict';
  if (window.GutirkaNet) return;
  const BROKERS = () => window.GUTIRKA_MQTT || ['wss://broker.emqx.io:8084/mqtt', 'wss://broker.hivemq.com:8884/mqtt', 'wss://test.mosquitto.org:8081/mqtt'];
  const NS = 'gutirky-fi/v1/';
  const rnd = n => { const a = new Uint8Array(n); crypto.getRandomValues(a); return [...a].map(b => (b % 36).toString(36)).join(''); };
  class Em {
    constructor() { this._h = {}; }
    on(e, f) { (this._h[e] = this._h[e] || []).push(f); return this; }
    off(e, f) { this._h[e] = (this._h[e] || []).filter(x => x !== f); return this; }
    emit(e, ...a) { (this._h[e] || []).slice().forEach(f => { try { f(...a); } catch (x) { console.error(x); } }); }
  }

  /* ---------------- найпростіший клієнт MQTT 3.1.1 через WebSocket (QoS 0) ---------------- */
  const te = new TextEncoder(), td = new TextDecoder();
  const str = s => { const b = te.encode(s); return [b.length >> 8, b.length & 255, ...b]; };
  const len = n => { const o = []; do { let d = n % 128; n = Math.floor(n / 128); if (n > 0) d |= 128; o.push(d); } while (n > 0); return o; };
  const pkt = (h, body) => { const b = body instanceof Uint8Array ? body : Uint8Array.from(body); const L = len(b.length); const o = new Uint8Array(1 + L.length + b.length); o[0] = h; o.set(L, 1); o.set(b, 1 + L.length); return o; };
  class Mqtt extends Em {
    constructor(url) { super(); this.url = url; this.subs = new Set(); this.ok = false; this.dead = false; this.tries = 0; this.buf = new Uint8Array(0); this.open(); }
    open() {
      if (this.dead) return;
      let ws; try { ws = new WebSocket(this.url, ['mqtt']); } catch (e) { return this.retry(); }
      this.ws = ws; ws.binaryType = 'arraybuffer';
      const to = setTimeout(() => { if (!this.ok) try { ws.close(); } catch (e) { /* ok */ } }, 8000);
      ws.onopen = () => {
        const id = 'gf' + rnd(12);
        ws.send(pkt(0x10, [...str('MQTT'), 4, 2, 0, 45, ...str(id)]));   // CONNECT, clean session, keepalive 45 с
      };
      ws.onmessage = ev => { const d = new Uint8Array(ev.data); const b = new Uint8Array(this.buf.length + d.length); b.set(this.buf); b.set(d, this.buf.length); this.buf = b; this.parse(); };
      ws.onclose = ws.onerror = () => { clearTimeout(to); clearInterval(this.ping); const was = this.ok; this.ok = false; if (this.ws === ws) { this.ws = null; if (was) this.emit('down'); this.retry(); } };
    }
    retry() { if (this.dead) return; this.tries++; clearTimeout(this.rt); this.rt = setTimeout(() => this.open(), Math.min(20000, 1000 * 2 ** Math.min(this.tries, 4))); }
    parse() {
      for (;;) {
        const b = this.buf; if (b.length < 2) return;
        let m = 1, v = 0, i = 1, d;
        do { if (i >= b.length) return; d = b[i++]; v += (d & 127) * m; m *= 128; } while (d & 128);
        if (b.length < i + v) return;
        const t = b[0] >> 4, body = b.subarray(i, i + v); this.buf = b.slice(i + v);
        if (t === 2) {   // CONNACK
          if (body[1] !== 0) { try { this.ws.close(); } catch (e) { /* ok */ } return; }
          this.ok = true; this.tries = 0;
          this.ping = setInterval(() => { try { this.ws.send(Uint8Array.of(0xC0, 0)); } catch (e) { /* ok */ } }, 20000);
          this.subs.forEach(s => this.sendSub(s));
          this.emit('up');
        } else if (t === 3) {   // PUBLISH (QoS 0)
          const tl = (body[0] << 8) | body[1], topic = td.decode(body.subarray(2, 2 + tl));
          this.emit('msg', topic, td.decode(body.subarray(2 + tl)));
        }
      }
    }
    sendSub(topic) { try { this.ws.send(pkt(0x82, [0, 1, ...str(topic), 0])); } catch (e) { /* ok */ } }
    sub(topic) { this.subs.add(topic); if (this.ok) this.sendSub(topic); }
    pub(topic, text) { if (!this.ok) return false; const t = str(topic), p = te.encode(text); const b = new Uint8Array(t.length + p.length); b.set(t); b.set(p, t.length); try { this.ws.send(pkt(0x30, b)); return true; } catch (e) { return false; } }
    close() { this.dead = true; clearTimeout(this.rt); clearInterval(this.ping); const ws = this.ws; this.ws = null; this.ok = false; if (ws) { try { ws.send(Uint8Array.of(0xE0, 0)); } catch (e) { /* ok */ } try { ws.close(); } catch (e) { /* ok */ } } }
  }

  /* ---------------- шифрування й адреси ---------------- */
  const b64 = a => btoa(String.fromCharCode(...new Uint8Array(a)));
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const sha = async s => new Uint8Array(await crypto.subtle.digest('SHA-256', te.encode(s)));
  const hex = a => [...a].map(x => x.toString(16).padStart(2, '0')).join('');
  const KEYS = {};
  const aesKey = (code, k) => KEYS[code + '|' + k] || (KEYS[code + '|' + k] = sha('gutirky-fi|' + code + '|' + (k || '')).then(h => crypto.subtle.importKey('raw', h, 'AES-GCM', false, ['encrypt', 'decrypt'])));
  const hostTopic = async id => NS + 'h/' + hex(await sha('gutirky-fi:' + id)).slice(0, 32);
  async function seal(key, obj) { const iv = crypto.getRandomValues(new Uint8Array(12)); const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await key, te.encode(JSON.stringify(obj))); return JSON.stringify({ v: 1, iv: b64(iv), ct: b64(ct) }); }
  async function open(key, text) { try { const e = JSON.parse(text); const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(e.iv) }, await key, unb64(e.ct)); return JSON.parse(td.decode(pt)); } catch (e) { return null; } }
  const codeOf = id => String(id || '').replace(/^.*-/, '');   // gutirka-123456 / gutirky-skob-123456 → 123456

  /* ---------------- запасний «Peer» поверх брокерів ---------------- */
  const PART = 30000;   // великі повідомлення (картинки для пульта) — частинами
  class RelayConn extends Em {
    constructor(peer, cid, to, key) { super(); this.p = peer; this.cid = cid; this.to = to; this.key = key; this.open = false; this.parts = {}; this.peer = to; }
    send(d) {
      if (!this.open) return;
      const s = JSON.stringify(d), mid = rnd(10);
      if (s.length <= PART) return this.p.out(this.to, this.key, { k: 'data', cid: this.cid, from: this.p.inbox, s });
      const n = Math.ceil(s.length / PART);
      for (let i = 0; i < n; i++) this.p.out(this.to, this.key, { k: 'part', cid: this.cid, from: this.p.inbox, m: mid, i, n, s: s.slice(i * PART, (i + 1) * PART) });
    }
    got(m) {
      let s = m.s;
      if (m.k === 'part') { const P = this.parts[m.m] = this.parts[m.m] || []; P[m.i] = m.s; if (P.filter(x => x != null).length < m.n) return; s = P.join(''); delete this.parts[m.m]; }
      let d; try { d = JSON.parse(s); } catch (e) { return; }
      this.emit('data', d);
    }
    close() { if (!this.open) return; this.open = false; this.p.out(this.to, this.key, { k: 'close', cid: this.cid, from: this.p.inbox }); delete this.p.conns[this.cid]; setTimeout(() => this.emit('close'), 0); }
  }
  class RelayPeer extends Em {
    constructor(id) {
      super();
      this.id = id || 'r' + rnd(14); this.host = typeof id === 'string' && !!id; /* гутірка чи гра — під своїм кодом; телефон — без імені */ this.conns = {}; this.seen = new Set(); this.disconnected = false; this.destroyed = false; this.isOpen = false;
      this.code = codeOf(this.id);
      this.brokers = BROKERS().map(u => new Mqtt(u));
      (async () => {
        this.inbox = this.host ? await hostTopic(this.id) : NS + 'p/' + this.id;
        this.brokers.forEach(b => {
          b.on('up', () => { if (!this.isOpen && !this.destroyed) { this.isOpen = true; this.emit('open', this.id); } });
          b.on('msg', (t, text) => { if (t === this.inbox) this.inMsg(text); });
          b.sub(this.inbox);
        });
      })();
      this.failT = setTimeout(() => { if (!this.isOpen && !this.destroyed) this.emit('error', { type: 'network' }); }, 15000);
    }
    up() { return this.brokers.some(b => b.ok); }
    out(to, key, msg) {
      msg.mid = rnd(10);
      seal(key, msg).then(text => { this.brokers.forEach(b => b.pub(to, text)); });
    }
    async inMsg(text) {
      // гутірка: пробуємо ключ з QR, тоді — лише код (пульт, де код ввели вручну); пульт: ключ свого зʼєднання
      let m = null, key = null;
      if (this.host) { for (const k of [window.GUTIRKA_NET_KEY || '', '']) { key = aesKey(this.code, k); m = await open(key, text); if (m) break; } }
      else for (const c of Object.values(this.conns)) { m = await open(c.key, text); if (m) { key = c.key; break; } }
      if (!m || this.seen.has(m.mid)) return;
      this.seen.add(m.mid); if (this.seen.size > 800) this.seen = new Set([...this.seen].slice(-400));
      let c = this.conns[m.cid];
      if (m.k === 'conn' && this.host) {
        if (!c) { c = this.conns[m.cid] = new RelayConn(this, m.cid, m.from, key); c.open = true; this.emit('connection', c); setTimeout(() => c.emit('open'), 0); }
        this.out(m.from, key, { k: 'ack', cid: m.cid, from: this.inbox });
      } else if (m.k === 'ack' && c && !c.open) { c.open = true; clearInterval(c.knock); c.emit('open'); }
      else if ((m.k === 'data' || m.k === 'part') && c) c.got(m);
      else if (m.k === 'close' && c) { c.open = false; delete this.conns[m.cid]; c.emit('close'); }
    }
    connect(id) {
      const cid = rnd(12), key = aesKey(codeOf(id), window.GUTIRKA_NET_KEY || '');
      const c = this.conns[cid] = new RelayConn(this, cid, null, key);
      hostTopic(id).then(to => {
        c.to = to; c.peer = id;
        const knock = () => { if (!c.open && !this.destroyed) this.out(to, key, { k: 'conn', cid, from: this.inbox }); };
        knock(); c.knock = setInterval(knock, 2500);   // повторюємо, поки гутірка не відповість
        setTimeout(() => { if (!c.open) { clearInterval(c.knock); c.emit('error', { type: 'peer-unavailable' }); } }, 12000);
      });
      return c;
    }
    destroy() { this.destroyed = true; clearTimeout(this.failT); Object.values(this.conns).forEach(c => { try { c.close(); } catch (e) { /* ok */ } clearInterval(c.knock); }); this.brokers.forEach(b => b.close()); }
    disconnect() {} reconnect() {}
  }

  /* ---------------- спільний Peer: PeerJS + запасний одночасно ---------------- */
  window.GutirkaNet = function (PJ) {
    class NetConn extends Em {
      constructor(peer, id, opts) {
        super(); this.peer = id; this.open = false; this.win = null; this.tries = []; this.failed = 0; this.n = 0;
        const add = c => {
          this.n++; this.tries.push(c);
          c.on('open', () => {
            if (this.win || this.closed) { if (this.win !== c) try { c.close(); } catch (e) { /* ok */ } return; }
            this.win = c; this.open = true;
            this.tries.forEach(x => { if (x !== c) try { x.close(); } catch (e) { /* ok */ } });
            c.on('data', d => this.emit('data', d));
            c.on('close', () => { if (this.win === c) { this.open = false; this.emit('close'); } });
            this.emit('open');
          });
          c.on('error', e => { if (this.win === c) { this.emit('error', e); return; } if (++this.failed >= this.need()) { peer.emit('error', e && e.type ? e : { type: 'peer-unavailable' }); this.emit('error', e); } });
        };
        this.need = () => peer.inner.length;
        peer.inner.forEach(p => { if (p.isUp) { try { add(p.connect(id, opts)); } catch (e) { this.failed++; } } else p._gq.push(() => { if (!this.win && !this.closed) try { add(p.connect(id, opts)); } catch (e) { this.failed++; } }); });
      }
      send(d) { if (this.win) this.win.send(d); }
      close() { this.closed = true; this.open = false; this.tries.forEach(c => { try { c.close(); } catch (e) { /* ok */ } }); }
    }
    class NetPeer extends Em {
      constructor(id, opts) {
        super(); this.id = id; this.inner = []; this.destroyed = false; this.opened = false; this.errs = 0;
        const add = (p, kind) => {
          p.kind = kind; p.isUp = false; p._gq = []; this.inner.push(p);
          p.on('open', pid => { p.isUp = true; if (!this.id) this.id = pid; p._gq.splice(0).forEach(f => f()); if (!this.opened) { this.opened = true; this.emit('open', this.id); } });
          p.on('connection', c => this.emit('connection', c));
          p.on('error', e => {
            const ty = e && e.type;
            if (ty === 'unavailable-id' || ty === 'browser-incompatible') { this.emit('error', e); return; }   // код зайнятий — гутірка сама візьме інший
            if (ty === 'peer-unavailable') return;   // це вирішує NetConn
            p.isUp = false;
            if (!this.inner.some(x => x.isUp)) this.emit('error', e);   // помилка лише тоді, коли не працює жоден шлях
          });
          p.on('disconnected', () => {
            p.isUp = false;
            if (!this.inner.some(x => x.isUp)) { this.emit('disconnected'); return; }
            // інший шлях працює — цей відновлюємо самі, тихо
            const again = () => { if (this.destroyed || p.destroyed || !p.disconnected) return; try { p.reconnect(); } catch (e) { /* ok */ } setTimeout(again, 10000); };
            setTimeout(again, 3000);
          });
          p.on('close', () => { p.isUp = false; if (!this.destroyed && !this.inner.some(x => x.isUp)) this.emit('close'); });
        };
        if (PJ) { try { add(new PJ(id, opts), 'peerjs'); } catch (e) { /* без PeerJS */ } }
        try { add(new RelayPeer(id), 'relay'); } catch (e) { /* без запасного */ }
      }
      get disconnected() { return !this.inner.some(x => x.isUp); }
      connect(id, opts) { return new NetConn(this, id, opts); }
      reconnect() { this.inner.forEach(p => { if (p.disconnected && !p.destroyed) try { p.reconnect(); } catch (e) { /* ok */ } }); }
      destroy() { this.destroyed = true; this.inner.forEach(p => { try { p.destroy(); } catch (e) { /* ok */ } }); }
    }
    return NetPeer;
  };
  window.GutirkaNet.RelayPeer = RelayPeer;
})();

</script>
<script>
(function () {
'use strict';
const $ = s => document.querySelector(s);
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const KEY = 'svoya.ses';
const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return {}; } };
const save = o => { try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) { /* ok */ } };
let ses = load();
if (!ses.tok) { ses.tok = Math.random().toString(36).slice(2) + Date.now().toString(36); save(ses); }
const qk = (new URLSearchParams(location.search).get('k') || '').replace(/\D/g, '').slice(0, 6);
if (qk.length === 6) { if (ses.code !== qk) { ses.code = qk; ses.team = -1; } save(ses); $('#cbox').hidden = true; }
if (ses.name) $('#f-name').value = ses.name;

/* ---------- звʼязок ---------- */
const LIBS = ['https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.5/peerjs.min.js', 'https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js', 'https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js'];
const loadScript = src => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.async = true; s.onload = res; s.onerror = () => { s.remove(); rej(); }; document.head.appendChild(s); });
async function getPeer() { if (!window.Peer) for (const u of LIBS) { try { await loadScript(u); if (window.Peer) break; } catch (e) { /* далі */ } } return window.GutirkaNet ? window.GutirkaNet(window.Peer || null) : window.Peer; }
let peer = null, conn = null, att = 0, lastRx = 0, hb = 0, st = null;
function chip(on, t) { $('#dot').className = 'dot' + (on ? ' on' : ''); $('#stx').textContent = t; }
function stop() { att++; clearInterval(hb); try { conn && conn.close(); } catch (e) { /* ok */ } try { peer && peer.destroy(); } catch (e) { /* ok */ } conn = peer = null; }
const sendc = o => { try { conn && conn.send(o); } catch (e) { /* ok */ } };
async function connect() {
  stop(); const my = att; chip(false, 'Підключаємось…');
  let P; try { P = await getPeer(); } catch (e) { P = null; }
  if (my !== att) return;
  if (!P) { chip(false, 'Немає звʼязку'); return; }
  const p = peer = new P(undefined, window.GUTIRKA_PEER_OPTS || {});
  const tmo = setTimeout(() => { if (my === att && !(conn && conn.open)) retry(my, 'Не знайшли гру — перевір код'); }, 15000);
  p.on('error', e => { if (my !== att) return; if (e && e.type === 'peer-unavailable') { clearTimeout(tmo); retry(my, 'Гру з таким кодом не знайдено'); } });
  p.on('open', () => {
    if (my !== att) return;
    const c = conn = p.connect('gutirky-svoya-' + ses.code, { reliable: true });
    c.on('open', () => { if (my !== att) return; clearTimeout(tmo); lastRx = Date.now(); c.send({ t: 'join', name: ses.name, tok: ses.tok, team: ses.team }); chip(true, 'На звʼязку');
      hb = setInterval(() => { sendc({ t: 'ping' }); if (Date.now() - lastRx > 16000) retry(my, 'Звʼязок перервався'); }, 5000); });
    c.on('data', d => { if (my === att) { lastRx = Date.now(); if (d && d.t === 'st') { st = d; render(); } } });
    c.on('close', () => { if (my === att) retry(my, 'Звʼязок перервався'); });
  });
}
function retry(my, why) { if (my !== att) return; stop(); chip(false, why + ' · пробуємо знову'); setTimeout(connect, 3000); }

/* ---------- екран ---------- */
let lastQ = '';
function render() {
  $('#join').hidden = true;
  const ti = st.me.team, T = st.teams[ti];
  if (!T) { $('#pick').hidden = false; $('#play').hidden = true;
    $('#tp').innerHTML = st.teams.map((t, i) => `<button type="button" data-t="${i}" style="--c:${t.c}">${esc(t.n)}</button>`).join(''); return; }
  $('#pick').hidden = true; $('#play').hidden = false;
  $('#me').style.setProperty('--c', T.c);
  $('#me').innerHTML = `<b>${esc(T.n)}<small>${esc(st.me.name || '')} · <a href="#" id="chg" style="color:inherit">змінити команду</a></small></b><span>${T.s}</span>`;
  const b = $('#bz'), s = $('#st'), Q = st.q;
  b.className = ''; s.className = 'st';
  if (st.ph === 'q' && Q) {
    const sig = Q.cat + Q.v; if (sig !== lastQ) { lastQ = sig; if (navigator.vibrate) navigator.vibrate(40); }
    $('#q').innerHTML = esc(Q.cat) + '<b>' + (Q.worth !== Q.v ? Q.v + ' → ' + Q.worth : Q.v) + '</b>';
    $('#vr').innerHTML = (Q.vars ? '<div class="vr">' + Q.vars.map((o, i) => '<div><b>' + 'АБВГ'[i] + '</b>' + esc(o) + '</div>').join('') + '</div>' : '') + (Q.canHint ? '<button type="button" class="hn" id="hn">💡 Взяти варіанти · за правильну — половина балів (ще ' + T.h + ')</button>' : '');
    b.disabled = !Q.open || Q.lock;
    if (Q.mine && !Q.done) { b.className = 'mine'; b.disabled = true; s.className = 'st ok'; s.textContent = 'Ти перший! Відповідай уголос'; }
    else if (Q.turn && !Q.done) { s.textContent = (Q.turn.team === ti ? 'Ваша черга! Порадьтеся й відповідайте' : 'Відповідає: ' + Q.turn.tn) + (Q.turn.name && Q.turn.team !== ti ? ' · ' + Q.turn.name : ''); if (Q.turn.team === ti) s.className = 'st ok'; }
    else if (Q.done) s.textContent = Q.turn ? '✓ ' + Q.turn.tn + ' +' + (Q.gain || Q.v) : 'Питання закрите';
    else if (Q.lock) s.textContent = 'Твоя команда вже відповідала';
    else s.textContent = st.mode === 'cherha' ? 'Чекаємо' : 'Знаєш? Тисни!';
    $('#ans').innerHTML = Q.ans ? 'Відповідь: <b>' + esc(Q.ans) + '</b>' : '';   // повна, з довідкою
  } else {
    $('#q').textContent = st.ph === 'fin' ? 'Гру завершено' : st.ph === 'board' ? 'Табло' : 'Чекаємо початку';
    $('#vr').innerHTML = ''; b.disabled = true; s.textContent = st.ph === 'board' ? 'Питання вибирає: ' + ((st.teams[st.chooser] || {}).n || '') : st.ph === 'fin' ? 'Результати — на екрані' : 'Ведучий скоро почне'; $('#ans').textContent = '';
  }
  $('#tbl').innerHTML = st.teams.map(t => `<span style="--c:${t.c}">${esc(t.n)} ${t.s} · 💡${t.h}</span>`).join('');
}
$('#tp').addEventListener('click', e => { const b = e.target.closest('[data-t]'); if (!b) return; ses.team = +b.dataset.t; save(ses); st.me.team = ses.team; sendc({ t: 'team', team: ses.team }); render(); });
$('#play').addEventListener('click', e => { if (e.target.id === 'hn') { sendc({ t: 'hint' }); e.target.disabled = true; return; } if (e.target.id === 'chg') { e.preventDefault(); st.me.team = -1; render(); } });
$('#bz').addEventListener('pointerdown', e => { e.preventDefault(); if ($('#bz').disabled) return; sendc({ t: 'buzz' }); $('#bz').disabled = true; if (navigator.vibrate) navigator.vibrate(80); });
$('#bz').addEventListener('click', e => { if (e.detail === 0 && !$('#bz').disabled) { sendc({ t: 'buzz' }); $('#bz').disabled = true; } });   // клавіатура
function join() {
  const name = $('#f-name').value.replace(/\s+/g, ' ').trim(), cd = ($('#f-code').value || '').replace(/\D/g, '');
  if (!$('#cbox').hidden) { if (cd.length !== 6) { $('#err').textContent = 'Код — 6 цифр з екрана гри.'; return; } if (ses.code !== cd) ses.team = -1; ses.code = cd; }
  if (name.length < 2) { $('#err').textContent = 'Напиши своє імʼя.'; return; }
  ses.name = name; save(ses); $('#err').textContent = ''; $('#join').hidden = true; chip(false, 'Підключаємось…'); connect();
}
$('#go').addEventListener('click', join);
$('#f-name').addEventListener('keydown', e => { if (e.key === 'Enter') join(); });
})();
</script>
