<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Пластова бібліотека · проєктор</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Oswald:wght@500;600&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* ═══ СТАНДАРТ СТИЛЮ — кольори, шрифти, заокруглення, висота кнопок. Спільний для всіх сторінок. ═══ */
:root{
  /* основа — темний екран */
  --s-bg:#1b1d21; --s-card:#22262b; --s-card2:#2a2f35; --s-pole:#14171a; --s-ln:#383d44;
  --s-ink:#f2f4f6; --s-body:#cfd5dc; --s-mut:#a0a8b2;
  /* улади: колір показує, для кого сторінка; «-t» — світліший, для тексту на темному; «-on» — текст на кнопці цього кольору */
  --s-upn:#ffd23f; --s-upn-on:#1d1606;
  --s-upyu:#c8284a; --s-upyu-t:#ff7d99; --s-upyu-on:#ffffff;
  --s-vyh:#3daf6e; --s-vyh-t:#62cf93; --s-vyh-on:#0e1f15;
  --s-ups:#b0773a;
  --s-all:#c9cfd6;
  --s-all4:linear-gradient(90deg,var(--s-upn) 0 25%,var(--s-upyu) 0 50%,var(--s-vyh) 0 75%,var(--s-ups) 0);
  /* службові */
  --s-ihry:#ffc247; --s-ihry-on:#1d1606;
  --s-hand:#2fd2c0; --s-ol:#9fb57a;
  --s-ok:#62cf93; --s-uvaga:#f0c060; --s-pomylka:#ff6a6a;
  /* папір (бланки, звіти, PDF) */
  --s-p-bg:#ffffff; --s-p-ink:#1d2125; --s-p-mut:#5f6873; --s-p-ln:#cfd5dc; --s-p-ac:#c8284a; --s-p-th:#f9e6ea;
  /* шрифти */
  --s-disp:Oswald,'Arial Narrow',sans-serif; --s-txt:'Source Sans 3',system-ui,sans-serif; --s-ruka:Caveat,'Segoe Print',cursive;
  /* заокруглення: кнопка й поле 12, плитка 18, велика картка й вікно 20, пігулка кругла; дрібні деталі: мітка 6, смужка 3 */
  --s-r:12px; --s-r-plytka:18px; --s-r-karta:20px; --s-r-pil:99px; --s-r-mitka:6px; --s-r-smuzhka:3px;
  /* висота: звичайна кнопка й поле 50, головна кнопка гри 54 */
  --s-h:50px; --s-h-hra:54px;
}
/* ═══ КНОПКИ — одна реакція на всіх сторінках ═══
   навели: рамка кольором розділу (головна кнопка — біла рамка) · натиснули: темнішає й опускається ·
   клавіатура або пульт: біла обвідка · недоступна: бліда · «видалити»: не залита, червоний напис */
:root :is(button,a,summary,[role=button],[tabindex]):focus-visible{outline:3px solid var(--s-ink);outline-offset:2px}
:root .btn:where(:not(.main,.ok,[disabled])):hover{border-color:var(--ak,var(--d-t,var(--gd,var(--ab,var(--a,var(--s-ink))))));box-shadow:0 0 0 1px var(--ak,var(--d-t,var(--gd,var(--ab,var(--a,var(--s-ink))))))}
:root .btn:is(.main,.ok):where(:not([disabled])):hover{border-color:var(--s-ink);box-shadow:0 0 0 1px var(--s-ink)}
:root .btn:where(:not([disabled])):active{transform:translateY(2px);filter:brightness(.88)}
:root .btn[disabled]{opacity:.45;cursor:not-allowed}
:root .btn.neb,:root .btn.warn{background:var(--s-card2);border-color:var(--s-ln);color:var(--s-pomylka)}
:root .btn:is(.neb,.warn):where(:not([disabled])):hover,:root .btn.warn.sure{border-color:var(--s-pomylka);box-shadow:0 0 0 1px var(--s-pomylka)}
:root .btn.warn.sure{background:rgba(255,106,106,.14)}
/* ═══ кінець стандарту ═══ */

/* Сайт для проєктора: кадр 16:9 без гортання сторінки; керування — звичайний пульт або телефон (QR).
   1rem = 1/80 ширини кадру (на 1280×720 — 16px). Кольори, шрифти, кути — лише зі стандарту сайту.
   Той самий файл на телефоні (#c=…&k=…) — сайт для телефона, що керує проєктором (body.tel). */
html{font-size:calc(min(100vw,177.78vh)/80)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--s-bg)}
body{color:var(--s-ink);font:400 1rem/1.35 var(--s-txt)}
body.pult{cursor:none}
#app{position:absolute;inset:0;margin:auto;width:80rem;height:45rem;padding:2.2rem 3rem 1.4rem;display:flex;flex-direction:column;overflow:hidden}
.verh{display:flex;justify-content:space-between;align-items:flex-start;gap:2rem;flex:none}
.logo{height:3.8rem;display:block}
.nad{font:600 .75rem var(--s-disp);letter-spacing:.3em;text-transform:uppercase;color:var(--s-mut)}
h1{font:600 5rem/1.02 var(--s-disp);text-transform:uppercase;margin:.4rem 0 0}
h1.m{font-size:3.4rem;margin-top:.3rem}
.lin{height:.36rem;width:12rem;border-radius:var(--s-r-smuzhka);margin-top:.8rem;background:var(--c,var(--s-all4))}
.ruka{font:600 2rem var(--s-ruka);color:var(--s-body);margin-top:.6rem}
svg.ic{width:1em;height:1em;vertical-align:-.14em;flex:none}
.pidk kbd svg.ic{width:.95em;margin:0 .05em}
#str svg.ic{width:1.9rem;height:1.9rem}
.pam .b svg.ic{width:1.1rem;height:1.1rem}
/* рамка пульта — біла обвідка (брендбук: «біла обвідка для пульта») */
.f{cursor:pointer;transition:transform .12s,box-shadow .12s}
.f.fok{outline:.22rem solid var(--s-ink);outline-offset:.28rem;transform:translateY(-.25rem);box-shadow:0 .8rem 2rem rgba(0,0,0,.45)}
/* картка QR «Телефон — пульт» */
.qrk{display:flex;gap:1.1rem;align-items:center;background:var(--s-card);border:1px solid var(--s-ln);border-radius:var(--s-r-karta);padding:.7rem 1.2rem .7rem .7rem;flex:none}
.qrk .q{line-height:0}
.qrk .q svg{width:5.6rem;height:5.6rem;display:block}
.qrk b{display:block;font:600 1.15rem var(--s-disp);text-transform:uppercase;letter-spacing:.04em}
.qrk span{font-size:.95rem;color:var(--s-mut);display:block;max-width:14rem;line-height:1.3;margin-top:.25rem}
.qrk .st{display:inline-flex;align-items:center;gap:.45rem;margin-top:.5rem;font-weight:700;font-size:.9rem;color:var(--s-mut)}
.qrk .st i{width:.65rem;height:.65rem;border-radius:50%;background:var(--s-uvaga)}
.qrk .st.ok{color:var(--s-ok)} .qrk .st.ok i{background:var(--s-ok)}
.qrk.mal{padding:.7rem 1.2rem;background:transparent;border-color:transparent}
.qrk.mal .st{margin:0;font-size:1rem}
.qrk.big{flex-direction:column;text-align:center;padding:.9rem;gap:.4rem;margin-top:-1rem}
.qrk.big .st{margin:0;min-height:1.2rem}
.qrk.big .st:not(.ok):has(i:only-child){display:none}
.qrk.big .q{padding:0}
.qrk.big.on{padding:2rem 2.4rem;gap:1rem;margin-top:0}
.qrk.big.on .tbig svg.ic{width:6rem;height:6rem;color:var(--s-ok)}
.qrk.big.on .st{font-size:1.3rem}
.qrk.big .q svg{width:21rem;height:21rem}
.qrk.big b{font-size:1.45rem}
.qrk.big span{font-size:1.05rem;max-width:17rem}
/* головна */
.hverh{display:flex;justify-content:space-between;align-items:flex-start;gap:2rem;flex:none}
/* ТИМЧАСОВО: QR опитування «Знайомство» на головній (прибрати — OPYT = '') */
.opyt{display:flex;flex-direction:column;align-items:center;gap:.4rem;margin:.6rem 1.2rem 0 auto;text-align:center}
.opyt .q{line-height:0}
.opyt .q svg{width:20rem;height:20rem;display:block}
.hverh:has(.opyt) .qrk.big .q svg{width:20rem;height:20rem}
.qrk.big b.pidp{font:600 1.35rem var(--s-disp);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;color:var(--s-ok);margin:0}
.qrk.big span.pidp{font-size:1.05rem;color:var(--s-mut);margin-top:-.2rem;max-width:none}
.hverh:has(.opyt) .qrk.big{background:none;border:0;padding:0;margin-top:.6rem;gap:.4rem}
.hverh:has(.opyt) .qrk.big .st:not(.ok):has(i:only-child){display:inline-flex;visibility:hidden}
/* на час опитування: два QR стоять точно над двома правими плитками (та сама сітка, що й «двері») */
.hverh:has(.opyt){display:grid;grid-template-columns:repeat(4,1fr);gap:1.4rem;align-items:start}
.hverh:has(.opyt) .opyt,.hverh:has(.opyt) .qrk.big{align-self:start;margin-top:2.6rem !important}
.hverh:has(.opyt) .logo-wrap{grid-column:1/3}
.hverh:has(.opyt) .opyt,.hverh:has(.opyt) .qrk.big{margin:0;width:100%}
.hverh:has(.opyt) .opyt .q,.hverh:has(.opyt) .qrk.big .q{width:100%}
.hverh:has(.opyt) .opyt .q svg,.hverh:has(.opyt) .qrk.big .q svg{width:100%;height:auto;aspect-ratio:1}
.hverh:has(.opyt) .qrk.big .st{display:none}
.opyt b{font:600 1.35rem var(--s-disp);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;color:var(--s-upyu-t)}
.opyt span{font-size:1.05rem;color:var(--s-mut);margin-top:-.2rem}
.dveri{display:grid;grid-template-columns:repeat(4,1fr);gap:1.4rem;margin-top:auto;margin-bottom:.6rem}
.dv{background:var(--s-card);border:1px solid var(--s-ln);border-radius:var(--s-r-plytka);padding:1.5rem 1.5rem 1.3rem;position:relative;overflow:hidden;min-height:13.5rem;display:flex;flex-direction:column}
.dv:before{content:"";position:absolute;left:0;right:0;top:0;height:.34rem;background:var(--c)}
.dv h3{font:600 2.5rem var(--s-disp);text-transform:uppercase;margin:0;color:var(--ct,var(--s-ink))}
.dv p{margin:.5rem 0 0;color:var(--s-body);font-size:1.2rem;line-height:1.35}
.dv .d{margin-top:auto;font-weight:700;font-size:1.25rem;color:var(--ct,var(--s-ink));padding-top:.8rem}
.dv.zg{border-style:dashed;opacity:.6}
.yu{--c:var(--s-upyu);--ct:var(--s-upyu-t)} .vy{--c:var(--s-vyh);--ct:var(--s-vyh-t)} .vs{--c:var(--s-all4);--ct:var(--s-ink)} .nv{--c:var(--s-upn);--ct:var(--s-upn)}
.vs:before{background:var(--s-all4)!important}
/* вкладки-перемикач */
.vkl{display:flex;gap:.8rem;margin-top:1.2rem;flex:none;align-items:center}
.vkl .t{font-weight:700;font-size:1.25rem;padding:.65rem 1.6rem;border-radius:var(--s-r-pil);background:var(--s-card2);color:var(--s-body);border:1px solid var(--s-ln);white-space:nowrap}
.vkl .t.on{background:var(--s-ink);color:var(--s-bg);border-color:var(--s-ink)}
.vkl .t.zakr{margin-left:auto;color:var(--s-mut);font-size:1.05rem}
.vkl .t .n{font-weight:600;opacity:.6;margin-left:.45rem}
/* зона з плитками: гортається сама, коли рамка йде нижче */
.zona{flex:1;min-height:0;overflow:hidden;margin:.6rem -.8rem 0;padding:.8rem .8rem 1rem}
.sitka{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4rem}
.sitka.s5{grid-template-columns:repeat(5,1fr);gap:1.1rem}
.pl{background:var(--s-card);border:1px solid var(--s-ln);border-radius:var(--s-r-plytka);overflow:hidden;position:relative;display:flex;flex-direction:column}
.pl:before{content:"";position:absolute;left:0;right:0;top:0;height:.34rem;background:var(--c,var(--s-ln));z-index:1}
.pl .im{height:10.5rem;background:var(--s-card2) center/cover no-repeat;display:grid;place-items:center}
.pl .im.ik svg{width:5.5rem;height:5.5rem}
.pl .tx{padding:1.1rem 1.3rem 1.2rem;display:flex;flex-direction:column;flex:1}
.pl .nad{color:var(--ct,var(--s-mut));font-size:.72rem;letter-spacing:.22em}
.pl h4{font:600 1.8rem/1.12 var(--s-disp);text-transform:uppercase;margin:.3rem 0 0}
.pl p{margin:.45rem 0 0;color:var(--s-body);font-size:1.1rem;line-height:1.4}
.pl .d{font-weight:700;font-size:1.15rem;color:var(--ct,var(--s-ink));margin-top:auto;padding-top:.7rem}
/* вмілості */
.vm{background:var(--s-card);border:1px solid var(--s-ln);border-radius:var(--s-r-plytka);padding:.9rem .7rem .8rem;text-align:center;display:flex;flex-direction:column;align-items:center;gap:.5rem;min-height:11.5rem}
.vm .ph{width:6rem;height:6rem;display:grid;place-items:center}
.vm .ph img{max-width:100%;max-height:100%}
.vm .ph i{font:600 2.6rem var(--s-disp);color:var(--s-mut);font-style:normal}
.vm b{font-size:1.05rem;line-height:1.2}
.vm .m{font-size:.75rem;font-weight:700;color:var(--s-upyu-t);text-transform:uppercase;letter-spacing:.08em}
/* «Цікаве» — без вибору */
.fakt{background:var(--s-card);border:1px solid var(--s-ln);border-radius:var(--s-r-plytka);padding:1.6rem 1.7rem 1.5rem}
.fakt b{font:600 2.6rem var(--s-disp);text-transform:uppercase;display:block}
.fakt p{margin:.6rem 0 0;color:var(--s-body);font-size:1.35rem;line-height:1.4}
/* підказка клавіш */
.pidk{margin-top:.8rem;display:flex;gap:2.2rem;color:var(--s-mut);font-size:1rem;flex:none}
.pidk kbd{font:700 .95rem var(--s-txt);color:var(--s-ink);background:var(--s-card2);border:1px solid var(--s-ln);border-radius:var(--s-r-mitka);padding:.12rem .5rem;margin-right:.4rem}
.porozh{color:var(--s-mut);font-size:1.3rem;padding:2rem 0}
/* вхід за кодом (проєктор) */
.kod{display:grid;grid-template-columns:1fr 26rem;gap:4rem;margin-top:1.6rem;flex:1;min-height:0}
.kod .pr p{color:var(--s-body);font-size:1.35rem;line-height:1.45;margin:0 0 1rem;max-width:32rem}
.kod .pr p.mal{color:var(--s-mut);font-size:1.1rem}
.krapky{display:flex;gap:1rem;margin:1.2rem 0 .6rem;height:2rem;align-items:center}
.krapky i{width:1.4rem;height:1.4rem;border-radius:50%;border:2px solid var(--s-ln)}
.krapky i.on{background:var(--s-ink);border-color:var(--s-ink)}
.krapky.err i{border-color:var(--s-pomylka)}
#kp-msg{min-height:1.6rem;font-weight:700;color:var(--s-pomylka);font-size:1.1rem}
.klav{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem;align-content:start}
.klav .k{background:var(--s-card2);border:1px solid var(--s-ln);border-radius:var(--s-r);height:4.6rem;display:grid;place-items:center;font:600 2rem var(--s-disp)}
.klav .k.sm{font:700 1.05rem var(--s-txt);color:var(--s-body);display:flex;align-items:center;justify-content:center;gap:.5rem}
.klav .k.ok{background:var(--s-vyh);border-color:var(--s-vyh);color:#fff;font:700 1.15rem var(--s-txt)}
.pam{display:flex;align-items:center;gap:.8rem;padding:.8rem 1.1rem;border-radius:var(--s-r);background:var(--s-card);border:1px solid var(--s-ln);font-weight:700;font-size:1.15rem;margin-top:.4rem;width:max-content}
.pam .b{width:1.6rem;height:1.6rem;border-radius:var(--s-r-mitka);border:2px solid var(--s-mut);display:grid;place-items:center;font-size:1.05rem;line-height:1}
.pam.on .b{background:var(--s-vyh);border-color:var(--s-vyh);color:#fff}
.pam small{display:block;font-weight:400;color:var(--s-mut);font-size:.9rem}
@keyframes tr{20%,60%{transform:translateX(-.5rem)}40%,80%{transform:translateX(.5rem)}}
.krapky.err{animation:tr .4s}
/* вікно поверх: пісня, підказка, вмілість, вибір версії */
#det{position:fixed;inset:0;z-index:5;background:rgba(10,11,13,.82);display:flex;align-items:center;justify-content:center}
#det[hidden]{display:none}
#det .vk{width:74rem;max-height:41rem;background:var(--s-bg);border:1px solid var(--s-ln);border-radius:var(--s-r-karta);padding:2.2rem 2.8rem 1.8rem;display:flex;flex-direction:column;position:relative;overflow:hidden}
#det .vk:before{content:"";position:absolute;left:0;right:0;top:0;height:.34rem;background:var(--c,var(--s-all4))}
#det h2{font:600 3rem/1.05 var(--s-disp);text-transform:uppercase;margin:.3rem 0 0}
#det .sub{color:var(--s-mut);font-size:1.25rem;margin:.4rem 0 0}
#det .tilo{flex:1;min-height:0;overflow:hidden;margin-top:1.2rem;position:relative}
#det .vrsh{columns:2;column-gap:3rem}
#det .vrsh p{font-size:1.65rem;line-height:1.45;white-space:pre-line;margin:0 0 1.1rem;break-inside:avoid}
#det .vrsh p.ch{font-style:italic;color:var(--s-body);padding-left:1.2rem;border-left:.2rem solid var(--s-ln)}
#det ol.kr{margin:0;padding-left:2.4rem;font-size:1.65rem;line-height:1.4}
#det ol.kr li{margin-bottom:.7rem}
#det .morse{font:600 2.6rem var(--s-disp);letter-spacing:.2em;margin:.2rem 0 1rem}
#det .por{color:var(--s-body);font-size:1.3rem;margin-top:1rem}
#det .dn{display:flex;gap:1rem;margin-top:1.2rem;flex:none;align-items:center;flex-wrap:wrap}
#det .dn .gl{margin-left:auto;color:var(--s-mut);font-size:1rem}
.bt{display:inline-flex;align-items:center;gap:.6rem;padding:.8rem 1.6rem;border-radius:var(--s-r);background:var(--s-card2);border:1px solid var(--s-ln);font-weight:700;font-size:1.2rem;color:var(--s-ink)}
.bt.main{background:var(--c2,var(--s-vyh));border-color:var(--c2,var(--s-vyh));color:#fff}
.skh{display:flex;gap:2rem;align-items:center}
.skh .ph{width:9rem;height:9rem;flex:none;display:grid;place-items:center;background:var(--s-card);border-radius:var(--s-r-plytka);border:1px solid var(--s-ln)}
.skh .ph img{max-width:85%;max-height:85%}
.rivni{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1rem}
.rivni span{padding:.45rem 1rem;border-radius:var(--s-r-pil);background:var(--s-card2);border:1px solid var(--s-ln);font-weight:700;font-size:1.1rem;color:var(--s-body)}
.matb{margin-top:1.4rem;padding:1.1rem 1.3rem;border-radius:var(--s-r-plytka);background:var(--s-card);border:1px solid var(--s-ln)}
.matb b{font:600 1.4rem var(--s-disp);text-transform:uppercase;color:var(--s-upyu-t)}
.matb p{margin:.4rem 0 0;color:var(--s-body);font-size:1.2rem}
.vars{display:grid;grid-template-columns:repeat(2,1fr);gap:1.2rem;margin-top:1.2rem}
/* відкрите на весь екран */
#fr{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000;z-index:10}
#load{position:fixed;inset:0;z-index:20;background:var(--s-bg);display:flex;align-items:center;justify-content:center;font:600 2.4rem var(--s-disp);text-transform:uppercase;color:var(--s-mut)}
#load[hidden]{display:none}
#tst{position:fixed;z-index:40;left:50%;bottom:1.6rem;transform:translateX(-50%);padding:.6rem 1.3rem;border-radius:var(--s-r-pil);background:var(--s-card);border:1px solid var(--s-ln);color:var(--s-ink);font-weight:700;font-size:1.2rem;transition:opacity .4s;pointer-events:none}
#tst.off{opacity:0}
#tbar,#ctl,#tkod{display:none}

/* ================= ТЕЛЕФОН: звичайний сайт для телефона, що керує проєктором ================= */
html.tel{font-size:16px;height:auto;overflow:auto}
body.tel{overflow:auto;height:auto;min-height:100%}
body.tel #app{position:static;width:auto;height:auto;margin:0;padding:4.4rem 1rem 2rem;overflow:visible}
body.tel .qrk,body.tel .opyt,body.tel .pidk,body.tel .logo-wrap .logo{display:none}
body.tel .hverh{display:block}
body.tel h1{font-size:2.6rem} body.tel h1.m{font-size:2.2rem}
body.tel .ruka{font-size:1.5rem}
body.tel .dveri{grid-template-columns:1fr 1fr;gap:.8rem;margin-top:1.4rem}

  function zmist(scr, t) {

    if (t === 'gut') return '<div class="sitka">' + D.gut.map(g => plytka({ id: 'g-' + g.id, go: 'gut:' + g.id, c: C.yu[0], ct: C.yu[1], img: g.art, nad: g.sp, h: g.t, p: g.p, d: 'Показати →' })).join('') + '</div>';

  // ТИМЧАСОВО: опитування «Знайомство» — після зустрічі з гуртком поставити OPYT = ''
