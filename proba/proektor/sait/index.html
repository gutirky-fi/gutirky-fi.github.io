<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Пластова бібліотека · проєктор</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Oswald:wght@500;600&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* ═══ СТАНДАРТ СТИЛЮ — кольори, шрифти, заокруглення, висота кнопок. Спільний для всіх сторінок. ═══ */
:root{
  /* основа — темний екран */
  --s-bg:#1b1d21; --s-card:#22262b; --s-card2:#2a2f35; --s-pole:#14171a; --s-ln:#383d44;
  --s-ink:#f2f4f6; --s-body:#cfd5dc; --s-mut:#a0a8b2;
  /* улади: колір показує, для кого сторінка; «-t» — світліший, для тексту на темному; «-on» — текст на кнопці цього кольору */
  --s-upn:#ffd23f; --s-upn-on:#1d1606;
  --s-upyu:#c8284a; --s-upyu-t:#ff7d99; --s-upyu-on:#ffffff;
  --s-vyh:#3daf6e; --s-vyh-t:#62cf93; --s-vyh-on:#0e1f15;
  --s-ups:#b0773a;
  --s-all:#c9cfd6;
  --s-all4:linear-gradient(90deg,var(--s-upn) 0 25%,var(--s-upyu) 0 50%,var(--s-vyh) 0 75%,var(--s-ups) 0);
  /* службові */
  --s-ihry:#ffc247; --s-ihry-on:#1d1606;
  --s-hand:#2fd2c0; --s-ol:#9fb57a;
  --s-ok:#62cf93; --s-uvaga:#f0c060; --s-pomylka:#ff6a6a;
  /* папір (бланки, звіти, PDF) */
  --s-p-bg:#ffffff; --s-p-ink:#1d2125; --s-p-mut:#5f6873; --s-p-ln:#cfd5dc; --s-p-ac:#c8284a; --s-p-th:#f9e6ea;
  /* шрифти */
  --s-disp:Oswald,'Arial Narrow',sans-serif; --s-txt:'Source Sans 3',system-ui,sans-serif; --s-ruka:Caveat,'Segoe Print',cursive;
  /* заокруглення: кнопка й поле 12, плитка 18, велика картка й вікно 20, пігулка кругла; дрібні деталі: мітка 6, смужка 3 */
  --s-r:12px; --s-r-plytka:18px; --s-r-karta:20px; --s-r-pil:99px; --s-r-mitka:6px; --s-r-smuzhka:3px;
  /* висота: звичайна кнопка й поле 50, головна кнопка гри 54 */
  --s-h:50px; --s-h-hra:54px;
}
/* ═══ КНОПКИ — одна реакція на всіх сторінках ═══
   навели: рамка кольором розділу (головна кнопка — біла рамка) · натиснули: темнішає й опускається ·
   клавіатура або пульт: біла обвідка · недоступна: бліда · «видалити»: не залита, червоний напис */
:root :is(button,a,summary,[role=button],[tabindex]):focus-visible{outline:3px solid var(--s-ink);outline-offset:2px}
:root .btn:where(:not(.main,.ok,[disabled])):hover{border-color:var(--ak,var(--d-t,var(--gd,var(--ab,var(--a,var(--s-ink))))));box-shadow:0 0 0 1px var(--ak,var(--d-t,var(--gd,var(--ab,var(--a,var(--s-ink))))))}
:root .btn:is(.main,.ok):where(:not([disabled])):hover{border-color:var(--s-ink);box-shadow:0 0 0 1px var(--s-ink)}
:root .btn:where(:not([disabled])):active{transform:translateY(2px);filter:brightness(.88)}
:root .btn[disabled]{opacity:.45;cursor:not-allowed}
:root .btn.neb,:root .btn.warn{background:var(--s-card2);border-color:var(--s-ln);color:var(--s-pomylka)}
:root .btn:is(.neb,.warn):where(:not([disabled])):hover,:root .btn.warn.sure{border-color:var(--s-pomylka);box-shadow:0 0 0 1px var(--s-pomylka)}
:root .btn.warn.sure{background:rgba(255,106,106,.14)}
/* ═══ кінець стандарту ═══ */

/* Сайт для проєктора: кадр 16:9 без гортання сторінки; керування — стрілки, OK, «Назад» звичайного пульта.
   1rem = 1/80 ширини кадру (на 1280×720 — 16px). Кольори, шрифти, кути — лише зі стандарту сайту. */
html{font-size:calc(min(100vw,177.78vh)/80)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--s-bg)}
body{color:var(--s-ink);font:400 1rem/1.35 var(--s-txt)}
body.pult{cursor:none}
#app{position:absolute;inset:0;margin:auto;width:80rem;height:45rem;padding:2.2rem 3rem 1.4rem;display:flex;flex-direction:column;overflow:hidden}
.verh{display:flex;justify-content:space-between;align-items:flex-start;gap:2rem;flex:none}
.logo{height:3.6rem;display:block}
.nad{font:600 .62rem var(--s-disp);letter-spacing:.32em;text-transform:uppercase;color:var(--s-mut)}
h1{font:600 4rem/1.05 var(--s-disp);text-transform:uppercase;margin:.4rem 0 0}
h1.m{font-size:3.1rem;margin-top:.3rem}
.lin{height:.32rem;width:11rem;border-radius:var(--s-r-smuzhka);margin-top:.8rem;background:var(--c,var(--s-all4))}
.ruka{font:600 1.6rem var(--s-ruka);color:var(--s-body);margin-top:.6rem}
.wm{position:absolute;right:9rem;top:9.5rem;height:16rem;opacity:.16;pointer-events:none}
/* фокус пульта — біла обвідка (як «біла обвідка для пульта» у брендбуку) */
.f{cursor:pointer;transition:transform .12s,box-shadow .12s}
.f.fok{outline:.2rem solid var(--s-ink);outline-offset:.25rem;transform:translateY(-.25rem);box-shadow:0 .8rem 2rem rgba(0,0,0,.45)}
/* картка «Телефон — пульт» */
.tel{display:flex;gap:1rem;align-items:center;background:var(--s-card);border:1px solid var(--s-ln);border-radius:var(--s-r-karta);padding:.8rem 1.2rem .8rem .8rem;flex:none}
.tel .ic{width:4.2rem;height:4.2rem;border-radius:var(--s-r);background:var(--s-card2);display:grid;place-items:center}
.tel .ic svg{width:2.4rem;height:2.4rem}
.tel b{display:block;font:600 1.05rem var(--s-disp);text-transform:uppercase;letter-spacing:.04em}
.tel span{font-size:.8rem;color:var(--s-mut);display:block;max-width:13rem;line-height:1.3;margin-top:.2rem}
/* головна: чотири входи */
.dveri{display:grid;grid-template-columns:repeat(4,1fr);gap:1.1rem;margin-top:auto}
.dv{background:var(--s-card);border:1px solid var(--s-ln);border-radius:var(--s-r-plytka);padding:1.2rem 1.2rem 1rem;position:relative;overflow:hidden;min-height:9.5rem;display:flex;flex-direction:column}
.dv:before{content:"";position:absolute;left:0;right:0;top:0;height:.28rem;background:var(--c)}
.dv h3{font:600 1.75rem var(--s-disp);text-transform:uppercase;margin:0;color:var(--ct,var(--s-ink))}
.dv p{margin:.35rem 0 0;color:var(--s-mut);font-size:.85rem;line-height:1.35}
.dv .d{margin-top:auto;font-weight:700;font-size:.9rem;color:var(--ct,var(--s-ink));padding-top:.7rem}
.dv.zg{border-style:dashed;opacity:.6}
.yu{--c:var(--s-upyu);--ct:var(--s-upyu-t)} .vy{--c:var(--s-vyh);--ct:var(--s-vyh-t)} .vs{--c:var(--s-all4);--ct:var(--s-ink)} .nv{--c:var(--s-upn);--ct:var(--s-upn)}
.vs:before{background:var(--s-all4)!important}
/* вкладки-перемикач */
.vkl{display:flex;gap:.7rem;margin-top:1.2rem;flex:none;align-items:center}
.vkl .t{font-weight:700;font-size:.9rem;padding:.55rem 1.3rem;border-radius:var(--s-r-pil);background:var(--s-card2);color:var(--s-body);border:1px solid var(--s-ln)}
.vkl .t.on{background:var(--s-ink);color:var(--s-bg);border-color:var(--s-ink)}
.vkl .t.zakr{margin-left:auto;color:var(--s-mut)}
.vkl .t .n{font-weight:600;opacity:.6;margin-left:.4rem}
/* зона з плитками: гортається сама, коли рамка пульта йде нижче */
.zona{flex:1;min-height:0;overflow:hidden;margin:.6rem -.8rem 0;padding:.8rem .8rem 1rem}
.sitka{display:grid;grid-template-columns:repeat(4,1fr);gap:1.1rem}
.sitka.s6{grid-template-columns:repeat(6,1fr);gap:.9rem}
.pl{background:var(--s-card);border:1px solid var(--s-ln);border-radius:var(--s-r-plytka);overflow:hidden;position:relative;display:flex;flex-direction:column}
.pl:before{content:"";position:absolute;left:0;right:0;top:0;height:.28rem;background:var(--c,var(--s-ln));z-index:1}
.pl .im{height:11rem;background:var(--s-card2) center/cover no-repeat;display:grid;place-items:center}
.pl .im.ik svg{width:5rem;height:5rem}
.pl .im.ik{background:var(--s-card2)}
.pl .tx{padding:.75rem 1rem .9rem;display:flex;flex-direction:column;flex:1}
.pl .nad{color:var(--ct,var(--s-mut));font-size:.5rem;letter-spacing:.28em}
.pl h4{font:600 1.25rem/1.15 var(--s-disp);text-transform:uppercase;margin:.25rem 0 0}
.pl p{margin:.3rem 0 0;color:var(--s-mut);font-size:.78rem;line-height:1.35}
.pl .d{font-weight:700;font-size:.85rem;color:var(--ct,var(--s-ink));margin-top:auto;padding-top:.5rem}
/* маленькі плитки вмілостей */
.vm{background:var(--s-card);border:1px solid var(--s-ln);border-radius:var(--s-r-plytka);padding:.7rem .6rem .6rem;text-align:center;display:flex;flex-direction:column;align-items:center;gap:.4rem;min-height:9.4rem}
.vm .ph{width:5rem;height:5rem;display:grid;place-items:center}
.vm .ph img{max-width:100%;max-height:100%}
.vm .ph i{font:600 2rem var(--s-disp);color:var(--s-mut);font-style:normal}
.vm b{font-size:.78rem;line-height:1.2}
.vm .m{font-size:.62rem;font-weight:700;color:var(--s-upyu-t);text-transform:uppercase;letter-spacing:.08em}
/* «Цікаве» — без вибору */
.fakt{background:var(--s-card);border:1px solid var(--s-ln);border-radius:var(--s-r-plytka);padding:1.4rem 1.4rem 1.2rem}
.fakt b{font:600 2rem var(--s-disp);text-transform:uppercase;display:block}
.fakt p{margin:.5rem 0 0;color:var(--s-body);font-size:1.05rem;line-height:1.4}
/* підказка клавіш */
.pidk{margin-top:.8rem;display:flex;gap:2rem;color:var(--s-mut);font-size:.8rem;flex:none}
.pidk kbd{font:700 .75rem var(--s-txt);color:var(--s-ink);background:var(--s-card2);border:1px solid var(--s-ln);border-radius:var(--s-r-mitka);padding:.1rem .45rem;margin-right:.35rem}
.porozh{color:var(--s-mut);font-size:1.1rem;padding:2rem 0}
/* вхід за кодом */
.kod{display:grid;grid-template-columns:1fr 24rem;gap:4rem;margin-top:1.6rem;flex:1;min-height:0}
.kod .pr p{color:var(--s-body);font-size:1.15rem;line-height:1.45;margin:0 0 1rem;max-width:30rem}
.kod .pr p.mal{color:var(--s-mut);font-size:.95rem}
.krapky{display:flex;gap:1rem;margin:1.2rem 0 .6rem;height:2rem;align-items:center}
.krapky i{width:1.3rem;height:1.3rem;border-radius:50%;border:2px solid var(--s-ln)}
.krapky i.on{background:var(--s-ink);border-color:var(--s-ink)}
.krapky.err i{border-color:var(--s-pomylka)}
#kp-msg{min-height:1.5rem;font-weight:700;color:var(--s-pomylka)}
.klav{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem;align-content:start}
.klav .k{background:var(--s-card2);border:1px solid var(--s-ln);border-radius:var(--s-r);height:4.2rem;display:grid;place-items:center;font:600 1.8rem var(--s-disp)}
.klav .k.sm{font:700 .95rem var(--s-txt);color:var(--s-body)}
.klav .k.ok{background:var(--s-vyh);border-color:var(--s-vyh);color:#fff;font:700 1.05rem var(--s-txt)}
.pam{display:flex;align-items:center;gap:.8rem;padding:.7rem 1rem;border-radius:var(--s-r);background:var(--s-card);border:1px solid var(--s-ln);font-weight:700;font-size:1rem;margin-top:.4rem;width:max-content}
.pam .b{width:1.5rem;height:1.5rem;border-radius:var(--s-r-mitka);border:2px solid var(--s-mut);display:grid;place-items:center;font-size:1rem;line-height:1}
.pam.on .b{background:var(--s-vyh);border-color:var(--s-vyh);color:#fff}
.pam small{display:block;font-weight:400;color:var(--s-mut);font-size:.78rem}
@keyframes tr{20%,60%{transform:translateX(-.5rem)}40%,80%{transform:translateX(.5rem)}}
.krapky.err{animation:tr .4s}
/* вікно поверх: пісня, підказка, вмілість, вибір версії */
#det{position:fixed;inset:0;z-index:5;background:rgba(10,11,13,.82);display:flex;align-items:center;justify-content:center}
#det[hidden]{display:none}
#det .vk{width:72rem;max-height:40rem;background:var(--s-bg);border:1px solid var(--s-ln);border-radius:var(--s-r-karta);padding:2.2rem 2.8rem 1.8rem;display:flex;flex-direction:column;position:relative;overflow:hidden}
#det .vk:before{content:"";position:absolute;left:0;right:0;top:0;height:.32rem;background:var(--c,var(--s-all4))}
#det h2{font:600 2.6rem/1.05 var(--s-disp);text-transform:uppercase;margin:.3rem 0 0}
#det .sub{color:var(--s-mut);font-size:1.05rem;margin:.4rem 0 0}
#det .tilo{flex:1;min-height:0;overflow:hidden;margin-top:1.2rem;position:relative}
#det .vrsh{columns:2;column-gap:3rem}
#det .vrsh p{font-size:1.45rem;line-height:1.45;white-space:pre-line;margin:0 0 1.1rem;break-inside:avoid}
#det .vrsh p.ch{font-style:italic;color:var(--s-body);padding-left:1.2rem;border-left:.2rem solid var(--s-ln)}
#det ol.kr{margin:0;padding-left:2.2rem;font-size:1.45rem;line-height:1.4}
#det ol.kr li{margin-bottom:.7rem}
#det .morse{font:600 2.4rem var(--s-disp);letter-spacing:.2em;margin:.2rem 0 1rem}
#det .por{color:var(--s-body);font-size:1.15rem;margin-top:1rem}
#det .dn{display:flex;gap:1rem;margin-top:1.2rem;flex:none;align-items:center}
#det .dn .gl{margin-left:auto;color:var(--s-mut);font-size:.85rem}
.bt{display:inline-flex;align-items:center;gap:.6rem;padding:.75rem 1.5rem;border-radius:var(--s-r);background:var(--s-card2);border:1px solid var(--s-ln);font-weight:700;font-size:1.05rem;color:var(--s-ink)}
.bt.main{background:var(--c2,var(--s-vyh));border-color:var(--c2,var(--s-vyh));color:#fff}
.skh{display:flex;gap:2rem;align-items:center}
.skh .ph{width:9rem;height:9rem;flex:none;display:grid;place-items:center;background:var(--s-card);border-radius:var(--s-r-plytka);border:1px solid var(--s-ln)}
.skh .ph img{max-width:85%;max-height:85%}
.rivni{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1rem}
.rivni span{padding:.4rem .9rem;border-radius:var(--s-r-pil);background:var(--s-card2);border:1px solid var(--s-ln);font-weight:700;font-size:.95rem;color:var(--s-body)}
.matb{margin-top:1.4rem;padding:1.1rem 1.3rem;border-radius:var(--s-r-plytka);background:var(--s-card);border:1px solid var(--s-ln)}
.matb b{font:600 1.2rem var(--s-disp);text-transform:uppercase;color:var(--s-upyu-t)}
.matb p{margin:.4rem 0 0;color:var(--s-body);font-size:1rem}
.vars{display:grid;grid-template-columns:repeat(2,1fr);gap:1.1rem;margin-top:1.2rem}
.vars .pl{min-height:8rem}
/* відкрите на весь екран */
#fr{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000;z-index:10}
#load{position:fixed;inset:0;z-index:20;background:var(--s-bg);display:flex;align-items:center;justify-content:center;font:600 2.4rem var(--s-disp);text-transform:uppercase;color:var(--s-mut)}
#load[hidden]{display:none}
#tst{position:fixed;z-index:40;left:50%;bottom:1.6rem;transform:translateX(-50%);padding:.6rem 1.3rem;border-radius:var(--s-r-pil);background:var(--s-card);border:1px solid var(--s-ln);color:var(--s-ink);font-weight:700;font-size:1.1rem;transition:opacity .4s}
#tst.off{opacity:0}
</style>
</head>
<body>
<div id="app"></div>
<div id="det" hidden><div class="vk" id="dvk"></div></div>
<div id="load" hidden>Відкриваємо…</div>

, але майже не рухається по небу."}], "songs": [{"t": "Ще не вмерла України", "a": "Державний гімн України · слова Павла Чубинського (1862)", "v": [["Ще не вмерла України і слава, і воля,\nЩе нам, браття молодії, усміхнеться доля.\nЗгинуть наші воріженьки, як роса на сонці,\nЗапануєм і ми, браття, у своїй сторонці."], ["Душу й тіло ми положим за нашу свободу,\nІ покажем, що ми, браття, козацького роду.", 1]]}, {"t": "Несе Галя воду", "a": "народна", "v": [["Несе Галя воду,\nКоромисло гнеться,\nЗа нею Іванко,\nЯк барвінок, в’ється."], ["— Галю ж моя, Галю,\nДай води напиться,\nТи така хороша —\nДай хоч подивиться!"], ["— Вода у криниці,\nПіди та й напийся,\nЯк буду в садочку —\nПрийди подивися."]]}, {"t": "Ой у лузі червона калина", "a": "стрілецька пісня"}, {"t": "Ой, чий то кінь стоїть", "a": "народна"}], "facts": [["СКОБ!", "Пластове привітання: Сильно, Красно, Обережно, Бистро."], ["1911–1912", "Пласт засновано у Львові. Засновники — Олександр Тисовський, Петро Франко та Іван Чмола."], ["Пластуни", "Назва «Пласт» — від пластунів, козаків-розвідників."], ["Будь готов!", "Пластове гасло."]], "mat": {"budova-litalnyh-aparativ-i": {"lvl": "І", "d": "Види літальних апаратів, частини літака, профіль крила, тангаж, крен і рискання, п’ять аеродинамічних схем.", "vyv": "/yunakam/budova-la-1/#vyvchy", "test": "/yunakam/budova-la-1/#test"}, "keramika-i": {"lvl": "І", "d": "Історія виробів з глини, техніки формотворення, шість видів кераміки, музей і три вироби власноруч.", "vyv": "/yunakam/keramika-1/#vyvchy", "test": "/yunakam/keramika-1/#test"}}, "art": {"budova-litalnyh-aparativ-i": "/proba/tv/img/budova-la-1.webp", "keramika-i": "/proba/tv/img/keramika-1.webp"}, "gut": [{"id": "budova-la-1", "t": "Будова літальних апаратів І", "sp": "Летунська · проба 1", "p": "Частини літака, профіль крила, 3D-літачок, гра з телефонів.", "art": "/proba/tv/img/budova-la-1.webp", "v": [["Гутірка", "/gutirky/budova-la-1/#hutirka", "40–45 хв", "Юнацтво, 12–17 років"]]}, {"id": "keramika-1"     if (t === 'gut') return '<div class="sitka">' + D.gut.map(g => plytka({ id: 'g-' + g.id, go: 'gut:' + g.id, c: C.yu[0], ct: C.yu[1], img: g.art, nad: g.sp, h: g.t, p: g.p, d: 'Показати ▶' })).join('') + '</div>';
    if (t === 'vih') {
      const got = D.got.map(g => plytka({ id: 'got-' + g.id, go: 'got:' + g.id, c: C.ig[0], ct: C.ig[1], ik: D.ic[g.gra] || '', nad: (D.igName[g.gra] || 'Гра') + ' · ' + g.dzh, h: g.nazva, p: g.opys, d: 'Грати ▶' }));
      const enc = IG ? IG.map((g, i) => plytka({ id: 'ig-' + g.id, go: 'ig:' + i, c: C.vy[0], ct: C.vy[1], ik: D.ic[g.gra] || '', nad: (D.igName[g.gra] || 'Гра') + ' · для гуртка', h: g.nazva, p: [g.opys, g.vik].filter(Boolean).join(' · '), d: 'Грати ▶' })) : [];
      return '<div class="sitka">' + enc.concat(got).join('') + '</div>';
    }
    if (t === 'tools') return '<div class="sitka">' + D.tools.map(x => plytka({ id: 't-' + x.id, go: 'tool:' + x.id, c: C.vy[0], ct: C.vy[1], ik: x.ic, nad: 'Інструмент', h: x.n, p: x.s, d: 'Відкрити →' })).join('') + '</div>';
    return '';
  }

  function malHome() {
    return `<img class="wm" src="${WM}" alt=""><div class="verh"><img class="logo" src="${LOGO}" alt="Пласт">${TEL}</div>
    <div style="margin-top:1.6rem"><div class="nad">Пласт у Фінляндії</div><h1>Пластова<br>бібліотека</h1><div class="lin"></div><div class="ruka">гутірки, ігри, пісні й підказки</div></div>
    <div class="dveri">
      <div class="dv vs f" data-id="d-vsi" data-go="scr:vsi"><h3>Для всіх</h3><p>Ігри, співаник, швидкі підказки</p><div class="d">Відкрити →</div></div>
      <div class="dv yu f" data-id="d-yun" data-go="scr:yun"><h3>Юнацтво</h3><p>УПЮ · 12–17 років · вмілості</p><div class="d">Відкрити →</div></div>
      <div class="dv vy f" data-id="d-vyh" data-go="scr:vyh"><h3>Виховники</h3><p>Гутірки на весь екран, ігри гуртка</p><div class="d">${vKod() ? 'Відкрити →' : 'Вхід за кодом ' + ICS.lock}</div></div>
      <div class="dv nv zg"><h3>Новацтво</h3><p>УПН · 6–11 років</p><div class="d">Згодом</div></div>
    </div>${PIDK}`;
  }
  function malRozdil(scr) {
    const e = EKR[scr], t = TAB[scr] || e.tabs[0][0];
    const n = { gut: D.gut.length, vih: D.got.length + (IG ? IG.length : 0), vm: SKILLS.length };
    return `<div class="verh"><div><div class="nad">${esc(e.nad)}</div><h1 class="m">${esc(e.h)}</h1><div class="lin" style="--c:${e.c}"></div></div>${TEL}</div>
    <div class="vkl">${e.tabs.map(([k, l]) => `<div class="t f${k === t ? ' on' : ''}" data-id="tab-${k}" data-tab="${k}">${esc(l)}${n[k] ? `<span class="n">${n[k]}</span>` : ''}</div>`).join('')}${scr === 'vyh' ? '<div class="t f zakr" data-id="zakr" data-go="zakr">' + ICS.lock + ' Закрити розділ</div>' : ''}</div>
    <div class="zona" id="zona">${zmist(scr, t) || '<p class="porozh">Тут поки порожньо.</p>'}</div>${PIDK}`;
  }
  let KP = '', PAM = true;
  function malKod() {
    return `<div class="verh"><div><div class="nad">Пластова бібліотека · Виховники</div><h1 class="m">Вхід за кодом</h1><div class="lin" style="--c:var(--s-vyh)"></div></div>${TEL}</div>
    <div class="kod"><div class="pr">
      <p>Введіть код виховників пультом. На екрані — лише крапки.</p>
      <p class="mal">Найкраще — <b>поки юнаків немає</b> (з «Пам'ятати до кінця дня» на сходинах розділ відкриється без коду). Або скануйте QR телефоном: тоді код вводиться на телефоні.</p>
      <div class="krapky" id="kr">${'<i></i>'.repeat(Math.max(4, CODE.length))}</div><div id="kp-msg"></div>
      <div class="pam f${PAM ? ' on' : ''}" data-id="pam" data-go="pam"><span class="b">${PAM ? '✓' : ''}</span><span>Пам'ятати до кінця дня<small>опівночі розділ знову закриється</small></span></div>
    </div>
    <div class="klav">${['1', '2', '3', '4', '5', '6', '7', '8', '9'].map(d => `<div class="k f" data-id="k${d}" data-go="kd:${d}">${d}</div>`).join('')}
      <div class="k sm f" data-id="kx" data-go="kx">⌫ Стерти</div><div class="k f" data-id="k0" data-go="kd:0">0</div><div class="k ok f" data-id="kok" data-go="kok">Увійти</div></div></div>${PIDK}`;
  }
  function krapky(err) {
    const k = $('#kr'); if (!k) return;
    [...k.children].forEach((i, n) => i.classList.toggle('on', n < KP.length));
    k.classList.remove('err'); if (err) { void k.offsetWidth; k.classList.add('err'); }
    $('#kp-msg').textContent = err ? 'Код не підходить. Спробуйте ще раз.' : '';
  }

  function malyuvaty(fokId) {
    const a = $('#app');
    a.innerHTML = SCR === 'home' ? malHome() : SCR === 'kod' ? malKod() : malRozdil(SCR);
    if (SCR === 'kod') krapky();
    const want = fokId || FOK[SCR];
    const el = (want && a.querySelector(`.f[data-id="${CSS.escape(want)}"]`)) || a.querySelector(SCR === 'home' ? '.dv.f' : SCR === 'kod' ? '[data-id="k1"]' : '.vkl .t.on') || a.querySelector('.f');
    fokus(el);
  }

  /* ---------------- рамка пульта ---------------- */
  let CUR = null;
  function fokus(el) {
    if (!el) return;
    document.querySelectorAll('.fok').forEach(e => e.classList.remove('fok'));
    CUR = el; el.classList.add('fok');
    if (!$('#det').hidden) return;
    FOK[SCR] = el.dataset.id;
    const z = el.closest('.zona');
    if (z) { const r = el.getBoundingClientRect(), zr = z.getBoundingClientRect(), pad = zr.height * 0.04;
      if (r.bottom > zr.bottom - pad) z.scrollTop += r.bottom - zr.bottom + pad * 2; else if (r.top < zr.top + pad) z.scrollTop -= zr.top - r.top + pad * 2;
      if (el.closest('.sitka') && z.querySelector('.sitka .f') === el) z.scrollTop = 0; }
  }
  function ruh(dir) {
    const root = $('#det').hidden ? $('#app') : $('#dvk');
    const els = [...root.querySelectorAll('.f')];
    if (!CUR || !CUR.isConnected || !els.includes(CUR)) { fokus(els[0]); return; }
    const c = CUR.getBoundingClientRect(), cx = c.left + c.width / 2, cy = c.top + c.height / 2;
    let best = null, bs = Infinity;
    for (const e of els) {
      if (e === CUR) continue;
      const r = e.getBoundingClientRect(), ex = r.left + r.width / 2, ey = r.top + r.height / 2;
      let p, o;   // p — відстань у напрямку, o — збоку
      if (dir === 'r') { p = r.left - c.right; o = Math.abs(ey - cy); if (ex <= cx + 2) continue; }
      else if (dir === 'l') { p = c.left - r.right; o = Math.abs(ey - cy); if (ex >= cx - 2) continue; }
      else if (dir === 'd') { p = r.top - c.bottom; o = Math.abs(ex - cx); if (ey <= cy + 2) continue; }
      else { p = c.top - r.bottom; o = Math.abs(ex - cx); if (ey >= cy - 2) continue; }
      const s = Math.max(p, 0) + o * 2 + (p < -4 ? 400 : 0);
      if (s < bs) { bs = s; best = e; }
    }
    if (best) { fokus(best); if (best.dataset.tab && $('#det').hidden) vkladka(best.dataset.tab); }
  }
  function vkladka(t) {
    if (TAB[SCR] === t && $('#zona').dataset.t === t) return;
    TAB[SCR] = t;
    document.querySelectorAll('.vkl .t[data-tab]').forEach(e => e.classList.toggle('on', e.dataset.tab === t));
    const z = $('#zona'); z.dataset.t = t; z.scrollTop = 0;
    z.innerHTML = zmist(SCR, t) || '<p class="porozh">Тут поки порожньо.</p>';
    if (t === 'vih' && !IG && vKod()) igOpen(vKod()).then(g => { IG = g; if (SCR === 'vyh' && TAB.vyh === 'vih') { $('#zona').dataset.t = ''; vkladka('vih'); } }).catch(() => { IG = []; });
  }

  /* ---------------- дії ---------------- */
  function idy(scr) { stack.push({ scr: SCR }); SCR = scr; malyuvaty(); if (scr === 'vyh') pidgotIhry(); }
  function pidgotIhry() { if (IG || !vKod()) return; igOpen(vKod()).then(g => { IG = g; if (SCR === 'vyh' && !OPEN && $('#det').hidden) malyuvaty(); }).catch(() => { IG = []; }); }
  function dija(go) {
    const [k, a, b] = go.split(':');
    if (k === 'scr') { if (a === 'vyh' && !vKod()) { KP = ''; idy('kod'); } else idy(a); return; }
    if (k === 'tel') { vidkryty({ u: '/proba/proektor/', k: 'tel', n: 'Телефон — пульт' }); return; }
    if (k === 'zakr') { zakrytyV(); stack.length = 0; SCR = 'home'; malyuvaty('d-vyh'); toast(ICS.lock + ' Розділ «Виховники» закрито'); return; }
    if (k === 'pam') { PAM = !PAM; malyuvaty('pam'); return; }
    if (k === 'kd') { if (KP.length < 12) KP += a; krapky(); return; }
    if (k === 'kx') { KP = KP.slice(0, -1); krapky(); return; }
    if (k === 'kok') {
      if (KP === CODE) { uviyty(PAM); KP = ''; SCR = 'vyh'; TAB.vyh = TAB.vyh || 'gut'; malyuvaty(); pidgotIhry(); toast('Розділ «Виховники» відкрито' + (PAM ? ' до кінця дня' : '')); }
      else { KP = ''; krapky(true); }
      return;
    }
    if (k === 'ihra') { const g = IHRY_VSI.find(x => x.id === a); vidkryty({ u: g.u, k: 'ihry', n: g.n }); return; }
    if (k === 'tool') { const x = D.tools.find(t => t.id === a); vidkryty({ u: x.u, k: 'ihry', n: x.n }); return; }
    if (k === 'got') { const g = D.got.find(x => x.id === a); vidkryty({ u: g.u, k: 'ihry', n: g.nazva }); return; }
    if (k === 'ig') { const g = IG[+a]; try { localStorage.setItem('ihry.vidkryty', JSON.stringify({ nazva: g.nazva, c: g.c, druk: false, t: Date.now() })); } catch (e) { toast('Не вдалося передати питання грі'); return; }
      vidkryty({ u: D.igUrl[g.gra] || '/proba/svoya-hra/?dyz=3', k: 'ihry', n: g.nazva }); return; }
    if (k === 'gut') { const g = D.gut.find(x => x.id === a); if (g.v.length > 1) vikno('vibir', g); else vidkryty({ u: g.v[0][1], k: 'gut', n: g.t }); return; }
    if (k === 'var') { vidkryty({ u: decodeURIComponent(a), k: 'gut', n: decodeURIComponent(b || '') }); return; }
    if (k === 'yunv') { const s = byId[a]; vidkryty({ u: s.mat[b], k: 'yun', n: s.n }); return; }
    if (k === 'tip') { vikno('tip', TIPS[+a]); return; }
    if (k === 'song') { vikno('song', SONGS[+a]); return; }
    if (k === 'vm') { vikno('vm', byId[a]); return; }
    if (k === 'zakrDet') { zakrytyVikno(); return; }
  }

  /* ---------------- вікно поверх ---------------- */
  let DET = null;
  function vikno(typ, x) {
    const v = $('#dvk'); let h = '', c = 'var(--s-all4)';
    const zakr = '<div class="bt f" data-id="dz" data-go="zakrDet">← Назад</div>';
    if (typ === 'song') {
      h = `<div class="nad">Співаник</div><h2>${esc(x.t)}</h2><p class="sub">${esc(x.a)}</p>
        <div class="tilo" id="dtilo"><div class="vrsh">${x.v.map(([t, ch]) => `<p class="${ch ? 'ch' : ''}">${esc(t)}</p>`).join('')}</div></div>
        <div class="dn">${zakr}<span class="gl">▲ ▼ — гортати текст</span></div>`;
    } else if (typ === 'tip') {
      h = `<div class="nad">Швидка підказка</div><h2>${esc(x.t)}</h2><p class="sub">${esc(x.s)}</p>
        <div class="tilo" id="dtilo">${x.morse ? `<div class="morse">${esc(x.morse)}</div>` : ''}<ol class="kr">${x.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol>${x.tip ? `<p class="por"><b>Порада.</b> ${esc(x.tip)}</p>` : ''}</div>
        <div class="dn">${zakr}<span class="gl">▲ ▼ — гортати</span></div>`;
    } else if (typ === 'vm') {
      c = 'var(--s-upyu)';
      h = `<div class="skh"><div class="ph">${x.img ? `<img src="${esc(x.img)}" alt="">` : ''}</div><div><div class="nad">Вмілість · ${esc(x.specs.join(', '))}</div><h2>${esc(x.n)}</h2>
        <div class="rivni">${x.lv.map(l => `<span>${esc(l === 'Опис' ? 'Один рівень' : l.replace(/^Опис\s*/, ''))}</span>`).join('')}</div></div></div>
        ${x.mat ? `<div class="matb"><b>Є матеріали — ${esc(x.n)} ${esc(x.mat.lvl)}</b><p>${esc(x.mat.d)}</p></div>` : '<div class="tilo"><p class="sub">Матеріалів до цієї вмілості на сайті ще немає. Вимоги — на порталі вмілостей Пласту.</p></div>'}
        <div class="dn" style="--c2:var(--s-upyu)">${x.mat ? `<div class="bt main f" data-id="dv1" data-go="yunv:${esc(x.id)}:vyv">Вивчай сам</div><div class="bt f" data-id="dv2" data-go="yunv:${esc(x.id)}:test">Перевір себе</div>` : ''}${zakr}</div>`;
    } else if (typ === 'vibir') {
      c = 'var(--s-upyu)';
      h = `<div class="nad">${esc(x.sp)}</div><h2>${esc(x.t)}</h2><p class="sub">Яку версію показати?</p>
        <div class="vars">${x.v.map(([l, u, d, w], i) => plytka({ id: 'var' + i, go: 'var:' + encodeURIComponent(u) + ':' + encodeURIComponent(x.t + ' · ' + l), c: C.yu[0], ct: C.yu[1], nad: w, h: l, p: d, d: 'Показати ▶' })).join('')}</div>
        <div class="dn">${zakr}</div>`;
    }
    v.style.setProperty('--c', c); v.innerHTML = h;
    DET = { typ, from: CUR && CUR.dataset.id };
    $('#det').hidden = false;
    fokus(v.querySelector(typ === 'vm' && x.mat ? '[data-id="dv1"]' : typ === 'vibir' ? '[data-id="var0"]' : '[data-id="dz"]'));
  }
  function zakrytyVikno() {
    $('#det').hidden = true; const f = DET && DET.from; DET = null;
    const el = f && $('#app').querySelector(`.f[data-id="${CSS.escape(f)}"]`); fokus(el || $('#app').querySelector('.f'));
  }
  function gortVikno(n) { const t = $('#dtilo'); if (!t) return false; if (t.scrollHeight <= t.clientHeight + 2) return false; t.scrollBy({ top: n * t.clientHeight * 0.5, behavior: 'smooth' }); return true; }

  /* ---------------- відкрите на весь екран ---------------- */
  let OPEN = null, FR = null;
  function vidkryty(it) {
    if (!$('#det').hidden) { $('#det').hidden = true; DET = null; }
    OPEN = it; $('#load').hidden = false;
    if (FR) FR.remove();
    FR = document.createElement('iframe'); FR.id = 'fr'; FR.title = it.n || 'Відкрите на проєкторі'; FR.allow = 'autoplay; fullscreen; wake-lock';
    document.body.appendChild(FR);
    FR.addEventListener('load', naZavantazh);
    FR.contentWindow.location.replace(it.u);
  }
  function naZavantazh() {
    if (!OPEN || !FR) return;
    let w; try { w = FR.contentWindow; if (w.location.href === 'about:blank') return; } catch (e) { $('#load').hidden = true; return; }
    $('#load').hidden = true;
    try {
      w.focus();
      /* сторінки без власного шару пульта (матеріали юнаків, інструменти) — рамка й стрілки; у гутірках свої клавіші */
      if (OPEN.k !== 'gut' && OPEN.k !== 'tel') setTimeout(() => { try { if (!w.__plastTV) { const d = w.document; w.TV_GRA = 1;
        const l = d.createElement('link'); l.rel = 'stylesheet'; l.href = '/proba/tv/tv.css'; d.head.appendChild(l);
        const s = d.createElement('script'); s.src = '/proba/tv/tv-all.js'; d.head.appendChild(s); } } catch (e) { /* ok */ } }, 600);
      w.addEventListener('keydown', e => { if (e.key === 'GoBack' || e.key === 'BrowserBack') { e.preventDefault(); e.stopImmediatePropagation(); zakryty(); } }, true);
    } catch (e) { /* ok */ }
  }
  function zakryty() {
    OPEN = null; if (FR) { FR.remove(); FR = null; } $('#load').hidden = true;
    window.focus(); malyuvaty();
  }

  /* ---------------- «Назад» ---------------- */
  function nazad() {
    if (OPEN) { zakryty(); return; }
    if (!$('#det').hidden) { zakrytyVikno(); return; }
    if (SCR === 'home') return;
    const p = stack.pop(); SCR = p ? p.scr : 'home'; if (SCR === 'kod') SCR = 'home';
    malyuvaty();
  }
  /* апаратна «Назад» на Android може гортати історію — тримаємо один запасний запис */
  try { history.pushState({ pt: 1 }, ''); } catch (e) { /* ok */ }
  window.addEventListener('popstate', () => { nazad(); try { history.pushState({ pt: 1 }, ''); } catch (e) { /* ok */ } });

  /* ---------------- клавіші пульта ---------------- */
  document.addEventListener('keydown', e => {
    if (OPEN) return;
    const k = e.key; let ok = true;
    document.body.classList.add('pult');
    if (k === 'ArrowRight') ruh('r');
    else if (k === 'ArrowLeft') ruh('l');
    else if (k === 'ArrowDown') { if (!$('#det').hidden && gortVikno(1)) { /* гортаємо текст */ } else ruh('d'); }
    else if (k === 'ArrowUp') { if (!$('#det').hidden && gortVikno(-1)) { /* гортаємо текст */ } else ruh('u'); }
    else if (k === 'Enter' || k === ' ' || k === 'OK' || k === 'Select') { if (CUR && CUR.isConnected) { if (CUR.dataset.tab) vkladka(CUR.dataset.tab); else if (CUR.dataset.go) dija(CUR.dataset.go); } }
    else if (k === 'GoBack' || k === 'BrowserBack' || k === 'Escape' || k === 'Backspace') { if (SCR === 'kod' && k === 'Backspace' && KP) dija('kx'); else nazad(); }
    else if (SCR === 'kod' && /^[0-9]$/.test(k)) dija('kd:' + k);
    else ok = false;
    if (ok) e.preventDefault();
  });
  /* мишка (ноутбук) — теж працює */
  document.addEventListener('mousemove', () => document.body.classList.remove('pult'));
  document.addEventListener('click', e => {
    const f = e.target.closest('.f'); if (f) { fokus(f); if (f.dataset.tab) vkladka(f.dataset.tab); else if (f.dataset.go) dija(f.dataset.go); return; }
    if (e.target === $('#det')) zakrytyVikno();
  });

  let tT = 0;
  function toast(t) { const e = $('#tst'); e.textContent = t; e.classList.remove('off'); clearTimeout(tT); tT = setTimeout(() => e.classList.add('off'), 3000); }

  /* ---------------- підготовлені ігри виховників (зашифровані кодом) ---------------- */
  let IG = null;
  const ub = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function igOpen(kod) {
    const H = D.ihryEnc; if (!H.ihry.length) return [];
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(kod), 'PBKDF2', false, ['deriveKey']);
    const k = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: ub(H.salt), iterations: H.it, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    return Promise.all(H.ihry.map(async e => JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: ub(e.iv) }, k, ub(e.ct))))));
  }

  malyuvaty();
  window.focus();
})();
</script>
