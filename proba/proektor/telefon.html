<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b1d21">
<title>Проєктор · керування</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Oswald:wght@500;600&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* ═══ СТАНДАРТ СТИЛЮ — кольори, шрифти, заокруглення, висота кнопок. Спільний для всіх сторінок. ═══ */
:root{
  /* основа — темний екран */
  --s-bg:#1b1d21; --s-card:#22262b; --s-card2:#2a2f35; --s-pole:#14171a; --s-ln:#383d44;
  --s-ink:#f2f4f6; --s-body:#cfd5dc; --s-mut:#a0a8b2;
  /* улади: колір показує, для кого сторінка; «-t» — світліший, для тексту на темному; «-on» — текст на кнопці цього кольору */
  --s-upn:#ffd23f; --s-upn-on:#1d1606;
  --s-upyu:#c8284a; --s-upyu-t:#ff7d99; --s-upyu-on:#ffffff;
  --s-vyh:#3daf6e; --s-vyh-t:#62cf93; --s-vyh-on:#0e1f15;
  --s-ups:#b0773a;
  --s-all:#c9cfd6;
  --s-all4:linear-gradient(90deg,var(--s-upn) 0 25%,var(--s-upyu) 0 50%,var(--s-vyh) 0 75%,var(--s-ups) 0);
  /* службові */
  --s-ihry:#ffc247; --s-ihry-on:#1d1606;
  --s-hand:#2fd2c0; --s-ol:#9fb57a;
  --s-ok:#62cf93; --s-uvaga:#f0c060; --s-pomylka:#ff6a6a;
  /* папір (бланки, звіти, PDF) */
  --s-p-bg:#ffffff; --s-p-ink:#1d2125; --s-p-mut:#5f6873; --s-p-ln:#cfd5dc; --s-p-ac:#c8284a; --s-p-th:#f9e6ea;
  /* шрифти */
  --s-disp:Oswald,'Arial Narrow',sans-serif; --s-txt:'Source Sans 3',system-ui,sans-serif; --s-ruka:Caveat,'Segoe Print',cursive;
  /* заокруглення: кнопка й поле 12, плитка 18, велика картка й вікно 20, пігулка кругла; дрібні деталі: мітка 6, смужка 3 */
  --s-r:12px; --s-r-plytka:18px; --s-r-karta:20px; --s-r-pil:99px; --s-r-mitka:6px; --s-r-smuzhka:3px;
  /* висота: звичайна кнопка й поле 50, головна кнопка гри 54 */
  --s-h:50px; --s-h-hra:54px;
}
/* ═══ КНОПКИ — одна реакція на всіх сторінках ═══
   навели: рамка кольором розділу (головна кнопка — біла рамка) · натиснули: темнішає й опускається ·
   клавіатура або пульт: біла обвідка · недоступна: бліда · «видалити»: не залита, червоний напис */
:root :is(button,a,summary,[role=button],[tabindex]):focus-visible{outline:3px solid var(--s-ink);outline-offset:2px}
:root .btn:where(:not(.main,.ok,[disabled])):hover{border-color:var(--ak,var(--d-t,var(--gd,var(--ab,var(--a,var(--s-ink))))));box-shadow:0 0 0 1px var(--ak,var(--d-t,var(--gd,var(--ab,var(--a,var(--s-ink))))))}
:root .btn:is(.main,.ok):where(:not([disabled])):hover{border-color:var(--s-ink);box-shadow:0 0 0 1px var(--s-ink)}
:root .btn:where(:not([disabled])):active{transform:translateY(2px);filter:brightness(.88)}
:root .btn[disabled]{opacity:.45;cursor:not-allowed}
:root .btn.neb,:root .btn.warn{background:var(--s-card2);border-color:var(--s-ln);color:var(--s-pomylka)}
:root .btn:is(.neb,.warn):where(:not([disabled])):hover,:root .btn.warn.sure{border-color:var(--s-pomylka);box-shadow:0 0 0 1px var(--s-pomylka)}
:root .btn.warn.sure{background:rgba(255,106,106,.14)}
/* ═══ кінець стандарту ═══ */

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--s-bg);color:var(--s-ink);font:400 17px/1.35 var(--s-txt);-webkit-tap-highlight-color:transparent;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
.top{display:flex;align-items:center;gap:8px;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));flex:none;position:relative}
.top::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--s-all4)}
.top img{height:34px;margin-right:auto}
.pil{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:var(--s-r-pil);border:1px solid var(--s-ln);background:var(--s-card);font-weight:700;font-size:14px;color:var(--s-mut);white-space:nowrap}
.pil i{width:8px;height:8px;border-radius:50%;background:var(--s-uvaga)}
.pil.ok{color:var(--s-ok)}.pil.ok i{background:var(--s-ok)}
button.pil{color:var(--s-body)}
button.pil.on{background:var(--s-ink);color:var(--s-bg);border-color:var(--s-ink)}
main{flex:1;overflow:auto;padding:18px 16px 28px}
.c{background:var(--s-card);border:1px solid var(--s-ln);border-top:4px solid var(--s-vyh);border-radius:var(--s-r-karta);padding:22px 18px;max-width:440px;margin:6px auto}
.c h1{font:600 26px/1.1 var(--s-disp);text-transform:uppercase;margin:0 0 8px}
.c p{color:var(--s-body);margin:0 0 6px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:var(--s-h);border-radius:var(--s-r);border:1px solid var(--s-ln);background:var(--s-card2);font-weight:700;font-size:17px;margin-top:12px}
.btn.main{background:var(--s-vyh);border-color:var(--s-vyh);color:var(--s-vyh-on)}
input{width:100%;margin-top:14px;height:60px;border-radius:var(--s-r);border:1px solid var(--s-ln);background:var(--s-pole);color:var(--s-ink);font:600 28px var(--s-disp);letter-spacing:.3em;text-align:center}
input:focus{outline:none;border-color:var(--s-vyh);box-shadow:0 0 0 1px var(--s-vyh)}
.err{color:var(--s-pomylka);font-weight:700;margin-top:10px}
.k{font-size:13px;font-weight:600;letter-spacing:.25em;text-transform:uppercase;color:var(--s-vyh-t)}
h2{font:600 30px/1 var(--s-disp);text-transform:uppercase;margin:6px 0 4px}
.ruka{font:600 22px var(--s-ruka);color:var(--s-hand);margin-bottom:16px}
.tabs{display:flex;gap:4px;padding:4px;border-radius:var(--s-r-pil);background:var(--s-pole);border:1px solid var(--s-ln);margin-bottom:16px;position:sticky;top:-18px;z-index:2}
.tabs button{flex:1;height:42px;border-radius:var(--s-r-pil);background:transparent;border:0;font-weight:700;font-size:15px;color:var(--s-mut)}
.tabs button[aria-pressed=true]{background:var(--s-vyh);color:var(--s-vyh-on)}
.it{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--s-card);border:1px solid var(--s-ln);border-radius:var(--s-r-plytka);padding:12px;margin-bottom:10px;position:relative;overflow:hidden}
.it::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.it .im{width:64px;height:64px;border-radius:var(--s-r);flex:0 0 64px;background-color:var(--s-card2);display:flex;align-items:center;justify-content:center;font-size:30px;background-size:cover;background-position:center}
.it .tx{flex:1;min-width:0}.it b{display:block;font-size:17px;line-height:1.2}.it small{display:block;color:var(--s-mut);font-size:14px;margin-top:2px}
.it .go{flex:none;width:44px;height:44px;border-radius:50%;background:var(--s-vyh);color:var(--s-vyh-on);display:flex;align-items:center;justify-content:center}
.it .go svg{width:20px;height:20px}
.it.cur{border-color:var(--s-vyh)}
.it.cur small{color:var(--s-ok);font-weight:700}
.it:active{transform:translateY(2px);filter:brightness(.9)}
.out{display:block;margin:22px auto 0;background:none;border:0;color:var(--s-mut);text-decoration:underline;font-size:15px}
#ctl{flex:1;display:flex;flex-direction:column;min-height:0}
#ctl .bar{display:flex;align-items:center;gap:6px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));background:var(--s-card);border-bottom:1px solid var(--s-ln);flex:none}
#ctl .bar b{flex:1;min-width:0;font:600 17px var(--s-disp);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
#pf{flex:1;width:100%;border:0;background:var(--s-bg)}
.seg{flex:none;display:flex;gap:4px;margin:10px 12px 0;padding:4px;border-radius:var(--s-r-pil);background:var(--s-pole);border:1px solid var(--s-ln)}
.seg button{flex:1;height:40px;border:0;border-radius:var(--s-r-pil);background:transparent;font-weight:700;font-size:15px;color:var(--s-mut)}
.seg button[aria-pressed=true]{background:var(--s-vyh);color:var(--s-vyh-on)}
.ekr{flex:1;overflow:auto;padding:14px 12px 20px}
.eh{font-size:13px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--s-mut);margin:0 4px 10px}
.eh.ov{color:var(--s-uvaga)}
.eg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.eg .pr{grid-column:1/-1;color:var(--s-mut);text-align:center}
.eb{min-height:var(--s-h);border-radius:var(--s-r);background:var(--s-card);border:1px solid var(--s-ln);padding:10px 12px;text-align:left;font-weight:700;font-size:16px;line-height:1.2}
.eb.w{grid-column:1/-1}
.eb small{display:block;font-weight:400;font-size:13px;color:var(--s-mut);margin-top:2px}
.eb.on{border-color:var(--s-vyh);box-shadow:0 0 0 1px var(--s-vyh);background:rgba(61,175,110,.12)}
.eb.on::before{content:'✓ ';color:var(--s-ok)}
.eb.gol{background:var(--s-vyh);border-color:var(--s-vyh);color:var(--s-vyh-on)}.eb.gol small{color:var(--s-vyh-on);opacity:.8}
.eb.txt{border-style:dashed}
.eb:active{transform:translateY(2px);filter:brightness(.88)}
.sc{flex:none;display:flex;gap:8px;padding:8px 12px;padding-bottom:max(8px,env(safe-area-inset-bottom));background:var(--s-card);border-top:1px solid var(--s-ln)}
.sc button{flex:1;height:46px;border-radius:var(--s-r);background:var(--s-card2);border:1px solid var(--s-ln);font-weight:700;font-size:15px}
</style>
</head>

<script>window.KATALOG = {"gut": [{"id": "g-budova-la-1", "k": "gut", "n": "Будова літальних апаратів І", "s": "презентація з пультом", "u": "/gutirky/budova-la-1/#hutirka", "p": 1, "i": "📖", "c": "#b0673d", "img": "/proba/tv/img/budova-la-1.webp"}, {"id": "g-keramika-1", "k": "gut", "n": "Кераміка І", "s": "презентація з пультом", "u": "/gutirky/keramika-1/#hutirka", "p": 1, "i": "📖", "c": "#3d6fb0", "img": "/proba/tv/img/keramika-1.webp"}], "ihry": [{"id": "skob-hra", "n": "Потужний СКОБ!", "s": "вікторина з телефонів юнаків", "p": 1, "i": "⚡", "c": "#d6463c", "k": "ihry", "u": "/proba/skob-hra/?dyz=3"}, {"id": "svoya-hra", "n": "Змаг", "s": "команди, теми, бали", "p": 0, "i": "🏆", "c": "#c4a032", "k": "ihry", "u": "/proba/svoya-hra/?dyz=3"}, {"id": "bingo", "n": "Бінго", "s": "картки на телефонах", "p": 1, "i": "🎱", "c": "#3d6fb0", "k": "ihry", "u": "/proba/bingo/?dyz=3"}, {"id": "opytuvannia", "n": "Швидке опитування", "s": "голосування з телефонів", "p": 1, "i": "📊", "c": "#3daf6e", "k": "ihry", "u": "/proba/opytuvannia/?dyz=3"}, {"id": "novyi-vykhovnyk", "n": "Вгадай, хто?", "s": "знайомство: факти про себе", "p": 0, "i": "🕵️", "c": "#8a4fb0", "k": "ihry", "u": "/proba/novyi-vykhovnyk/?dyz=3"}, {"id": "hto", "n": "Жеребкування", "s": "хто наступний, групи й пари", "p": 0, "i": "🎲", "c": "#5a6470", "k": "ihry", "u": "/proba/hto/?dyz=3"}], "inshe": [{"id": "vsi", "k": "inshe", "n": "Співаник і підказки", "s": "пісні, вузли, Морзе, орієнтування", "u": "/?tv=0#vsi", "p": 0, "tv": 1, "i": "🔥", "c": "#d98a2b"}, {"id": "yun", "k": "inshe", "n": "Юнацтво", "s": "вмілості, «Вивчай сам», «Перевір себе»", "u": "/?tv=0#yun", "p": 0, "tv": 1, "i": "🎯", "c": "#d6467e"}]};</script>
<script>/* Звʼязок пульта з гутіркою — з запасними каналами (з 22.10.2026).
   window.GutirkaNet(PeerJS) → клас, схожий на Peer з PeerJS (той самий API для pult-host-file.js і сторінки пульта),
   але працює одразу двома шляхами:
     1) PeerJS (безкоштовний сервер 0.peerjs.com) — як і раніше;
     2) запасний: кілька публічних MQTT-брокерів через WebSocket (повідомлення йдуть через усі, повтори відкидаються).
   Пульт підключається тим шляхом, що відповів першим. Якщо PeerJS-сервер «лежить» — працює запасний, і навпаки.
   Запасні повідомлення зашифровані (AES-GCM, ключ — з коду й ключа з QR), адреса гутірки — хеш коду.
   Брокери можна замінити: window.GUTIRKA_MQTT = ['wss://…', …] (перед завантаженням). */
(function () {
  'use strict';
  if (window.GutirkaNet) return;
  const BROKERS = () => window.GUTIRKA_MQTT || ['wss://broker.emqx.io:8084/mqtt', 'wss://broker.hivemq.com:8884/mqtt', 'wss://test.mosquitto.org:8081/mqtt'];
  const NS = 'gutirky-fi/v1/';
  const rnd = n => { const a = new Uint8Array(n); crypto.getRandomValues(a); return [...a].map(b => (b % 36).toString(36)).join(''); };
  class Em {
    constructor() { this._h = {}; }
    on(e, f) { (this._h[e] = this._h[e] || []).push(f); return this; }
    off(e, f) { this._h[e] = (this._h[e] || []).filter(x => x !== f); return this; }
    emit(e, ...a) { (this._h[e] || []).slice().forEach(f => { try { f(...a); } catch (x) { console.error(x); } }); }
  }

  /* ---------------- найпростіший клієнт MQTT 3.1.1 через WebSocket (QoS 0) ---------------- */
  const te = new TextEncoder(), td = new TextDecoder();
  const str = s => { const b = te.encode(s); return [b.length >> 8, b.length & 255, ...b]; };
  const len = n => { const o = []; do { let d = n % 128; n = Math.floor(n / 128); if (n > 0) d |= 128; o.push(d); } while (n > 0); return o; };
  const pkt = (h, body) => { const b = body instanceof Uint8Array ? body : Uint8Array.from(body); const L = len(b.length); const o = new Uint8Array(1 + L.length + b.length); o[0] = h; o.set(L, 1); o.set(b, 1 + L.length); return o; };
  class Mqtt extends Em {
    constructor(url) { super(); this.url = url; this.subs = new Set(); this.ok = false; this.dead = false; this.tries = 0; this.buf = new Uint8Array(0); this.open(); }
    open() {
      if (this.dead) return;
      let ws; try { ws = new WebSocket(this.url, ['mqtt']); } catch (e) { return this.retry(); }
      this.ws = ws; ws.binaryType = 'arraybuffer';
      const to = setTimeout(() => { if (!this.ok) try { ws.close(); } catch (e) { /* ok */ } }, 8000);
      ws.onopen = () => {
        const id = 'gf' + rnd(12);
        ws.send(pkt(0x10, [...str('MQTT'), 4, 2, 0, 45, ...str(id)]));   // CONNECT, clean session, keepalive 45 с
      };
      ws.onmessage = ev => { const d = new Uint8Array(ev.data); const b = new Uint8Array(this.buf.length + d.length); b.set(this.buf); b.set(d, this.buf.length); this.buf = b; this.parse(); };
      ws.onclose = ws.onerror = () => { clearTimeout(to); clearInterval(this.ping); const was = this.ok; this.ok = false; if (this.ws === ws) { this.ws = null; if (was) this.emit('down'); this.retry(); } };
    }
    retry() { if (this.dead) return; this.tries++; clearTimeout(this.rt); this.rt = setTimeout(() => this.open(), Math.min(20000, 1000 * 2 ** Math.min(this.tries, 4))); }
    parse() {
      for (;;) {
        const b = this.buf; if (b.length < 2) return;
        let m = 1, v = 0, i = 1, d;
        do { if (i >= b.length) return; d = b[i++]; v += (d & 127) * m; m *= 128; } while (d & 128);
        if (b.length < i + v) return;
        const t = b[0] >> 4, body = b.subarray(i, i + v); this.buf = b.slice(i + v);
        if (t === 2) {   // CONNACK
          if (body[1] !== 0) { try { this.ws.close(); } catch (e) { /* ok */ } return; }
          this.ok = true; this.tries = 0;
          this.ping = setInterval(() => { try { this.ws.send(Uint8Array.of(0xC0, 0)); } catch (e) { /* ok */ } }, 20000);
          this.subs.forEach(s => this.sendSub(s));
          this.emit('up');
        } else if (t === 3) {   // PUBLISH (QoS 0)
          const tl = (body[0] << 8) | body[1], topic = td.decode(body.subarray(2, 2 + tl));
          this.emit('msg', topic, td.decode(body.subarray(2 + tl)));
        }
      }
    }
    sendSub(topic) { try { this.ws.send(pkt(0x82, [0, 1, ...str(topic), 0])); } catch (e) { /* ok */ } }
    sub(topic) { this.subs.add(topic); if (this.ok) this.sendSub(topic); }
    pub(topic, text) { if (!this.ok) return false; const t = str(topic), p = te.encode(text); const b = new Uint8Array(t.length + p.length); b.set(t); b.set(p, t.length); try { this.ws.send(pkt(0x30, b)); return true; } catch (e) { return false; } }
    close() { this.dead = true; clearTimeout(this.rt); clearInterval(this.ping); const ws = this.ws; this.ws = null; this.ok = false; if (ws) { try { ws.send(Uint8Array.of(0xE0, 0)); } catch (e) { /* ok */ } try { ws.close(); } catch (e) { /* ok */ } } }
  }

  /* ---------------- шифрування й адреси ---------------- */
  const b64 = a => btoa(String.fromCharCode(...new Uint8Array(a)));
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const sha = async s => new Uint8Array(await crypto.subtle.digest('SHA-256', te.encode(s)));
  const hex = a => [...a].map(x => x.toString(16).padStart(2, '0')).join('');
  const KEYS = {};
  const aesKey = (code, k) => KEYS[code + '|' + k] || (KEYS[code + '|' + k] = sha('gutirky-fi|' + code + '|' + (k || '')).then(h => crypto.subtle.importKey('raw', h, 'AES-GCM', false, ['encrypt', 'decrypt'])));
  const hostTopic = async id => NS + 'h/' + hex(await sha('gutirky-fi:' + id)).slice(0, 32);
  async function seal(key, obj) { const iv = crypto.getRandomValues(new Uint8Array(12)); const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await key, te.encode(JSON.stringify(obj))); return JSON.stringify({ v: 1, iv: b64(iv), ct: b64(ct) }); }
  async function open(key, text) { try { const e = JSON.parse(text); const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(e.iv) }, await key, unb64(e.ct)); return JSON.parse(td.decode(pt)); } catch (e) { return null; } }
  const codeOf = id => String(id || '').replace(/^.*-/, '');   // gutirka-123456 / gutirky-skob-123456 → 123456

  /* ---------------- запасний «Peer» поверх брокерів ---------------- */
  const PART = 30000;   // великі повідомлення (картинки для пульта) — частинами
  class RelayConn extends Em {
    constructor(peer, cid, to, key) { super(); this.p = peer; this.cid = cid; this.to = to; this.key = key; this.open = false; this.parts = {}; this.peer = to; }
    send(d) {
      if (!this.open) return;
      const s = JSON.stringify(d), mid = rnd(10);
      if (s.length <= PART) return this.p.out(this.to, this.key, { k: 'data', cid: this.cid, from: this.p.inbox, s });
      const n = Math.ceil(s.length / PART);
      for (let i = 0; i < n; i++) this.p.out(this.to, this.key, { k: 'part', cid: this.cid, from: this.p.inbox, m: mid, i, n, s: s.slice(i * PART, (i + 1) * PART) });
    }
    got(m) {
      let s = m.s;
      if (m.k === 'part') { const P = this.parts[m.m] = this.parts[m.m] || []; P[m.i] = m.s; if (P.filter(x => x != null).length < m.n) return; s = P.join(''); delete this.parts[m.m]; }
      let d; try { d = JSON.parse(s); } catch (e) { return; }
      this.emit('data', d);
    }
    close() { if (!this.open) return; this.open = false; this.p.out(this.to, this.key, { k: 'close', cid: this.cid, from: this.p.inbox }); delete this.p.conns[this.cid]; setTimeout(() => this.emit('close'), 0); }
  }
  class RelayPeer extends Em {
    constructor(id) {
      super();
      this.id = id || 'r' + rnd(14); this.host = typeof id === 'string' && !!id; /* гутірка чи гра — під своїм кодом; телефон — без імені */ this.conns = {}; this.seen = new Set(); this.disconnected = false; this.destroyed = false; this.isOpen = false;
      this.code = codeOf(this.id);
      this.brokers = BROKERS().map(u => new Mqtt(u));
      (async () => {
        this.inbox = this.host ? await hostTopic(this.id) : NS + 'p/' + this.id;
        this.brokers.forEach(b => {
          b.on('up', () => { if (!this.isOpen && !this.destroyed) { this.isOpen = true; this.emit('open', this.id); } });
          b.on('msg', (t, text) => { if (t === this.inbox) this.inMsg(text); });
          b.sub(this.inbox);
        });
      })();
      this.failT = setTimeout(() => { if (!this.isOpen && !this.destroyed) this.emit('error', { type: 'network' }); }, 15000);
    }
    up() { return this.brokers.some(b => b.ok); }
    out(to, key, msg) {
      msg.mid = rnd(10);
      seal(key, msg).then(text => { this.brokers.forEach(b => b.pub(to, text)); });
    }
    async inMsg(text) {
      // гутірка: пробуємо ключ з QR, тоді — лише код (пульт, де код ввели вручну); пульт: ключ свого зʼєднання
      let m = null, key = null;
      if (this.host) { for (const k of [window.GUTIRKA_NET_KEY || '', '']) { key = aesKey(this.code, k); m = await open(key, text); if (m) break; } }
      else for (const c of Object.values(this.conns)) { m = await open(c.key, text); if (m) { key = c.key; break; } }
      if (!m || this.seen.has(m.mid)) return;
      this.seen.add(m.mid); if (this.seen.size > 800) this.seen = new Set([...this.seen].slice(-400));
      let c = this.conns[m.cid];
      if (m.k === 'conn' && this.host) {
        if (!c) { c = this.conns[m.cid] = new RelayConn(this, m.cid, m.from, key); c.open = true; this.emit('connection', c); setTimeout(() => c.emit('open'), 0); }
        this.out(m.from, key, { k: 'ack', cid: m.cid, from: this.inbox });
      } else if (m.k === 'ack' && c && !c.open) { c.open = true; clearInterval(c.knock); c.emit('open'); }
      else if ((m.k === 'data' || m.k === 'part') && c) c.got(m);
      else if (m.k === 'close' && c) { c.open = false; delete this.conns[m.cid]; c.emit('close'); }
    }
    connect(id) {
      const cid = rnd(12), key = aesKey(codeOf(id), window.GUTIRKA_NET_KEY || '');
      const c = this.conns[cid] = new RelayConn(this, cid, null, key);
      hostTopic(id).then(to => {
        c.to = to; c.peer = id;
        const knock = () => { if (!c.open && !this.destroyed) this.out(to, key, { k: 'conn', cid, from: this.inbox }); };
        knock(); c.knock = setInterval(knock, 2500);   // повторюємо, поки гутірка не відповість
        setTimeout(() => { if (!c.open) { clearInterval(c.knock); c.emit('error', { type: 'peer-unavailable' }); } }, 12000);
      });
      return c;
    }
    destroy() { this.destroyed = true; clearTimeout(this.failT); Object.values(this.conns).forEach(c => { try { c.close(); } catch (e) { /* ok */ } clearInterval(c.knock); }); this.brokers.forEach(b => b.close()); }
    disconnect() {} reconnect() {}
  }

  /* ---------------- спільний Peer: PeerJS + запасний одночасно ---------------- */
  window.GutirkaNet = function (PJ) {
    class NetConn extends Em {
      constructor(peer, id, opts) {
        super(); this.peer = id; this.open = false; this.win = null; this.tries = []; this.failed = 0; this.n = 0;
        const add = c => {
          this.n++; this.tries.push(c);
          c.on('open', () => {
            if (this.win || this.closed) { if (this.win !== c) try { c.close(); } catch (e) { /* ok */ } return; }
            this.win = c; this.open = true;
            this.tries.forEach(x => { if (x !== c) try { x.close(); } catch (e) { /* ok */ } });
            c.on('data', d => this.emit('data', d));
            c.on('close', () => { if (this.win === c) { this.open = false; this.emit('close'); } });
            this.emit('open');
          });
          c.on('error', e => { if (this.win === c) { this.emit('error', e); return; } if (++this.failed >= this.need()) { peer.emit('error', e && e.type ? e : { type: 'peer-unavailable' }); this.emit('error', e); } });
        };
        this.need = () => peer.inner.length;
        peer.inner.forEach(p => { if (p.isUp) { try { add(p.connect(id, opts)); } catch (e) { this.failed++; } } else p._gq.push(() => { if (!this.win && !this.closed) try { add(p.connect(id, opts)); } catch (e) { this.failed++; } }); });
      }
      send(d) { if (this.win) this.win.send(d); }
      close() { this.closed = true; this.open = false; this.tries.forEach(c => { try { c.close(); } catch (e) { /* ok */ } }); }
    }
    class NetPeer extends Em {
      constructor(id, opts) {
        super(); this.id = id; this.inner = []; this.destroyed = false; this.opened = false; this.errs = 0;
        const add = (p, kind) => {
          p.kind = kind; p.isUp = false; p._gq = []; this.inner.push(p);
          p.on('open', pid => { p.isUp = true; if (!this.id) this.id = pid; p._gq.splice(0).forEach(f => f()); if (!this.opened) { this.opened = true; this.emit('open', this.id); } });
          p.on('connection', c => this.emit('connection', c));
          p.on('error', e => {
            const ty = e && e.type;
            if (ty === 'unavailable-id' || ty === 'browser-incompatible') { this.emit('error', e); return; }   // код зайнятий — гутірка сама візьме інший
            if (ty === 'peer-unavailable') return;   // це вирішує NetConn
            p.isUp = false;
            if (!this.inner.some(x => x.isUp)) this.emit('error', e);   // помилка лише тоді, коли не працює жоден шлях
          });
          p.on('disconnected', () => {
            p.isUp = false;
            if (!this.inner.some(x => x.isUp)) { this.emit('disconnected'); return; }
            // інший шлях працює — цей відновлюємо самі, тихо
            const again = () => { if (this.destroyed || p.destroyed || !p.disconnected) return; try { p.reconnect(); } catch (e) { /* ok */ } setTimeout(again, 10000); };
            setTimeout(again, 3000);
          });
          p.on('close', () => { p.isUp = false; if (!this.destroyed && !this.inner.some(x => x.isUp)) this.emit('close'); });
        };
        if (PJ) { try { add(new PJ(id, opts), 'peerjs'); } catch (e) { /* без PeerJS */ } }
        try { add(new RelayPeer(id), 'relay'); } catch (e) { /* без запасного */ }
      }
      get disconnected() { return !this.inner.some(x => x.isUp); }
      connect(id, opts) { return new NetConn(this, id, opts); }
      reconnect() { this.inner.forEach(p => { if (p.disconnected && !p.destroyed) try { p.reconnect(); } catch (e) { /* ok */ } }); }
      destroy() { this.destroyed = true; this.inner.forEach(p => { try { p.destroy(); } catch (e) { /* ok */ } }); }
    }
    return NetPeer;
  };
  window.GutirkaNet.RelayPeer = RelayPeer;
})();
</script>
<script>
(function () {
  'use strict';
  const $ = s => document.querySelector(s), K = window.KATALOG;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const h = new URLSearchParams(location.hash.slice(1)), CODE = (h.get('c') || '').replace(/\D/g, ''), KEY = h.get('k') || '';
  const PREF = ['gutirky:', 'proba-vhody:'];
  const get = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
  const kodTut = () => PREF.map(p => get(p + 'kod')).find(Boolean) || '';
  const PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>';
  function show(id) { ['msg', 'kod', 'menu'].forEach(x => { $('#s-' + x).hidden = x !== id; }); $('#ctl').hidden = id !== 'ctl'; $('#top').hidden = id === 'ctl'; $('#b-blk').hidden = id !== 'menu'; }
  const msg = (t, p, again) => { $('#m-h').textContent = t; $('#m-p').textContent = p; $('#m-again').hidden = !again; show('msg'); };
  const najty = id => Object.values(K).flat().find(x => x.id === id);

  /* ---------- меню ---------- */
  const TABS = [['gut', 'Гутірки'], ['ihry', 'Ігри'], ['inshe', 'Пісні й ще']];
  let tab = 'gut', ST = {}, chekaiu = '';
  function malTabs() {
    $('#tabs').innerHTML = TABS.map(([k, n]) => `<button aria-pressed="${k === tab}" data-t="${k}">${n}</button>`).join('');
    $('#tabs').querySelectorAll('button').forEach(b => b.onclick = () => { tab = b.dataset.t; malTabs(); malList(); });
  }
  function malList() {
    $('#list').innerHTML = K[tab].map(x => { const cur = ST.open === x.id;
      return `<button class="it${cur ? ' cur' : ''}" data-id="${x.id}" style="--c:${x.c}"><span class="im"${x.img ? ` style="background-image:url(${x.img})"` : ''}>${x.img ? '' : x.i || ''}</span>` +
        `<span class="tx"><b>${esc(x.n)}</b><small>${cur ? '● Зараз на проєкторі' : chekaiu === x.id ? 'Відкриваємо…' : esc(x.s || '')}</small></span><span class="go">${PLAY}</span></button>`; }).join('');
    $('#list').querySelectorAll('.it').forEach(b => b.onclick = () => { const id = b.dataset.id; if (ST.open === id) { ctl(); return; } chekaiu = id; send({ t: 'open', id }); malList(); });
  }

  /* ---------- відкрите: «Екран» — кнопки зі сторінки на проєкторі; «Пульт» — пульт гутірки чи ведучого, підключається сам ---------- */
  let pultFor = '', vyd = '', vydFor = '', EKR = null;
  function vyglyad(v) {
    vyd = v; $('#seg').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v));
    const p = v === 'pult' && ST.pu;
    $('#pf').hidden = !p; $('#ekr').hidden = !!p; $('#sc').hidden = !!p;
    if (p && pultFor !== ST.pu) { pultFor = ST.pu; $('#pf').src = ST.pu; }
  }
  function ctl() {
    const it = najty(ST.open); if (!it) { show('menu'); malList(); return; }
    $('#c-n').textContent = it.n;
    $('#seg').hidden = !ST.pu;
    $('#seg-p').textContent = it.id === 'svoya-hra' ? 'Пульт ведучого' : 'Пульт';
    if (vydFor !== it.id + !!ST.pu) { vydFor = it.id + !!ST.pu; vyd = it.k === 'gut' && ST.pu ? 'pult' : 'ekr'; }   // гутірка — одразу пульт; гра й інше — кнопки екрана
    if (!ST.pu && vyd === 'pult') vyd = 'ekr';
    if (!ST.pu) { pultFor = ''; $('#pf').src = 'about:blank'; }
    vyglyad(vyd); malEkr();
    show('ctl');
  }
  $('#seg').querySelectorAll('button').forEach(b => b.onclick = () => vyglyad(b.dataset.v));
  function malEkr() {
    const e = EKR, g = $('#eg');
    if (!e || e.id !== ST.open) { g.innerHTML = '<p class="pr">Завантажуємо…</p>'; return; }
    $('#eh').textContent = e.ov ? 'Вікно на проєкторі' : 'Кнопки на проєкторі зараз'; $('#eh').className = 'eh' + (e.ov ? ' ov' : '');
    if (!e.items.length) { g.innerHTML = '<p class="pr">Тут немає кнопок — гортайте нижче.</p>'; return; }
    g.innerHTML = e.items.map(x => `<button class="eb${x.on ? ' on' : ''}${x.gol ? ' gol' : ''}${x.typ === 'txt' ? ' txt' : ''}${(x.n.length > 16 || x.s || x.gol) ? ' w' : ''}" data-i="${x.i}">${esc(x.n)}${x.s ? `<small>${esc(x.s)}</small>` : ''}</button>`).join('');
    g.querySelectorAll('.eb').forEach(b => b.onclick = () => {
      const x = e.items[+b.dataset.i];
      if (x.typ === 'txt') { const v = prompt(x.n, x.v || ''); if (v !== null) send({ t: 'txt', i: x.i, v }); return; }
      send({ t: 'tap', i: x.i }); try { navigator.vibrate && navigator.vibrate(12); } catch (er) { /* ok */ } b.style.opacity = '.6';
    });
  }
  /* пульт у рамці — без власного логотипа (він уже є вгорі) */
  $('#pf').addEventListener('load', () => { try { const d = $('#pf').contentDocument; const st = d.createElement('style'); st.textContent = '.hd .logo{display:none}'; d.head.appendChild(st); } catch (e) { /* ok */ } });
  function onStan(s) {
    const was = ST.open; ST = s;
    if (s.open && chekaiu === s.open) chekaiu = '';
    ['#b-blk', '#b-blk2'].forEach(b => $(b).classList.toggle('on', !!s.blk));
    $('#b-blk').textContent = s.blk ? '▶ Показати' : '⏸ Пауза'; $('#b-blk2').textContent = s.blk ? '▶' : '⏸';
    if (s.open) { if (was !== s.open || !$('#ctl').hidden) ctl(); else malList(); }
    else { pultFor = ''; $('#pf').src = 'about:blank'; if (!$('#ctl').hidden || $('#s-menu').hidden) { show('menu'); malTabs(); } malList(); }
  }

  /* ---------- звʼязок ---------- */
  let conn = null, peer = null, att = 0, okd = false, sent = '';
  const LIBS = ['https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.5/peerjs.min.js', 'https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js', 'https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js'];
  const load = src => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => { s.remove(); rej(); }; document.head.appendChild(s); });
  async function getPeer() {
    if (window.TV_TEST_PEER) return window.TV_TEST_PEER;
    if (!window.Peer) for (const u of LIBS) { try { await load(u); if (window.Peer) break; } catch (e) { /* наступне */ } }
    if (window.GutirkaNet) return window.GutirkaNet(window.Peer || null);
    if (window.Peer) return window.Peer;
    throw new Error('lib');
  }
  const dot = (ok, t) => { $('#dot').className = 'pil' + (ok ? ' ok' : ''); $('#dot').querySelector('span').textContent = t; };
  function send(m) { try { if (conn && conn.open) { conn.send(m); return true; } } catch (e) { /* ok */ } return false; }
  function connect() {
    if (!CODE) { msg('Немає коду', 'Відскануйте QR-код на проєкторі ще раз.'); return; }
    const my = ++att; if (!okd) msg('Підключаємось…', 'Шукаємо проєктор.'); dot(false, 'Підключаємось');
    try { if (conn) conn.close(); if (peer) peer.destroy(); } catch (e) { /* ok */ }
    (async () => {
      let P; try { P = await getPeer(); } catch (e) { msg('Немає звʼязку', 'Не вдалося завантажити звʼязок. Перевірте інтернет.', true); return; }
      if (my !== att) return;
      window.GUTIRKA_NET_KEY = KEY;
      const p = peer = new P(undefined, {});
      const fail = () => { if (my !== att || (conn && conn.open)) return; if (okd) { dot(false, 'Немає звʼязку'); setTimeout(() => my === att && connect(), 4000); } else msg('Проєктор не знайдено', 'Перевірте, що на проєкторі відкрито екран з QR-кодом, і спробуйте ще раз.', true); };
      const tmo = setTimeout(fail, 15000);
      p.on('error', () => { clearTimeout(tmo); fail(); });
      p.on('open', () => {
        if (my !== att) return;
        const c = conn = p.connect('plast-tv-' + CODE, { reliable: true });
        c.on('open', () => { clearTimeout(tmo); dot(true, 'Проєктор'); });
        c.on('data', d => {
          if (!d || my !== att) return;
          if (d.t === 'hi') { const k = kodTut(); if (k) { sent = k; send({ t: 'vhid', kod: k }); } else { show('kod'); setTimeout(() => $('#kod').focus(), 50); } }
          else if (d.t === 'vhid-ok') { okd = true; if (sent) PREF.forEach(p => { try { localStorage.setItem(p + 'vyh', 'true'); localStorage.setItem(p + 'kod', JSON.stringify(sent)); } catch (e) { /* ok */ } });
            try { navigator.vibrate && navigator.vibrate(30); } catch (e) { /* ok */ } if ($('#ctl').hidden) { show('menu'); malTabs(); malList(); } }
          else if (d.t === 'vhid-err') { PREF.forEach(p => { try { localStorage.removeItem(p + 'kod'); } catch (e) { /* ok */ } }); show('kod'); $('#k-err').hidden = !sent; $('#kod').value = ''; }
          else if (d.t === 'stan') onStan(d);
          else if (d.t === 'ekr') { EKR = d; if (!$('#ctl').hidden) malEkr(); }
          else if (d.t === 'vyishly') { okd = false; msg('Відʼєднано', 'Телефон більше не керує проєктором. Щоб знову — відскануйте QR.'); }
        });
        c.on('close', () => { if (my !== att) return; dot(false, 'Немає звʼязку'); setTimeout(() => my === att && connect(), 2500); });
      });
    })();
  }
  $('#f-kod').onsubmit = e => { e.preventDefault(); const v = $('#kod').value.replace(/\s/g, ''); if (!v) return; $('#k-err').hidden = true; sent = v; send({ t: 'vhid', kod: v }); };
  $('#b-menu').onclick = () => { show('menu'); malTabs(); malList(); };
  $('#b-zak').onclick = () => send({ t: 'menu' });
  $('#b-blk').onclick = $('#b-blk2').onclick = () => send({ t: 'blk' });
  $('#b-out').onclick = () => send({ t: 'vyity' });
  $('#m-again').onclick = connect;
  document.querySelectorAll('[data-sc]').forEach(b => b.addEventListener('click', () => send({ t: 'scroll', n: +b.dataset.sc })));
  addEventListener('visibilitychange', () => { if (!document.hidden && okd && !(conn && conn.open)) connect(); });
  connect();
})();
