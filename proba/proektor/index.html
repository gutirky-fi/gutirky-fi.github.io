<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Пластова бібліотека · проєктор</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Oswald:wght@500;600&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* ═══ СТАНДАРТ СТИЛЮ — кольори, шрифти, заокруглення, висота кнопок. Спільний для всіх сторінок. ═══ */
:root{
  /* основа — темний екран */
  --s-bg:#1b1d21; --s-card:#22262b; --s-card2:#2a2f35; --s-pole:#14171a; --s-ln:#383d44;
  --s-ink:#f2f4f6; --s-body:#cfd5dc; --s-mut:#a0a8b2;
  /* улади: колір показує, для кого сторінка; «-t» — світліший, для тексту на темному; «-on» — текст на кнопці цього кольору */
  --s-upn:#ffd23f; --s-upn-on:#1d1606;
  --s-upyu:#c8284a; --s-upyu-t:#ff7d99; --s-upyu-on:#ffffff;
  --s-vyh:#3daf6e; --s-vyh-t:#62cf93; --s-vyh-on:#0e1f15;
  --s-ups:#b0773a;
  --s-all:#c9cfd6;
  --s-all4:linear-gradient(90deg,var(--s-upn) 0 25%,var(--s-upyu) 0 50%,var(--s-vyh) 0 75%,var(--s-ups) 0);
  /* службові */
  --s-ihry:#ffc247; --s-ihry-on:#1d1606;
  --s-hand:#2fd2c0; --s-ol:#9fb57a;
  --s-ok:#62cf93; --s-uvaga:#f0c060; --s-pomylka:#ff6a6a;
  /* папір (бланки, звіти, PDF) */
  --s-p-bg:#ffffff; --s-p-ink:#1d2125; --s-p-mut:#5f6873; --s-p-ln:#cfd5dc; --s-p-ac:#c8284a; --s-p-th:#f9e6ea;
  /* шрифти */
  --s-disp:Oswald,'Arial Narrow',sans-serif; --s-txt:'Source Sans 3',system-ui,sans-serif; --s-ruka:Caveat,'Segoe Print',cursive;
  /* заокруглення: кнопка й поле 12, плитка 18, велика картка й вікно 20, пігулка кругла; дрібні деталі: мітка 6, смужка 3 */
  --s-r:12px; --s-r-plytka:18px; --s-r-karta:20px; --s-r-pil:99px; --s-r-mitka:6px; --s-r-smuzhka:3px;
  /* висота: звичайна кнопка й поле 50, головна кнопка гри 54 */
  --s-h:50px; --s-h-hra:54px;
}
/* ═══ КНОПКИ — одна реакція на всіх сторінках ═══
   навели: рамка кольором розділу (головна кнопка — біла рамка) · натиснули: темнішає й опускається ·
   клавіатура або пульт: біла обвідка · недоступна: бліда · «видалити»: не залита, червоний напис */
:root :is(button,a,summary,[role=button],[tabindex]):focus-visible{outline:3px solid var(--s-ink);outline-offset:2px}
:root .btn:where(:not(.main,.ok,[disabled])):hover{border-color:var(--ak,var(--d-t,var(--gd,var(--ab,var(--a,var(--s-ink))))));box-shadow:0 0 0 1px var(--ak,var(--d-t,var(--gd,var(--ab,var(--a,var(--s-ink))))))}
:root .btn:is(.main,.ok):where(:not([disabled])):hover{border-color:var(--s-ink);box-shadow:0 0 0 1px var(--s-ink)}
:root .btn:where(:not([disabled])):active{transform:translateY(2px);filter:brightness(.88)}
:root .btn[disabled]{opacity:.45;cursor:not-allowed}
:root .btn.neb,:root .btn.warn{background:var(--s-card2);border-color:var(--s-ln);color:var(--s-pomylka)}
:root .btn:is(.neb,.warn):where(:not([disabled])):hover,:root .btn.warn.sure{border-color:var(--s-pomylka);box-shadow:0 0 0 1px var(--s-pomylka)}
:root .btn.warn.sure{background:rgba(255,106,106,.14)}
/* ═══ кінець стандарту ═══ */

/* Екран проєктора: один кадр 16:9 без гортання. 1rem = 1/80 ширини кадру (на 1280×720 — 16px). Кольори й шрифти — зі стандарту сайту. */
html{font-size:calc(min(100vw,177.78vh)/80)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--s-bg);cursor:none}
body{color:var(--s-ink);font:400 1.1rem/1.35 var(--s-txt)}
#app{position:absolute;inset:0;margin:auto;width:80rem;height:45rem;padding:3.2rem 4.5rem;display:grid;grid-template-columns:minmax(0,1fr) 22rem;grid-template-rows:auto 1fr auto;column-gap:5rem}
#app::after{content:'';position:absolute;left:0;right:0;bottom:0;height:.45rem;background:var(--s-all4)}
.logo{height:3.6rem;grid-column:1;align-self:start}
.ttl{grid-column:1;grid-row:2;align-self:center}
.k{font:600 1.05rem var(--s-txt);letter-spacing:.3em;text-transform:uppercase;color:var(--s-mut)}
h1{font:600 6.2rem/.92 var(--s-disp);text-transform:uppercase;margin:.8rem 0 0;letter-spacing:.005em}
.strip{width:16rem;height:.45rem;border-radius:var(--s-r-smuzhka);background:var(--s-all4);margin:1.6rem 0 1.1rem}
.ruka{font:600 2.4rem var(--s-ruka);color:var(--s-hand)}
.qrb{grid-column:2;grid-row:1/4;align-self:center;display:flex;flex-direction:column;align-items:center;text-align:center}
.qr{width:22rem;height:22rem;line-height:0;border-radius:var(--s-r-plytka);box-shadow:0 0 0 1px rgba(98,207,147,.35),0 0 2rem -.4rem rgba(61,175,110,.45);overflow:hidden}
.qr svg{width:100%;height:100%;display:block}
.qrb b{font:600 1.7rem/1.1 var(--s-disp);text-transform:uppercase;margin-top:1.4rem}
.qrb span{color:var(--s-body);font-size:1.15rem;margin-top:.4rem}
.pil{margin-top:1.2rem;display:inline-flex;align-items:center;gap:.5rem;padding:.5rem 1.1rem;border-radius:var(--s-r-pil);border:1px solid var(--s-ln);background:var(--s-card);font-weight:700;font-size:1.05rem;color:var(--s-mut)}
.pil i{width:.7rem;height:.7rem;border-radius:50%;background:var(--s-uvaga)}
.pil.ok{color:var(--s-ok)}.pil.ok i{background:var(--s-ok)}
.niz{grid-column:1;grid-row:3;color:var(--s-mut);font-size:1.15rem;align-self:end}
/* телефон уже керує: великий напис, QR менший (для другого телефона) */
body.tel .ttl .k{color:var(--s-vyh-t)}
#zar{display:none;margin-top:1.4rem;font:600 2rem/1.2 var(--s-txt);color:var(--s-body)}
body.tel #zar{display:block}
body.tel .qr{width:13rem;height:13rem}
body.tel .qrb b{font-size:1.2rem}body.tel .qrb span{font-size:1rem}
/* відкрите — на весь екран */
#fr{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000;z-index:10}
#fr[hidden]{display:none}
#blk{position:fixed;inset:0;background:#000;z-index:30}
#blk[hidden]{display:none}
#load{position:fixed;inset:0;z-index:20;background:var(--s-bg);display:flex;align-items:center;justify-content:center;font:600 2.4rem var(--s-disp);text-transform:uppercase;color:var(--s-mut)}
#load[hidden]{display:none}
#tst{position:fixed;z-index:40;left:50%;bottom:1.6rem;transform:translateX(-50%);padding:.6rem 1.3rem;border-radius:var(--s-r-pil);background:var(--s-card);border:1px solid var(--s-ln);color:var(--s-ok);font-weight:700;font-size:1.1rem;transition:opacity .4s}
#tst.off{opacity:0}
</style>
</head>
<body>
<div id="app">
  <img class="logo" src="/proba/tv/img/plast-fi-logo-hd.png" alt="Пласт">
  <div class="ttl">
    <div class="k" id="k">Пласт у Фінляндії · проєктор</div>
    <h1>Пластова<br>бібліотека</h1>
    <div class="strip"></div>
    <div class="ruka">гутірки, ігри й пісні — на весь екран</div>
    <div id="zar">Виберіть на телефоні, що показати.</div>
  </div>
  <div class="niz" id="niz">Наведіть камеру телефона на QR-код праворуч.</div>
  <div class="qrb">
    <div class="qr" id="qr"></div>
    <b id="qb">Скануйте телефоном виховника</b>
    <span id="qs">На телефоні буде все: гутірки, ігри, пісні.</span>
    <div class="pil" id="st"><i></i><span>Підключаємось…</span></div>
  </div>
</div>
<iframe id="fr" hidden allow="autoplay; fullscreen; wake-lock" title="Відкрите на проєкторі"></iframe>
<div id="load" hidden>Відкриваємо…</div>
<div id="blk" hidden></div>
<div id="tst" class="off"></div>
<script>window.KATALOG = {"gut": [{"id": "g-budova-la-1", "k": "gut", "n": "Будова літальних апаратів І", "s": "презентація з пультом", "u": "/gutirky/budova-la-1/#hutirka", "p": 1, "i": "📖", "c": "#b0673d", "img": "/proba/tv/img/budova-la-1.webp"}, {"id": "g-keramika-1", "k": "gut", "n": "Кераміка І", "s": "презентація з пультом", "u": "/gutirky/keramika-1/#hutirka", "p": 1, "i": "📖", "c": "#3d6fb0", "img": "/proba/tv/img/keramika-1.webp"}], "ihry": [{"id": "skob-hra", "n": "Потужний СКОБ!", "s": "вікторина з телефонів юнаків", "p": 1, "i": "⚡", "c": "#d6463c", "k": "ihry", "u": "/proba/skob-hra/?dyz=3"}, {"id": "svoya-hra", "n": "Змаг", "s": "команди, теми, бали", "p": 0, "i": "🏆", "c": "#c4a032", "k": "ihry", "u": "/proba/svoya-hra/?dyz=3"}, {"id": "bingo", "n": "Бінго", "s": "картки на телефонах", "p": 1, "i": "🎱", "c": "#3d6fb0", "k": "ihry", "u": "/proba/bingo/?dyz=3"}, {"id": "opytuvannia", "n": "Швидке опитування", "s": "голосування з телефонів", "p": 1, "i": "📊", "c": "#3daf6e", "k": "ihry", "u": "/proba/opytuvannia/?dyz=3"}, {"id": "novyi-vykhovnyk", "n": "Вгадай, хто?", "s": "знайомство: факти про себе", "p": 0, "i": "🕵️", "c": "#8a4fb0", "k": "ihry", "u": "/proba/novyi-vykhovnyk/?dyz=3"}, {"id": "hto", "n": "Жеребкування", "s": "хто наступний, групи й пари", "p": 0, "i": "🎲", "c": "#5a6470", "k": "ihry", "u": "/proba/hto/?dyz=3"}], "inshe": [{"id": "vsi", "k": "inshe", "n": "Співаник і підказки", "s": "пісні, вузли, Морзе, орієнтування", "u": "/?tv=0#vsi", "p": 0, "tv": 1, "i": "🔥", "c": "#d98a2b"}, {"id": "yun", "k": "inshe", "n": "Юнацтво", "s": "вмілості, «Вивчай сам», «Перевір себе»", "u": "/?tv=0#yun", "p": 0, "tv": 1, "i": "🎯", "c": "#d6467e"}]};</script>
<script>/* Мінімальний генератор QR-коду (режим Byte, рівні L/M, версії 1–10, до ~170 байт).
   Без зовнішніх бібліотек. Використання: qrSvg("https://…", 240) → рядок <svg>. */
(function (root) {
  'use strict';
  const ECL = {
    L: { bits: 1, ecc: [7, 10, 15, 20, 26, 18, 20, 24, 30, 18], blocks: [1, 1, 1, 1, 1, 2, 2, 2, 2, 4] },
    M: { bits: 0, ecc: [10, 16, 26, 18, 24, 16, 18, 22, 22, 26], blocks: [1, 1, 1, 2, 2, 4, 4, 4, 5, 5] },
    H: { bits: 2, ecc: [17, 28, 22, 16, 22, 28, 26, 26, 24, 28], blocks: [1, 1, 2, 4, 4, 4, 5, 6, 8, 8] }   /* найвища надійність: витримує знак посередині */
  };
  const RAW = [26, 44, 70, 100, 134, 172, 196, 242, 292, 346];
  const ALIGN = [[], [6, 18], [6, 22], [6, 26], [6, 30], [6, 34], [6, 22, 38], [6, 24, 42], [6, 26, 46], [6, 28, 50]];
  const EXP = new Array(512), LOG = new Array(256);
  (function () { let x = 1; for (let i = 0; i < 255; i++) { EXP[i] = x; LOG[x] = i; x <<= 1; if (x & 256) x ^= 0x11d; } for (let i = 255; i < 512; i++) EXP[i] = EXP[i - 255]; })();
  const mul = (a, b) => (a && b ? EXP[LOG[a] + LOG[b]] : 0);
  function gen(n) { let g = [1]; for (let i = 0; i < n; i++) { const ng = new Array(g.length + 1).fill(0); for (let j = 0; j < g.length; j++) { ng[j] ^= g[j]; ng[j + 1] ^= mul(g[j], EXP[i]); } g = ng; } return g; }
  function rs(data, n) { const g = gen(n), r = new Array(n).fill(0); for (const b of data) { const f = b ^ r.shift(); r.push(0); for (let i = 0; i < n; i++) r[i] ^= mul(g[i + 1], f); } return r; }
  const bit = (v, i) => ((v >>> i) & 1) !== 0;

  function matrix(text, level) {
    const E = ECL[level], data = Array.from(new TextEncoder().encode(text));
    let ver = 1, dataCap = 0;
    for (; ver <= 10; ver++) {
      dataCap = RAW[ver - 1] - E.ecc[ver - 1] * E.blocks[ver - 1];
      if (4 + (ver < 10 ? 8 : 16) + data.length * 8 <= dataCap * 8) break;
    }
    if (ver > 10) throw new Error('QR: надто довгий текст');
    const bb = [], put = (v, n) => { for (let i = n - 1; i >= 0; i--) bb.push((v >>> i) & 1); };
    put(4, 4); put(data.length, ver < 10 ? 8 : 16); data.forEach(b => put(b, 8));
    const cap = dataCap * 8; put(0, Math.min(4, cap - bb.length)); while (bb.length % 8) bb.push(0);
    for (let p = 0xec; bb.length < cap; p ^= 0xec ^ 0x11) put(p, 8);
    const cw = []; for (let i = 0; i < bb.length; i += 8) { let v = 0; for (let j = 0; j < 8; j++) v = (v << 1) | bb[i + j]; cw.push(v); }
    const nb = E.blocks[ver - 1], el = E.ecc[ver - 1], shortLen = Math.floor(dataCap / nb), longCount = dataCap % nb;
    const blocks = []; let pos = 0;
    for (let i = 0; i < nb; i++) { const len = shortLen + (i >= nb - longCount ? 1 : 0); const d = cw.slice(pos, pos + len); pos += len; blocks.push({ d, e: rs(d, el) }); }
    const out = [];
    for (let i = 0; i < shortLen + (longCount ? 1 : 0); i++) blocks.forEach(b => { if (i < b.d.length) out.push(b.d[i]); });
    for (let i = 0; i < el; i++) blocks.forEach(b => out.push(b.e[i]));

    const size = ver * 4 + 17;
    const m = Array.from({ length: size }, () => new Array(size).fill(false));
    const fn = Array.from({ length: size }, () => new Array(size).fill(false));
    const setF = (x, y, v) => { if (x >= 0 && x < size && y >= 0 && y < size) { m[y][x] = v; fn[y][x] = true; } };
    const finder = (cx, cy) => { for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) { const d = Math.max(Math.abs(dx), Math.abs(dy)); setF(cx + dx, cy + dy, d !== 2 && d !== 4); } };
    for (let i = 0; i < size; i++) { setF(6, i, i % 2 === 0); setF(i, 6, i % 2 === 0); }
    finder(3, 3); finder(size - 4, 3); finder(3, size - 4);
    const al = ALIGN[ver - 1], last = al.length - 1;
    for (let a = 0; a < al.length; a++) for (let b = 0; b < al.length; b++) {
      if ((a === 0 && b === 0) || (a === 0 && b === last) || (a === last && b === 0)) continue;
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) setF(al[a] + dx, al[b] + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
    }
    function drawFormat(mask) {
      const d0 = (E.bits << 3) | mask; let r = d0; for (let i = 0; i < 10; i++) r = (r << 1) ^ ((r >>> 9) * 0x537);
      const bits = ((d0 << 10) | r) ^ 0x5412;
      for (let i = 0; i <= 5; i++) setF(8, i, bit(bits, i));
      setF(8, 7, bit(bits, 6)); setF(8, 8, bit(bits, 7)); setF(7, 8, bit(bits, 8));
      for (let i = 9; i < 15; i++) setF(14 - i, 8, bit(bits, i));
      for (let i = 0; i < 8; i++) setF(size - 1 - i, 8, bit(bits, i));
      for (let i = 8; i < 15; i++) setF(8, size - 15 + i, bit(bits, i));
      setF(8, size - 8, true);
    }
    drawFormat(0);
    if (ver >= 7) {
      let r = ver; for (let i = 0; i < 12; i++) r = (r << 1) ^ ((r >>> 11) * 0x1f25);
      const bits = (ver << 12) | r;
      for (let i = 0; i < 18; i++) { const c = bit(bits, i), a = size - 11 + (i % 3), b = Math.floor(i / 3); setF(a, b, c); setF(b, a, c); }
    }
    let k = 0;
    for (let right = size - 1; right >= 1; right -= 2) {
      if (right === 6) right = 5;
      for (let vert = 0; vert < size; vert++) for (let j = 0; j < 2; j++) {
        const x = right - j, y = ((right + 1) & 2) === 0 ? size - 1 - vert : vert;
        if (!fn[y][x] && k < out.length * 8) { m[y][x] = bit(out[k >>> 3], 7 - (k & 7)); k++; }
      }
    }
    const MASK = [(x, y) => (x + y) % 2 === 0, (x, y) => y % 2 === 0, (x, y) => x % 3 === 0, (x, y) => (x + y) % 3 === 0,
      (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0, (x, y) => ((x * y) % 2) + ((x * y) % 3) === 0,
      (x, y) => (((x * y) % 2) + ((x * y) % 3)) % 2 === 0, (x, y) => (((x + y) % 2) + ((x * y) % 3)) % 2 === 0];
    function apply(mask) { for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (!fn[y][x] && MASK[mask](x, y)) m[y][x] = !m[y][x]; }
    function penalty() {
      let p = 0;
      for (let pass = 0; pass < 2; pass++) for (let a = 0; a < size; a++) {
        let run = 1, prev = null, hist = '';
        for (let b = 0; b < size; b++) {
          const v = pass ? m[b][a] : m[a][b];
          hist += v ? '1' : '0';
          if (v === prev) { run++; if (run === 5) p += 3; else if (run > 5) p++; } else { run = 1; prev = v; }
        }
        const re = /1011101(?=0000)|(?<=0000)1011101/g; let mt; while ((mt = re.exec(hist))) p += 40;
      }
      for (let y = 0; y < size - 1; y++) for (let x = 0; x < size - 1; x++) { const v = m[y][x]; if (v === m[y][x + 1] && v === m[y + 1][x] && v === m[y + 1][x + 1]) p += 3; }
      let dark = 0; for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (m[y][x]) dark++;
      p += Math.floor(Math.abs(dark * 20 - size * size * 10) / (size * size)) * 10;
      return p;
    }
    let best = 0, bp = Infinity;
    for (let mk = 0; mk < 8; mk++) { apply(mk); drawFormat(mk); const p = penalty(); if (p < bp) { bp = p; best = mk; } apply(mk); }
    apply(best); drawFormat(best);
    return m;
  }

  /* logo — картинка (data:…) посередині коду, напр. пластова лілея. Тоді рівень H (до 30 % коду може бути закрито),
     модулі — круглі крапки, «очі» в кутах — заокруглені, а під знаком модулі прибрано (без білої плашки).
     eye — колір «очей» (необов'язково). */

  function dzerkalo(w) {
    try { if (dzMo) dzMo.disconnect(); } catch (e) { /* ok */ }
    dzLast = ''; const go = () => { clearTimeout(dzT); dzT = setTimeout(zbir, 200); };
    try { dzMo = new w.MutationObserver(go); dzMo.observe(w.document.body, { subtree: true, childList: true, attributes: true, characterData: true }); w.addEventListener('scroll', go, { passive: true }); w.addEventListener('resize', go); } catch (e) { /* ok */ }
    go();
  }
  setInterval(() => { if (OPEN && NET.conns.size) zbir(); }, 2500);
  function tap(i) { const e = EL[i]; if (!e || !e.isConnected) { zbir(); return; } try { e.scrollIntoView({ block: 'nearest' }); e.focus({ preventScroll: true }); } catch (x) { /* ok */ } e.click(); setTimeout(zbir, 150); }
  function txt(i, v) { const e = EL[i]; if (!e || !e.isConnected || typeof v !== 'string') return; const w = e.ownerDocument.defaultView;
    e.focus(); e.value = v.slice(0, 80); e.dispatchEvent(new w.Event('input', { bubbles: true })); e.dispatchEvent(new w.Event('change', { bubbles: true })); e.blur(); setTimeout(zbir, 150); }

  function zakryty() {
    OPEN = null; EL = []; dzLast = ''; try { if (dzMo) dzMo.disconnect(); } catch (e) { /* ok */ } PC = PK = PU = '';
    try { sessionStorage.removeItem('gutirka.host'); } catch (e) { /* ok */ }
    const fr = $('#fr'); fr.src = 'about:blank'; fr.hidden = true; $('#load').hidden = true;
    tell(stan());
  }
  function chorny(on) {
    const b = $('#blk'); b.hidden = on === undefined ? !b.hidden : !on; tell(stan());
  }
  /* клавіша з телефона — у відкриту сторінку (як пульт проєктора) */
  function knopka(key) {
    if (!OPEN) return;
    let w, d; try { w = $('#fr').contentWindow; d = w.document; } catch (e) { return; }
    const t = d.activeElement && d.activeElement !== d.body ? d.activeElement : d;
    if (key === 'Enter' && t.click && t.matches && t.matches('a,button,summary,[role=tab],[tabindex],label')) { t.click(); return; }
    const ev = new w.KeyboardEvent('keydown', { key, code: key === ' ' ? 'Space' : key, bubbles: true, cancelable: true });
    t.dispatchEvent(ev);
  }
  function gortaty(n) { try { $('#fr').contentWindow.scrollBy({ top: n * $('#fr').clientHeight * 0.6, behavior: 'smooth' }); } catch (e) { /* ok */ } }

  /* ---------------- звʼязок з телефоном ---------------- */
  const NET = { code: rnd6(), key: rkey(), conns: new Set(), up: false, tries: 0 };
  const url = () => location.origin + '/proba/proektor/telefon.html#c=' + NET.code + '&k=' + NET.key;
  if (window.TV_TEST_PEER) window.__tvUrl = url;
  const viy = () => { try { return sessionStorage.getItem('plast-tv:vhid') === '1'; } catch (e) { return false; } };
  function stan() { return { t: 'stan', in: viy(), open: OPEN ? OPEN.id : '', on: OPEN ? OPEN.n : '', ok: OPEN ? OPEN.k : '', pu: PU, blk: !$('#blk').hidden }; }
  function tell(m) { NET.conns.forEach(c => { try { if (c.open && c.__ok) c.send(m); } catch (e) { /* ok */ } }); }
  let tT = 0;
  function toast(t) { const e = $('#tst'); e.textContent = t; e.classList.remove('off'); clearTimeout(tT); tT = setTimeout(() => e.classList.add('off'), 3000); }
  function malSt() {
    const s = $('#st'), n = [...NET.conns].filter(c => c.__ok).length;
    s.className = 'pil' + (n ? ' ok' : ''); s.querySelector('span').textContent = n ? 'Телефон керує' : NET.up ? 'Чекаємо телефон' : 'Підключаємось…';
    document.body.classList.toggle('tel', !!n);
    $('#k').textContent = n ? 'Телефон виховника підключено' : 'Пласт у Фінляндії · проєктор';
    $('#qb').textContent = n ? 'Ще один телефон' : 'Скануйте телефоном виховника';
    $('#qs').textContent = n ? 'Наприклад, помічника.' : 'На телефоні буде все: гутірки, ігри, пісні.';
    $('#niz').textContent = n ? 'Пауза (чорний екран) і «Закрити» — угорі на телефоні.' : 'Наведіть камеру телефона на QR-код праворуч.';
  }
  function malQR() { $('#qr').innerHTML = window.qrSvg ? qrSvg(url(), 320) : ''; }   // як усі QR на сайті
  function onConn(c) {
    c.on('open', () => { NET.conns.add(c); c.send({ t: 'hi', in: viy() }); });
    c.on('data', d => {
      if (!d || typeof d !== 'object') return;
      if (d.t === 'vhid') {
        if (String(d.kod || '') === CODE) {
          c.__ok = 1;
          try { sessionStorage.setItem('plast-tv:vhid', '1'); PREF.forEach(p => { localStorage.setItem(p + 'vyh', 'true'); localStorage.setItem(p + 'kod', JSON.stringify(CODE)); }); } catch (e) { /* ok */ }
          c.send({ t: 'vhid-ok' }); c.send(stan()); dzLast = ''; zbir(); malSt(); toast('📱 Телефон підключено');
        } else c.send({ t: 'vhid-err' });
        return;
      }
      if (!c.__ok) return;   // керувати можна лише після коду виховника
      if (d.t === 'open') vidkryty(d.id, typeof d.u === 'string' ? d.u : '', typeof d.n === 'string' ? d.n.slice(0, 80) : '');
      else if (d.t === 'menu') { if (OPEN) zakryty(); }
      else if (d.t === 'blk') chorny();
      else if (d.t === 'k' && ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter', ' ', 'Escape'].includes(d.key)) knopka(d.key);
      else if (d.t === 'scroll') gortaty(d.n > 0 ? 1 : -1);
      else if (d.t === 'tap' && Number.isInteger(d.i)) tap(d.i);
      else if (d.t === 'txt' && Number.isInteger(d.i)) txt(d.i, d.v);
      else if (d.t === 'sync') { c.send(stan()); dzLast = ''; zbir(); }
      else if (d.t === 'vyity') { try { sessionStorage.removeItem('plast-tv:vhid'); PREF.forEach(p => { localStorage.removeItem(p + 'vyh'); localStorage.removeItem(p + 'kod'); }); } catch (e) { /* ok */ }
        if (OPEN) zakryty(); NET.conns.forEach(x => { x.__ok = 0; }); c.send({ t: 'vyishly' }); malSt(); }
    });
    c.on('close', () => { NET.conns.delete(c); malSt(); });
    if (c.open) NET.conns.add(c);
  }
  const LIBS = ['https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.5/peerjs.min.js', 'https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js', 'https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js'];
  const load = src => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => { s.remove(); rej(); }; document.head.appendChild(s); });
  async function getPeer() {
    if (window.TV_TEST_PEER) return window.TV_TEST_PEER;
    if (!window.Peer) for (const u of LIBS) { try { await load(u); if (window.Peer) break; } catch (e) { /* наступне */ } }
    if (window.GutirkaNet) return window.GutirkaNet(window.Peer || null);
    if (window.Peer) return window.Peer;
    throw new Error('lib');
  }
  async function host() {
    let P; try { P = await getPeer(); } catch (e) { setTimeout(host, 8000); return; }
    window.GUTIRKA_NET_KEY = NET.key;
    let p; try { p = new P('plast-tv-' + NET.code, {}); } catch (e) { setTimeout(host, 8000); return; }
    p.on('open', () => { NET.up = true; NET.tries = 0; malSt(); });
    p.on('connection', onConn);
    p.on('error', e => {
      if (e && e.type === 'unavailable-id') { try { p.destroy(); } catch (x) { /* ok */ } NET.code = rnd6(); malQR(); host(); return; }
      if (e && e.type === 'peer-unavailable') return;
      NET.up = false; malSt();
    });
    p.on('disconnected', () => { NET.up = false; malSt(); setTimeout(() => { try { p.reconnect(); } catch (x) { /* ok */ } }, Math.min(15000, 1000 * 2 ** NET.tries++)); });
  }
  malQR(); malSt(); host();
})();
</script>
